<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Chapter 5 - Live Test</title>
    <style>
        /* --- MODERN UI STYLE (Theme: Professional Cyan) --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #00C9FF 0%, #92FE9D 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        .quiz-container { background: #fff; width: 100%; max-width: 550px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
        .quiz-header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
        
        .timer-box { background: #e0f7fa; color: #006064; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .question-count { font-size: 14px; color: #666; font-weight: 500; }
        
        .progress-bar { height: 6px; width: 100%; background: #f1f1f1; }
        .progress-fill { height: 100%; background: #00C9FF; width: 0%; transition: width 0.3s ease; }
        
        .quiz-body { padding: 25px 20px; }
        h2#question-text { font-size: 18px; color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; padding: 14px; border-radius: 10px; font-size: 15px; color: #444; cursor: pointer; text-align: left; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #b2ebf2; }
        
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        .quiz-footer { padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #next-btn { background: #00C9FF; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; display: none; }
        #next-btn:hover { background: #0097a7; }
        .home-link { text-decoration: none; color: #666; font-size: 14px; font-weight: 500; }
        
        .result-box { text-align: center; padding: 40px 20px; display: none; }
        .score-circle { width: 120px; height: 120px; background: #00C9FF; color: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4); }
        .score-big { font-size: 32px; font-weight: bold; }
        .score-label { font-size: 12px; opacity: 0.9; }
        .accuracy-text { font-size: 18px; color: #333; margin-bottom: 20px; font-weight: 600; }
        .remarks { color: #666; font-size: 14px; margin-bottom: 30px; }
        .action-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-restart, .btn-home { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 500; text-decoration: none; }
        .btn-restart { background: #00C9FF; color: white; }
        .btn-home { background: #eee; color: #333; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="quiz-header">
            <div class="question-count">Question: <span id="q-index">1</span>/<span id="total-q">5</span></div>
            <div class="timer-box">⏳ <span id="time-left">10:00</span></div>
        </div>
        <div class="quiz-body">
            <h2 id="question-text">प्रश्न लोड हो रहा है...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
        <div class="quiz-footer">
            <a href="economics_chapters.html" class="home-link">Quit Quiz</a>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <div class="score-circle">
            <span class="score-big" id="final-score">0</span>
            <span class="score-label">Score</span>
        </div>
        <div class="accuracy-text" id="accuracy-text">Accuracy: 0%</div>
        <p class="remarks" id="remarks">Well Done!</p>
        <div class="action-btns">
            <button class="btn-restart" onclick="location.reload()">🔄 Retry</button>
            <a href="economics_chapters.html" class="btn-home">📂 Chapter List</a>
        </div>
    </div>
</div>

<script>
    const TOTAL_TIME_MINUTES = 10;
    let timeInSeconds = TOTAL_TIME_MINUTES * 60;
    let timerInterval;

    // ▼▼▼ ECONOMICS CHAPTER 5 QUESTIONS (रोजगार एवं सेवाएँ) ▼▼▼
    const questions = [
        { question: "1. आर्थिक विकास का तीसरा क्षेत्र क्या है?", answers: [ { text: "कृषि क्षेत्र", correct: false }, { text: "विज्ञान क्षेत्र", correct: false }, { text: "शिक्षा क्षेत्र", correct: false }, { text: "सेवा क्षेत्र", correct: true } ] },
        { question: "2. मानव पूंजी के प्रमुख घटक कितने हैं?", answers: [ { text: "6", correct: false }, { text: "4", correct: false }, { text: "5", correct: true }, { text: "8", correct: false } ] },
        { question: "3. कौन बीमारू (BIMARU) राज्य नहीं है?", answers: [ { text: "बिहार", correct: false }, { text: "मध्य प्रदेश", correct: false }, { text: "कर्नाटक", correct: true }, { text: "ओडिशा", correct: false } ] },
        { question: "4. कौन-सी सेवा गैर-सरकारी (Private) है?", answers: [ { text: "सैन्य सेवा", correct: false }, { text: "वित्त सेवा", correct: false }, { text: "मॉल सेवा", correct: true }, { text: "रेल सेवा", correct: false } ] },
        { question: "5. ऊर्जा के मुख्य स्रोत क्या हैं?", answers: [ { text: "कोयला", correct: false }, { text: "पेट्रोलियम", correct: false }, { text: "विद्युत", correct: false }, { text: "इनमें सभी", correct: true } ] },
        { question: "6. 'मनरेगा' शुरू हुई थी?", answers: [ { text: "आंध्र प्रदेश से", correct: true }, { text: "राजस्थान से", correct: false }, { text: "गुजरात से", correct: false }, { text: "कर्नाटक से", correct: false } ] },
        { question: "7. भारत को किस उद्योग के क्षेत्र में अधिक सफलता मिली है?", answers: [ { text: "कम्प्यूटर हार्डवेयर", correct: false }, { text: "कम्प्यूटर सॉफ्टवेयर", correct: true }, { text: "दोनों", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "8. आर्थिक विकास का दूसरा क्षेत्र है?", answers: [ { text: "कृषि क्षेत्र", correct: false }, { text: "उद्योग क्षेत्र", correct: true }, { text: "सेवा क्षेत्र", correct: false }, { text: "शिक्षा क्षेत्र", correct: false } ] },
        { question: "9. आर्थिक विकास का पहला क्षेत्र है?", answers: [ { text: "कृषि क्षेत्र", correct: true }, { text: "उद्योग क्षेत्र", correct: false }, { text: "सेवा क्षेत्र", correct: false }, { text: "बैंकिंग", correct: false } ] },
        { question: "10. नरेगा (NREGA) के अंतर्गत मजदूरों को साल में कम से कम कितने दिनों का रोजगार देने की व्यवस्था है?", answers: [ { text: "100 दिनों", correct: true }, { text: "125 दिनों", correct: false }, { text: "150 दिनों", correct: false }, { text: "200 दिनों", correct: false } ] },
        { question: "11. 'जवाहर रोजगार योजना' कब लागू हुई?", answers: [ { text: "1988", correct: false }, { text: "1989", correct: true }, { text: "1990", correct: false }, { text: "1991", correct: false } ] },
        { question: "12. भारत सरकार ने किस प्रकार की शिक्षा को मौलिक अधिकार घोषित कर दिया है?", answers: [ { text: "प्रारंभिक शिक्षा", correct: true }, { text: "माध्यमिक शिक्षा", correct: false }, { text: "उच्च शिक्षा", correct: false }, { text: "तकनीकी शिक्षा", correct: false } ] },
        { question: "13. 'बाह्यस्रोतीकरण' (Outsourcing) का सर्वप्रमुख क्षेत्र है?", answers: [ { text: "भारत", correct: true }, { text: "नेपाल", correct: false }, { text: "श्रीलंका", correct: false }, { text: "पाकिस्तान", correct: false } ] },
        { question: "14. सेवा क्षेत्र का निर्माण होता है?", answers: [ { text: "परिवहन सेवाओं से", correct: false }, { text: "संचार सेवाओं से", correct: false }, { text: "वाणिज्य सेवाओं से", correct: false }, { text: "इनमें सभी", correct: true } ] },
        { question: "15. विकसित देशों की कार्यशील जनसंख्या का अधिकांश भाग कार्यरत रहता है?", answers: [ { text: "कृषि क्षेत्र में", correct: false }, { text: "औद्योगिक क्षेत्र में", correct: false }, { text: "सेवा क्षेत्र में", correct: true }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "16. भारत के सकल घरेलू उत्पाद (GDP) में किस क्षेत्र का योगदान सर्वाधिक है?", answers: [ { text: "कृषि क्षेत्र", correct: false }, { text: "औद्योगिक क्षेत्र", correct: false }, { text: "सेवा क्षेत्र", correct: true }, { text: "निर्माण क्षेत्र", correct: false } ] },
        { question: "17. विगत वर्षों के अंतर्गत बिहार में किस क्षेत्र का सर्वाधिक विकास हुआ है?", answers: [ { text: "कृषि क्षेत्र", correct: false }, { text: "औद्योगिक क्षेत्र", correct: false }, { text: "सेवा क्षेत्र", correct: true }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "18. एक अर्थव्यवस्था के आधारभूत संरचना (Infrastructure) का निर्माण होता है?", answers: [ { text: "कृषि द्वारा", correct: false }, { text: "उद्योगों द्वारा", correct: false }, { text: "सेवाओं द्वारा", correct: true }, { text: "तीनों द्वारा", correct: false } ] },
        { question: "19. भारत की अधिकांश जनसंख्या अर्थव्यवस्था के किस क्षेत्र में संलग्न है?", answers: [ { text: "प्राथमिक (कृषि) क्षेत्र", correct: true }, { text: "द्वितीयक क्षेत्र", correct: false }, { text: "तृतीयक क्षेत्र", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "20. 'स्वर्ण जयंती शहरी रोजगार योजना' किस वर्ष शुरू की गई?", answers: [ { text: "1997", correct: true }, { text: "2000", correct: false }, { text: "1990", correct: false }, { text: "1995", correct: false } ] },
        { question: "21. छिपी हुई बेरोजगारी (Disguised Unemployment) किस क्षेत्र में पाई जाती है?", answers: [ { text: "कृषि क्षेत्र में", correct: true }, { text: "सेवा क्षेत्र में", correct: false }, { text: "औद्योगिक क्षेत्र में", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "22. बिहार में साक्षरता दर (2011 के अनुसार) लगभग कितनी है?", answers: [ { text: "47%", correct: false }, { text: "61.8%", correct: true }, { text: "70%", correct: false }, { text: "50%", correct: false } ] },
        { question: "23. विश्व में सबसे अधिक BPO (Business Process Outsourcing) का कारोबार कहाँ होता है?", answers: [ { text: "चीन", correct: false }, { text: "अमेरिका", correct: false }, { text: "भारत", correct: true }, { text: "जापान", correct: false } ] },
        { question: "24. जनसंख्या का लगभग कितना प्रतिशत भाग कृषि पर आश्रित है (बिहार में)?", answers: [ { text: "60%", correct: false }, { text: "70%", correct: false }, { text: "80% से अधिक", correct: true }, { text: "50%", correct: false } ] },
        { question: "25. हमारे देश का कौन-सा शहर 'सूचना प्रौद्योगिकी' (IT) का केन्द्र बन गया है?", answers: [ { text: "बेंगलुरु", correct: true }, { text: "दिल्ली", correct: false }, { text: "मुंबई", correct: false }, { text: "चेन्नई", correct: false } ] }
    ];

    let currentIdx = 0;
    let score = 0;
    
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const qIndexSpan = document.getElementById("q-index");
    const totalQSpan = document.getElementById("total-q");
    const timerDisplay = document.getElementById("time-left");
    const progressFill = document.getElementById("progress-fill");
    const finalScoreEl = document.getElementById("final-score");
    const accuracyTextEl = document.getElementById("accuracy-text");
    const remarksEl = document.getElementById("remarks");

    function startQuiz() {
        totalQSpan.innerText = questions.length;
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeInSeconds--;
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.innerText = `${minutes}:${seconds}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function showQuestion() {
        resetState();
        let currentQ = questions[currentIdx];
        qIndexSpan.innerText = currentIdx + 1;
        qText.innerText = `Q${currentIdx + 1}. ${currentQ.question}`;
        let progress = ((currentIdx) / questions.length) * 100;
        progressFill.style.width = progress + "%";
        
        currentQ.answers.forEach(ans => {
            const btn = document.createElement("button");
            btn.innerText = ans.text;
            btn.classList.add("option-btn");
            if(ans.correct) btn.dataset.correct = ans.correct;
            btn.addEventListener("click", selectAnswer);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while(optContainer.firstChild) optContainer.removeChild(optContainer.firstChild);
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if(isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }
        Array.from(optContainer.children).forEach(btn => {
            if(btn.dataset.correct === "true") btn.classList.add("correct");
            btn.disabled = true;
        });
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        let accuracy = Math.round((score / questions.length) * 100);
        finalScoreEl.innerText = `${score} / ${questions.length}`;
        accuracyTextEl.innerText = `Accuracy: ${accuracy}%`;
        
        if(accuracy >= 80) {
            remarksEl.innerText = "💻 शाबाश! सेवा क्षेत्र और रोजगार की अच्छी समझ है!";
            remarksEl.style.color = "green";
        } else if(accuracy >= 50) {
            remarksEl.innerText = "👍 ठीक है, पर BIMARU राज्यों के नाम याद रखें।";
            remarksEl.style.color = "orange";
        } else {
            remarksEl.innerText = "📚 रिवीजन करें।";
            remarksEl.style.color = "red";
        }
    }

    startQuiz();
</script>

</body>
</html>
