    <style>
        /* --- PROFESSIONAL ENGLISH THEME (Teal/Emerald) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);

        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(0,77,64,0.2);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #b2dfdb; }
        .progress-bar { height: 100%; background: #00bfa5; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 77, 64, 0.08);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #00695c;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #e0f2f1; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #b2dfdb; background: #004d40; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #00695c; text-transform: uppercase; letter-spacing: 1px; }

        .question-text { 
            font-size: 18px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #263238; font-family: 'Lora', serif; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #37474f; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #b0bec5;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #b0bec5; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #e0f2f1; }
        
        /* Correct State */
        .option-btn.correct { background: #e0f2f1; border-color: var(--correct-color); color: #00695c; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 77, 64, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #f0fcfc;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,77,64,0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #004d40;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #004d40; line-height: 1; }
        .score-label { font-size: 11px; color: #00796b; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #546e7a; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #00bfa5; }
        .red-text { color: #d32f2f; }
        .blue-text { color: #2962ff; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #004d40; color: white; box-shadow: 0 5px 15px rgba(0,77,64,0.3); }
        .btn-secondary { background: #b2dfdb; color: #004d40; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    
        /* === ENHANCED QUIZ AESTHETICS === */
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .option-btn:hover::before { left: 100%; }
        .option-btn:hover:not(.disabled):not(.correct):not(.wrong) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .option-btn.correct {
            animation: correctPulse 0.6s ease;
        }
        .option-btn.wrong {
            animation: wrongShake 0.5s ease;
        }
        .option-btn.correct::after {
            content: '✓';
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; font-weight: 700;
            color: #00C853;
        }
        .option-btn.wrong::after {
            content: '✗';
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; font-weight: 700;
            color: #FF1744;
        }
        @keyframes correctPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.03); }
            60% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .question-card, .quiz-body {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .progress-bar, .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .score-circle {
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .next-btn, #next-btn {
            transition: all 0.3s ease !important;
        }
        .next-btn:hover, #next-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2) !important;
        }
        /* Disabled state for options - prevent interaction */
        .option-btn.disabled, .option-btn:disabled {
            pointer-events: none !important;
            cursor: not-allowed !important;
        }
        /* Quiz result screen improvements */
        .result-screen, .result-box {
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        // --- DATA: 30 MCQs from 'What is Wrong with Indian Films' ---
        const questions = [
            { q: "Who is the author of 'What is Wrong with Indian Films'?", o: ["Satyajit Ray", "Mahadevi Verma", "R.C. Hutchinson", "Humayun Kabir"], a: 0 },
            { q: "The first short film in India was produced in:", o: ["1907", "1913", "1920", "1930"], a: 0 },
            { q: "The first feature film in India was produced in:", o: ["1913", "1907", "1925", "1947"], a: 0 },
            { q: "By the twenties, India had reached the status of a:", o: ["Big business", "Small business", "No business", "Hobby"], a: 0 },
            { q: "According to Ray, no Indian film could be acclaimed on all counts on _____ standards.", o: ["International", "National", "Local", "State"], a: 0 },
            { q: "Indian cinema has been generally influenced by:", o: ["Hollywood", "Bollywood", "Tollywood", "European cinema"], a: 0 },
            { q: "The author says that the _____ of our films are glossed over.", o: ["Weaknesses", "Strengths", "Actors", "Music"], a: 0 },
            { q: "The raw material of cinema is _____ itself.", o: ["Life", "Drama", "Music", "Money"], a: 0 },
            { q: "Satyajit Ray says that we should not look towards _____ for inspiration.", o: ["Hollywood", "Europe", "Asia", "Villages"], a: 0 },
            { q: "The Indian film producer has a _____ mind.", o: ["One-track", "Two-track", "Broad", "Narrow"], a: 0 },
            { q: "According to the author, the average American film is a bad model because it depicts a way of life which is:", o: ["Colossal", "Simple", "Realistic", "Indian"], a: 0 },
            { q: "Which of the following universities conferred an honorary doctorate degree on Satyajit Ray?", o: ["Oxford", "Cambridge", "Harvard", "Delhi"], a: 0 },
            { q: "Who was the director of the film 'Pather Panchali'?", o: ["Satyajit Ray", "Raj Kapoor", "Guru Dutt", "Bimal Roy"], a: 0 },
            { q: "The cinema commands the respect accorded to any other form of:", o: ["Creative expression", "Sports", "Politics", "Science"], a: 0 },
            { q: "The author feels that our films are replete with:", o: ["Visual dissonances", "Good music", "Great acting", "Realism"], a: 0 },
            { q: "Indian music is largely:", o: ["Improvisational", "Fixed", "Written", "Copied"], a: 0 },
            { q: "The author criticizes the use of _____ music in Indian films.", o: ["Jazz", "Classical", "Folk", "Devotional"], a: 0 },
            { q: "What does the author say is needed for Indian cinema?", o: ["A style, an idiom", "More money", "Better cameras", "Foreign actors"], a: 0 },
            { q: "Indian cinema creates a _____ world.", o: ["Synthetic", "Real", "Historical", "Scientific"], a: 0 },
            { q: "The majority of our films are replete with visual:", o: ["Dissonances", "Harmony", "Beauty", "Effects"], a: 0 },
            { q: "Who said, 'What the Indian cinema needs today is not more gloss, but more imagination'?", o: ["Satyajit Ray", "Premchand", "Tagore", "Gandhi"], a: 0 },
            { q: "The technicians in Indian film industry are blamed for:", o: ["Everything", "Nothing", "Only sound", "Only lighting"], a: 0 },
            { q: "The author suggests that the Indian filmmaker should keep his eyes:", o: ["Open", "Closed", "On Hollywood", "On money"], a: 0 },
            { q: "Satyajit Ray was a:", o: ["Director", "Actor", "Singer", "Dancer"], a: 0 },
            { q: "Which habit of shooting does Ray criticize?", o: ["Shooting entirely in artificial light", "Shooting outdoors", "Shooting at night", "Shooting in rain"], a: 0 },
            { q: "According to Ray, the most potent tool of film making is:", o: ["Visual language", "Dialogue", "Music", "Makeup"], a: 0 },
            { q: "The essay 'What is Wrong with Indian Films' is taken from the book:", o: ["Our Films, Their Films", "My Experiments with Truth", "Discovery of India", "Gitanjali"], a: 0 },
            { q: "Ray suggests that we should evolve a film style that is uniquely:", o: ["Indian", "Western", "Modern", "Ancient"], a: 0 },
            { q: "The story is often:", o: ["Complex", "Simple", "Incoherent", "Meaningless"], a: 2 },
            { q: "The movement in Indian films is often:", o: ["Slow", "Fast", "Jerky", "Smooth"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 600; // 10 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Director Level! You know your cinema! 🎥";
            else if(accuracy >= 70) feedback.innerText = "Good job! You understand Ray's critique. 🎬";
            else if(accuracy >= 50) feedback.innerText = "Okay. But stop watching only Bollywood! 🍿";
            else feedback.innerText = "Study more! Don't be a 'One-track' mind. 🔥";
        }
    </script>

                // Find the back link (close button or home link)
                var backLink = document.querySelector('.close-btn, .home-link');
                if(backLink && backLink.href) {
                    window.location.href = backLink.href;
                } else {
                    history.back();
                    history.back();
                }
            }
        });
        
        // Prevent page refresh retaining answers (force clean state)
        if(window.performance && window.performance.navigation.type === 1) {
            // Page was refreshed - ensure clean state
            var allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(function(btn) {
                btn.classList.remove('correct', 'wrong', 'disabled', 'selected');
                btn.disabled = false;
            });
        }
        
        // Prevent right-click context menu to avoid cheating
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        
        // Prevent text selection on options to avoid copy-paste cheating
        document.addEventListener('selectstart', function(e) {
            if(e.target.closest('.option-btn, .options-list, .options-container')) {
                e.preventDefault();
            }
        });
    })();
    </script>
</body>
</html>
