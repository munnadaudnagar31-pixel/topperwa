<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Math Ch-14: Statistics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Statistics</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Statistics) ---
        const questions = [
            { q: "The measure of central tendency are:", o: ["Mean, Median, Mode", "Mean, Range, Mode", "Mean, Median, Deviation", "None"], a: 0 },
            { q: "The mode of the data: 2, 6, 4, 5, 0, 2, 1, 3, 2, 3 is:", o: ["2", "3", "4", "1"], a: 0 },
            { q: "The mean of the first 5 natural numbers is:", o: ["3", "5", "2.5", "6"], a: 0 },
            { q: "If the mean of 6, 7, x, 8, y, 14 is 9, then:", o: ["x + y = 21", "x + y = 19", "x - y = 19", "x - y = 21"], a: 1 },
            { q: "The relationship between Mean, Median and Mode is:", o: ["3 Median = Mode + 2 Mean", "3 Median = Mode - 2 Mean", "3 Median = 2 Mode + Mean", "3 Median = 2 Mode - Mean"], a: 0 },
            { q: "The arithmetic mean of 1, 2, 3, ..., n is:", o: ["(n+1)/2", "n/2", "n(n+1)/2", "n-1"], a: 0 },
            { q: "The class mark of the class 10-25 is:", o: ["17.5", "15", "17", "18"], a: 0 },
            { q: "If the mode of a distribution is 8 and its mean is also 8, then its median is:", o: ["8", "7", "9", "6"], a: 0 },
            { q: "The mean of first ten odd natural numbers is:", o: ["10", "11", "9", "20"], a: 0 },
            { q: "Which of the following cannot be determined graphically?", o: ["Mean", "Median", "Mode", "None"], a: 0 },
            { q: "The cumulative frequency curve is also called:", o: ["Histogram", "Ogive", "Bar graph", "Frequency polygon"], a: 1 },
            { q: "For a symmetrical distribution:", o: ["Mean = Median = Mode", "Mean > Median > Mode", "Mean < Median < Mode", "Mean = Median"], a: 0 },
            { q: "If each observation of a data is increased by 5, then their mean:", o: ["Remains same", "Increased by 5", "Decreased by 5", "Becomes 5 times"], a: 1 },
            { q: "The mean of a set of numbers is x̄. If each number is multiplied by k, then the new mean is:", o: ["k + x̄", "k x̄", "x̄ / k", "x̄ - k"], a: 1 },
            { q: "The median of the data: 3, 5, 7, 9, 11 is:", o: ["7", "9", "5", "11"], a: 0 },
            { q: "The median of the data: 10, 12, 14, 16, 18, 20 is:", o: ["15", "14", "16", "13"], a: 0 },
            { q: "The abscissa of the point of intersection of the 'less than type' and 'more than type' cumulative frequency curves of a grouped data gives its:", o: ["Mean", "Median", "Mode", "Range"], a: 1 },
            { q: "Mode is the value of the variable which has:", o: ["Maximum frequency", "Minimum frequency", "Mean frequency", "Middle frequency"], a: 0 },
            { q: "If the mean of x, x+3, x+6, x+9 and x+12 is 10, then x =", o: ["1", "2", "6", "4"], a: 3 },
            { q: "The mean of 5 numbers is 30. If one number is excluded, their mean becomes 28. The excluded number is:", o: ["38", "35", "32", "30"], a: 0 },
            { q: "While computing mean of grouped data, we assume that the frequencies are:", o: ["Centered at the classmarks", "Evenly distributed", "Centered at lower limits", "Centered at upper limits"], a: 0 },
            { q: "The sum of deviations of a set of values x1, x2, ... xn from their mean is:", o: ["Zero", "1", "n", "Infinite"], a: 0 },
            { q: "If the difference of mode and median of a data is 24, then the difference of median and mean is:", o: ["12", "24", "8", "36"], a: 0 },
            { q: "Find the class mark of the class 15.5 - 20.5.", o: ["18", "17.5", "18.5", "19"], a: 0 },
            { q: "In the formula x̄ = a + (Σfidi / Σfi), di is the deviation of a from:", o: ["Class mark", "Lower limit", "Upper limit", "Frequency"], a: 0 },
            { q: "Construction of a cumulative frequency table is useful in determining the:", o: ["Mean", "Median", "Mode", "All of these"], a: 1 },
            { q: "Which measure of central tendency is given by the x-coordinate of the point of intersection of the 'more than' ogive and 'less than' ogive?", o: ["Mean", "Median", "Mode", "None"], a: 1 },
            { q: "The mean of first n natural numbers is:", o: ["(n+1)/2", "n/2", "n(n+1)", "n²"], a: 0 },
            { q: "If the arithmetic mean of 7, 9, 11, 13, x is 10, then the value of x is:", o: ["10", "11", "12", "9"], a: 0 },
            { q: "The algebraic sum of the deviations of a frequency distribution from its mean is:", o: ["Always positive", "Always negative", "Zero", "None"], a: 2 },
            { q: "If the mean of the following distribution is 6: x: 2, 4, 6, 10, p+5; f: 3, 2, 3, 1, 2. Then p is:", o: ["1", "4", "2", "3"], a: 1 },
            { q: "Consider the following frequency distribution: Class: 0-5, 6-11, 12-17, 18-23, 24-29. The upper limit of the median class is:", o: ["17", "17.5", "18", "18.5"], a: 1 },
            { q: "In a frequency distribution, the mid value of a class is 10 and the width of the class is 6. The lower limit of the class is:", o: ["6", "7", "8", "12"], a: 1 },
            { q: "For finding the mean by the step deviation method, we divide the deviation by:", o: ["Class interval (h)", "Mean", "Median", "Mode"], a: 0 },
            { q: "The mean of 100 observations is 50. If one of the observations which was 50 is replaced by 150, the resulting mean will be:", o: ["50.5", "51", "51.5", "52"], a: 1 },
            { q: "There are 50 numbers. Each number is subtracted from 53 and the mean of the numbers so obtained is found to be -3.5. The mean of the given numbers is:", o: ["46.5", "49.5", "53.5", "56.5"], a: 3 },
            { q: "The mean of 25 observations is 36. Out of these observations if the mean of first 13 is 32 and that of the last 13 is 40, the 13th observation is:", o: ["23", "36", "38", "40"], a: 0 },
            { q: "The median of a given frequency distribution is found graphically with the help of:", o: ["Histogram", "Ogive", "Bar graph", "Pie chart"], a: 1 },
            { q: "If the arithmetic mean of x, x+3, x+6, x+9 is 10, then x is:", o: ["5.5", "5", "4.5", "6"], a: 0 },
            { q: "Which of the following is not a measure of central tendency?", o: ["Mean", "Median", "Mode", "Standard Deviation"], a: 3 },
            { q: "The mode of a frequency distribution can be determined graphically from:", o: ["Histogram", "Frequency Polygon", "Ogive", "Frequency Curve"], a: 0 },
            { q: "One of the methods for determining mode is:", o: ["Mode = 2 Median - 3 Mean", "Mode = 3 Median - 2 Mean", "Mode = 2 Mean - 3 Median", "Mode = 3 Mean - 2 Median"], a: 1 },
            { q: "If mean = 60 and median = 50, then the value of mode is:", o: ["30", "40", "20", "10"], a: 0 },
            { q: "The mean of a distribution is 20 and the standard deviation is 5. What is the value of the coefficient of variation?", o: ["20%", "25%", "15%", "10%"], a: 1 },
            { q: "If x is the class mark, then x = ?", o: ["(Lower limit + Upper limit)/2", "(Upper limit - Lower limit)/2", "Upper limit - Lower limit", "None"], a: 0 },
            { q: "The observations 29, 32, 48, 50, x, x+2, 72, 78, 84, 95 are arranged in ascending order. If the median of the data is 63, the value of x is:", o: ["61", "62", "63", "60"], a: 1 },
            { q: "Find the mean of the first 5 prime numbers.", o: ["5.6", "5", "5.4", "6"], a: 0 },
            { q: "The weights of 5 students are 45, 50, 52, 55, 60. The mean weight is:", o: ["52.4", "52", "53", "51.5"], a: 0 },
            { q: "The frequency of the class having maximum frequency is called:", o: ["Modal class", "Median class", "Mean class", "None"], a: 0 },
            { q: "Formula for Mode of grouped data is:", o: ["l + [(f1-f0)/(2f1-f0-f2)]×h", "l + [(f1-f0)/(f1-f0-f2)]×h", "l + [(f0-f1)/(2f1-f0-f2)]×h", "None"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Statistics Wizard! You can analyze any data! 📊";
            else if(accuracy >= 70) feedback.innerText = "Good job! Remember the empirical formula. 📉";
            else if(accuracy >= 50) feedback.innerText = "Not bad, but check your mean calculations. 🧮";
            else feedback.innerText = "Data can be tricky. Practice more! 🔄";
        }
    </script>
</body>
</html>
