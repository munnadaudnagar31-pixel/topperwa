    <style>
        :root {
            /* Social Science Theme: Teal/Earthy */
            --primary: #00897B; 
            --secondary: #26A69A;
            --accent: #4DB6AC;
            --text: #004D40;
            --bg: #E0F2F1;
            --card: #ffffff;
            --success: #00C853;
            --error: #D32F2F;
        }

        .dark-mode {
            --primary: #26A69A;
            --secondary: #00897B;
            --text: #ffffff;
            --bg: #102027;
            --card: #263238;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; }
        
        body { background: var(--bg); color: var(--text); padding: 15px; min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }

        /* --- Header --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 15px 20px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px;
            border-bottom: 3px solid var(--primary);
        }
        .timer {
            font-family: 'Poppins', monospace; font-size: 18px; font-weight: 700;
            color: white; background: linear-gradient(90deg, var(--primary), var(--secondary)); 
            padding: 8px 15px; border-radius: 12px;
        }
        .back-btn { text-decoration: none; font-size: 20px; color: var(--text); font-weight: 700; }

        /* --- Layout --- */
        .quiz-layout {
            display: grid; grid-template-columns: 1fr 300px; gap: 20px;
            max-width: 1200px; margin: 0 auto; width: 100%;
        }

        /* --- Question Card --- */
        .q-card {
            background: var(--card); border-radius: 25px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative;
            min-height: 400px; display: flex; flex-direction: column;
            border-top: 5px solid var(--primary);
        }
        
        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .q-badge { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white; padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .q-text { font-size: 20px; font-weight: 600; margin-bottom: 30px; line-height: 1.6; }
        
        /* Options */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn {
            background: var(--bg); border: 2px solid transparent; padding: 15px;
            border-radius: 15px; text-align: left; font-size: 16px; color: var(--text);
            cursor: pointer; transition: 0.2s; font-weight: 500; position: relative;
        }
        .option-btn:hover { border-color: var(--primary); background: rgba(0, 137, 123, 0.1); }
        
        .option-btn.selected { border-color: var(--primary); background: rgba(0, 137, 123, 0.2); }
        .option-btn.correct { background: rgba(0, 200, 83, 0.2); border-color: var(--success); color: var(--success); }
        .option-btn.wrong { background: rgba(211, 47, 47, 0.2); border-color: var(--error); color: var(--error); }

        /* --- Navigator (Right Side) --- */
        .navigator {
            background: var(--card); border-radius: 25px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content;
        }
        .nav-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            max-height: 500px; overflow-y: auto; padding-right: 5px;
        }
        .nav-btn {
            width: 40px; height: 40px; border-radius: 10px; border: none;
            background: var(--bg); color: var(--text); font-weight: 600;
            cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .nav-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0, 137, 123, 0.3); }
        .nav-btn.solved { background: var(--success); color: white; }
        .nav-btn.wrong-mark { background: var(--error); color: white; }

        /* --- Footer Controls --- */
        .controls {
            margin-top: auto; display: flex; gap: 15px; justify-content: flex-end; padding-top: 20px;
        }
        .ctrl-btn {
            padding: 12px 30px; border-radius: 15px; border: none;
            font-weight: 700; cursor: pointer; font-size: 14px;
            transition: 0.2s;
        }
        .btn-next { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 8px 20px rgba(0, 137, 123, 0.25); }
        .btn-prev { background: transparent; border: 2px solid var(--bg); color: var(--text); }

        /* --- Result Modal --- */
        .result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .result-box {
            background: var(--card); padding: 40px; border-radius: 30px;
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .quiz-layout { grid-template-columns: 1fr; }
            .navigator { display: none; }
            .options-grid { grid-template-columns: 1fr; }
            .q-text { font-size: 18px; }
        }

    </style>
</head>

        // --- STATE & LOGIC ---
        let currentQ = 0;
        let answers = new Array(questions.length).fill(null);
        let time = 0;
        let timerInterval;

        window.onload = function() {
            initNav();
            loadQ(0);
            startTimer();
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                time++;
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let s = (time % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function initNav() {
            const grid = document.getElementById('navGrid');
            questions.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerText = i + 1;
                btn.onclick = () => loadQ(i);
                btn.id = `nav-${i}`;
                grid.appendChild(btn);
            });
        }

        function loadQ(index) {
            currentQ = index;
            const q = questions[index];
            
            document.getElementById('currentQNum').innerText = index + 1;
            document.getElementById('subjectTag').innerText = q.topic;
            document.getElementById('questionText').innerText = q.q;

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${index}`).classList.add('active');

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                if(answers[index] !== null) {
                    if(i === questions[index].ans) btn.classList.add('correct');
                    if(i === answers[index] && i !== questions[index].ans) btn.classList.add('wrong');
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectOption(i, btn);
                }
                container.appendChild(btn);
            });
        }

        function selectOption(optIndex, btn) {
            answers[currentQ] = optIndex;
            
            const navBtn = document.getElementById(`nav-${currentQ}`);
            if(optIndex === questions[currentQ].ans) {
                navBtn.classList.add('solved');
            } else {
                navBtn.classList.add('wrong-mark');
            }

            loadQ(currentQ);
        }

        function nextQ() {
            if(currentQ < questions.length - 1) loadQ(currentQ + 1);
        }

        function prevQ() {
            if(currentQ > 0) loadQ(currentQ - 1);
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            let score = 0;
            answers.forEach((ans, i) => {
                if(ans === questions[i].ans) score++;
            });

            let percentage = Math.round((score / questions.length) * 100);
            document.getElementById('finalScore').innerText = percentage + "%";
            document.getElementById('resultScreen').style.display = 'flex';
        }
