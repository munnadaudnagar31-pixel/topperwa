<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Predicted Selection 2026</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff0076;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --bg-dark: #0f0c29;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                linear-gradient(30deg, #0f0c29, #302b63, #24243e),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            background-blend-mode: overlay;
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .back-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 0.9rem;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        h1 {
            margin-left: 15px;
            font-size: 1.2rem;
            background: linear-gradient(to right, #00d2ff, #928DAB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Analysis Stats Banner */
        .stats-banner {
            margin: 20px;
            padding: 15px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #ddd;
        }
        .stats-highlight {
            color: var(--primary);
            font-weight: bold;
        }

        /* Question Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 15px;
        }

        /* Accordion Item */
        .q-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .q-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            opacity: 0.7;
        }

        .q-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .q-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            flex: 1;
        }

        .prob-badge {
            background: rgba(255, 0, 118, 0.2);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid rgba(255, 0, 118, 0.3);
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 0, 118, 0.1);
        }

        .icon-toggle {
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            font-size: 1.2rem;
            color: var(--secondary);
        }

        /* Answer Section */
        .q-answer {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            transition: max-height 0.5s ease-out, opacity 0.4s ease;
            padding: 0 15px;
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.6;
        }

        .q-card.active .q-answer {
            max-height: 1000px; /* Arbitrary large height */
            opacity: 1;
            padding: 15px;
            border-top: 1px solid var(--border);
        }

        .q-card.active .icon-toggle {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .q-card.active {
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.3);
        }

        /* Professional Formatting for Answers */
        .q-answer ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        .q-answer b {
            color: var(--primary);
        }
        .formula {
            font-family: 'Courier New', monospace;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <header>
        <a href="model_paper_2026.html" class="back-btn" onclick="playSound('click')">
            &#8592; Back
        </a>
        <h1>Scientific Predictions</h1>
    </header>

    <div class="stats-banner">
        Analysis based on <span class="stats-highlight">8 Years (2018-2025)</span> of BSEB trends.<br>
        Target: <span class="stats-highlight">2026 Matric Exam</span> | High Yield Questions.
    </div>

    <div class="container" id="questionList">
        </div>

    <audio id="sound-click" src=""></audio>
    <audio id="sound-open" src=""></audio>

    <script>
        // ---------------------------------------------------------
        // DATA: Simulated Analysis of 8 Years for BSEB 2026
        // ---------------------------------------------------------
        const questions = [
            // PHYSICS
            {
                q: "State Ohm's Law. How can it be verified experimentally? Draw a circuit diagram.",
                a: "<b>Ohm's Law:</b> At constant temperature, the current flowing through a conductor is directly proportional to the potential difference across its ends.<br><br><b>Formula:</b> V = IR<br><br><b>Experimental Verification:</b><br>1. Connect a resistor, ammeter (series), voltmeter (parallel), battery, and key.<br>2. Vary current using a rheostat and note V and I readings.<br>3. Plot a graph of V vs I. It will be a straight line passing through the origin, proving V ∝ I.",
                prob: "94%"
            },
            {
                q: "Explain the working principle and construction of an Electric Motor.",
                a: "<b>Principle:</b> A current-carrying conductor placed in a magnetic field experiences a force (Fleming's Left-Hand Rule).<br><br><b>Construction:</b> Consists of a rectangular coil (ABCD), strong field magnet, split rings (commutator), and brushes.<br><b>Working:</b> When current flows, forces on arms AB and CD are opposite, creating a torque that rotates the coil continuously.",
                prob: "88%"
            },
            {
                q: "Draw a ray diagram for a Concave Mirror when the object is placed between the Focus (F) and Pole (P). State the nature of the image.",
                a: "<b>Diagram Description:</b><br>- Ray parallel to principal axis reflects through Focus.<br>- Ray towards Center of Curvature reflects back on same path.<br>- The reflected rays diverge; back-tracing them forms an image behind the mirror.<br><br><b>Nature:</b> Virtual, Erect, and Magnified (Enlarged). Used in shaving mirrors.",
                prob: "91%"
            },
            {
                q: "What is Myopia (Near-sightedness)? What are its causes and how is it corrected?",
                a: "<b>Myopia:</b> A defect where a person can see nearby objects clearly but distant objects appear blurry.<br><b>Causes:</b><br>1. Elongation of the eyeball.<br>2. Excessive curvature of the eye lens.<br><b>Correction:</b> Concave lens of suitable power is used to diverge rays before they enter the eye so image forms on the retina.",
                prob: "85%"
            },
            {
                q: "Derive the expression for equivalent resistance of three resistors connected in Parallel.",
                a: "Let R1, R2, R3 be connected in parallel.<br>- Voltage (V) is same across all.<br>- Current splits: I = I1 + I2 + I3.<br>- By Ohm's Law: I1=V/R1, I2=V/R2, I3=V/R3.<br>- Equivalent Current: V/Rp = V/R1 + V/R2 + V/R3.<br><b>Final Formula:</b> 1/Rp = 1/R1 + 1/R2 + 1/R3.",
                prob: "82%"
            },
            {
                q: "Explain the phenomenon of Dispersion of White Light by a Glass Prism.",
                a: "<b>Dispersion:</b> The splitting of white light into its constituent seven colors is called dispersion.<br><b>Cause:</b> Different colors travel at different speeds in glass, bending by different angles.<br><b>Sequence (VIBGYOR):</b> Violet bends the most, Red bends the least.<br>Isaac Newton proved this using a prism.",
                prob: "79%"
            },
            {
                q: "What is a Solenoid? Draw the magnetic field lines produced by a current-carrying solenoid.",
                a: "<b>Solenoid:</b> A coil of many circular turns of insulated copper wire wrapped closely in the shape of a cylinder.<br><b>Field Pattern:</b><br>- Inside: Field lines are parallel straight lines (Uniform field).<br>- Outside: Similar to a bar magnet (Loops from North to South).<br>- Used to make electromagnets.",
                prob: "76%"
            },
            {
                q: "State Joule's Law of Heating. Derive the formula H = I²Rt.",
                a: "<b>Joule's Law:</b> Heat produced in a resistor is:<br>1. Directly proportional to square of current (I²).<br>2. Proportional to resistance (R).<br>3. Proportional to time (t).<br><br><b>Derivation:</b> Work done to move charge Q against potential V is W = V × Q.<br>Since Q = I × t and V = I × R.<br>W = (IR) × (It) = I²Rt.",
                prob: "89%"
            },
            {
                q: "Explain Fleming's Left-Hand Rule.",
                a: "Stretch the thumb, forefinger, and middle finger of the left hand mutually perpendicular.<br>- <b>Forefinger:</b> Direction of Magnetic Field.<br>- <b>Middle Finger:</b> Direction of Current.<br>- <b>Thumb:</b> Direction of Force (Motion).<br>Used in Electric Motors.",
                prob: "75%"
            },
            {
                q: "What is Nuclear Fission? Differentiate it from Nuclear Fusion.",
                a: "<b>Fission:</b> Splitting of a heavy nucleus (like Uranium) into lighter nuclei, releasing huge energy. (Used in Nuclear Reactors).<br><b>Fusion:</b> Combining light nuclei (like Hydrogen) to form a heavy nucleus. (Source of Sun's energy).<br>Fusion releases more energy than fission.",
                prob: "70%"
            },

            // CHEMISTRY
            {
                q: "What is a Balanced Chemical Equation? Why should equations be balanced?",
                a: "<b>Balanced Equation:</b> An equation where the number of atoms of each element is equal on both reactant and product sides.<br><b>Reason:</b> To satisfy the <b>Law of Conservation of Mass</b>, which states mass can neither be created nor destroyed in a chemical reaction.",
                prob: "92%"
            },
            {
                q: "Describe the preparation of Plaster of Paris. Write its uses.",
                a: "<b>Preparation:</b> Heating Gypsum (CaSO₄·2H₂O) at 373K.<br><span class='formula'>CaSO₄·2H₂O → CaSO₄·½H₂O + 1½H₂O</span><br><br><b>Uses:</b><br>1. Supporting fractured bones.<br>2. Making toys and decorative materials.<br>3. Smooth surfaces.",
                prob: "88%"
            },
            {
                q: "Differentiate between Calcination and Roasting.",
                a: "<b>Calcination:</b> Heating ore in limited air/absence of air. Used for Carbonate ores.<br><span class='formula'>ZnCO3 → ZnO + CO2</span><br><br><b>Roasting:</b> Heating ore in excess air. Used for Sulphide ores.<br><span class='formula'>2ZnS + 3O2 → 2ZnO + 2SO2</span>",
                prob: "84%"
            },
            {
                q: "Explain the cleansing action of Soap (Micelle formation).",
                a: "<b>Structure:</b> Soap molecules have a hydrophilic (water-loving) head and hydrophobic (oil-loving) tail.<br><b>Action:</b> When mixed with water and oil (dirt), the hydrophobic tails attach to the oil droplet, and heads face outward into water, forming a spherical structure called a <b>Micelle</b>. This emulsion is washed away with water.",
                prob: "90%"
            },
            {
                q: "What is an Homologous Series? State its characteristics.",
                a: "A series of compounds with the same functional group and similar chemical properties, where successive members differ by a -CH₂- unit.<br><b>Characteristics:</b><br>1. Same general formula.<br>2. Difference of 14u mass between members.<br>3. Gradual change in physical properties.",
                prob: "81%"
            },
            {
                q: "Write the electron dot structure for Methane (CH4) and Ethane (C2H6).",
                a: "<b>Methane:</b> Carbon shares 1 electron with 4 Hydrogen atoms. (Single bonds).<br><b>Ethane:</b> C-C single bond, and each C bonds with 3 H atoms.<br><i>(Note: Practice drawing the dot diagram visually)</i>.",
                prob: "78%"
            },
            {
                q: "State Modern Periodic Law. How does atomic size change in a group and period?",
                a: "<b>Law:</b> Properties of elements are a periodic function of their atomic numbers.<br><b>Trends:</b><br>- <b>Across a Period:</b> Atomic size decreases (due to increased nuclear charge).<br>- <b>Down a Group:</b> Atomic size increases (due to addition of new shells).",
                prob: "86%"
            },
            {
                q: "Explain Electrolytic Refining of Copper with a diagram description.",
                a: "<b>Anode:</b> Impure Copper plate.<br><b>Cathode:</b> Thin strip of pure Copper.<br><b>Electrolyte:</b> Copper Sulphate solution.<br><b>Process:</b> Current passes, pure Cu from anode dissolves into solution and deposits on cathode. Impurities settle as anode mud.",
                prob: "80%"
            },
            {
                q: "What happens when Ethanol reacts with Sodium? Write equation.",
                a: "Ethanol reacts with Sodium to produce Sodium Ethoxide and Hydrogen gas.<br><b>Equation:</b><br><span class='formula'>2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂↑</span><br>Test for H2: Pop sound.",
                prob: "75%"
            },
            {
                q: "What is Bleaching Powder? How is it prepared?",
                a: "<b>Chemical Name:</b> Calcium Oxychloride (CaOCl₂).<br><b>Preparation:</b> By action of Chlorine gas on dry slaked lime.<br><span class='formula'>Ca(OH)₂ + Cl₂ → CaOCl₂ + H₂O</span><br><b>Use:</b> Disinfecting water, bleaching cotton.",
                prob: "72%"
            },

            // BIOLOGY
            {
                q: "Draw a labelled diagram of the Human Digestive System and explain the role of the Stomach.",
                a: "<b>Stomach Role:</b><br>1. Churns food to mix with gastric juices.<br>2. <b>HCl:</b> Kills bacteria and makes medium acidic for Pepsin.<br>3. <b>Pepsin:</b> Digests proteins.<br>4. <b>Mucus:</b> Protects stomach lining from acid.",
                prob: "95%"
            },
            {
                q: "Explain the process of Double Circulation in humans.",
                a: "Blood passes through the heart twice in one complete cycle:<br>1. <b>Pulmonary Circulation:</b> Deoxygenated blood moves from Right Ventricle to Lungs and returns oxygenated to Left Atrium.<br>2. <b>Systemic Circulation:</b> Oxygenated blood moves from Left Ventricle to Body and returns deoxygenated to Right Atrium.",
                prob: "91%"
            },
            {
                q: "Draw the structure of a Neuron and explain its function.",
                a: "<b>Parts:</b> Dendrite, Cell Body (Cyton), Axon, Nerve Ending.<br><b>Function:</b><br>1. Dendrites acquire information.<br>2. Impulse travels electrically along the Axon.<br>3. At the synapse, chemicals (neurotransmitters) cross the gap to the next neuron.",
                prob: "89%"
            },
            {
                q: "How is the sex of a child determined in humans?",
                a: "Determined by sex chromosomes.<br>- <b>Male:</b> XY | <b>Female:</b> XX.<br>- If sperm carrying X fertilizes egg (X) -> Girl (XX).<br>- If sperm carrying Y fertilizes egg (X) -> Boy (XY).<br>Thus, the father's chromosome determines the sex.",
                prob: "87%"
            },
            {
                q: "Draw a longitudinal section of a Flower and label its parts.",
                a: "<b>Parts to Label:</b><br>1. <b>Stamen (Male):</b> Anther, Filament.<br>2. <b>Pistil (Female):</b> Stigma, Style, Ovary.<br>3. Petals and Sepals.<br>Ovary contains ovules which become seeds after fertilization.",
                prob: "93%"
            },
            {
                q: "Differentiate between Aerobic and Anaerobic Respiration.",
                a: "<b>Aerobic:</b><br>- Presence of Oxygen.<br>- Occurs in Mitochondria.<br>- End products: CO₂, H₂O, High Energy (38 ATP).<br><br><b>Anaerobic:</b><br>- Absence of Oxygen.<br>- Occurs in Cytoplasm (Yeast/Muscle).<br>- End products: Ethanol/Lactic Acid, Low Energy (2 ATP).",
                prob: "85%"
            },
            {
                q: "Explain the structure and function of Nephron.",
                a: "<b>Structure:</b> Cup-shaped Bowman's capsule, Glomerulus (capillaries), Tubular part (PCT, Loop of Henle, DCT), Collecting Duct.<br><b>Function:</b> Filtration of blood, reabsorption of useful substances (glucose, water), and secretion of waste (urine).",
                prob: "83%"
            },
            {
                q: "What is Vegetative Propagation? Give advantages.",
                a: "New plants are obtained from parts like roots, stems, or leaves (without seeds).<br><b>Advantages:</b><br>1. Plants bear flowers/fruits earlier.<br>2. Genetically identical to parent (preserves characteristics).<br>3. Useful for plants that have lost capacity to produce seeds (Banana, Rose).",
                prob: "79%"
            },
            {
                q: "State Mendel's Law of Independent Assortment.",
                a: "When two pairs of traits are combined in a hybrid, segregation of one pair of characters is independent of the other pair of characters.<br>Example: In a dihybrid cross (Round-Yellow x Wrinkled-Green), new combinations (Round-Green, Wrinkled-Yellow) appear.",
                prob: "76%"
            },
            {
                q: "How do we control the depletion of the Ozone Layer?",
                a: "<b>Cause:</b> CFCs (Chlorofluorocarbons) used in refrigerants.<br><b>Steps:</b><br>1. UNEP Protocol (Montreal Protocol) to freeze CFC production.<br>2. Use eco-friendly alternatives in ACs and fridges.",
                prob: "72%"
            }
        ];

        // ---------------------------------------------------------
        // RENDER LOGIC
        // ---------------------------------------------------------
        const list = document.getElementById('questionList');

        questions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-header" onclick="toggleAnswer(this)">
                    <div class="q-title">
                        <span style="color:var(--primary)">Q${index + 1}.</span> ${item.q}
                    </div>
                    <div style="text-align:right">
                        <span class="prob-badge">${item.prob} Chance</span>
                        <br>
                        <div class="icon-toggle" style="margin-top:10px; text-align:right">▼</div>
                    </div>
                </div>
                <div class="q-answer">
                    <p style="margin-bottom:10px; color:#aaa; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">Solution:</p>
                    ${item.a}
                </div>
            `;
            list.appendChild(card);
        });

        // ---------------------------------------------------------
        // INTERACTION LOGIC
        // ---------------------------------------------------------
        function toggleAnswer(header) {
            playSound('click');
            const card = header.parentElement;
            const isOpen = card.classList.contains('active');

            // Close all others (Accordion effect) - Optional, remove loop if you want multiple open
            document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));

            if (!isOpen) {
                card.classList.add('active');
            }
        }

        function playSound(type) {
            // Placeholder for sound logic. 
            // In a real app, you would load an audio file.
            // console.log("Playing sound: " + type);
        }
    </script>
</body>
</html>
