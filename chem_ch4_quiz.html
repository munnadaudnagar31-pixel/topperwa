<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Chemistry Ch-4 Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL GRADIENT THEME (CHEMISTRY - TEAL) --- */
        :root {
            --bg-gradient: linear-gradient(180deg, #E0F7FA 0%, #B2DFDB 100%);
            --header-gradient: linear-gradient(135deg, #00695C 0%, #004D40 100%);
            --card-bg: #ffffff;
            --text-main: #004D40;
            --text-sub: #00796B;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Green */
            --wrong-color: #FF1744;   /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        .quiz-header {
            background: var(--header-gradient); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10;
        }
        .close-btn { font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.8; }
        .timer-badge {
            background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); }
        .progress-bar { height: 100%; background: #00C853; width: 0%; transition: width 0.3s; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 77, 64, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 80px;
        }

        .q-count { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .question-text { font-size: 18px; font-weight: 700; margin-bottom: 25px; line-height: 1.4; color: #2d3436; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #444; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative;
        }

        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center;
        }

        .next-btn {
            background: var(--header-gradient); color: white; border: none;
            width: 100%; max-width: 600px; padding: 16px; border-radius: 18px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 77, 64, 0.3); transition: 0.2s;
            display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 30px; animation: fadeIn 0.5s;
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: white; border: 8px solid #009688;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .score-num { font-size: 36px; font-weight: 800; color: #004D40; }
        .score-total { font-size: 14px; color: #aaa; font-weight: 600; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="chemistry_chapters.html" class="close-btn">✕</a>
        <span>Ch-4: Carbon & its Compounds</span>
        <div class="timer-badge" id="question-tracker">1/45</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <span class="q-count" id="q-number">Question 1</span>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="score-circle">
            <span class="score-num" id="final-score">0</span>
            <span class="score-total">OUT OF 45</span>
        </div>
        <h2 style="color: #004D40; margin-bottom: 10px;">Quiz Completed!</h2>
        <p style="color: #666; margin-bottom: 20px;">You've completed Carbon & its Compounds.</p>
        <a href="chemistry_chapters.html" class="next-btn" style="display:block; text-align:center; text-decoration:none;">Back to Chapters</a>
        <br>
        <div style="cursor:pointer; color:#009688; font-weight:600;" onclick="location.reload()">↺ Restart Quiz</div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <script>
        // --- DATA: 45 QUESTIONS (Carbon & its Compounds) ---
        const questions = [
            { q: "Carbon forms bonds with other atoms by:", o: ["Gaining electrons", "Losing electrons", "Sharing electrons", "Transferring electrons"], a: 2 },
            { q: "The valency of Carbon is:", o: ["2", "3", "4", "5"], a: 2 },
            { q: "Which allotrope of Carbon is the hardest natural substance?", o: ["Graphite", "Diamond", "Fullerene", "Coke"], a: 1 },
            { q: "Which allotrope of Carbon is a good conductor of electricity?", o: ["Diamond", "Graphite", "Fullerene", "Coal"], a: 1 },
            { q: "The property of self-linking of carbon atoms to form long chains is called:", o: ["Isomerism", "Catenation", "Allotropy", "Polymerisation"], a: 1 },
            { q: "Hydrocarbons containing only single bonds are called:", o: ["Alkenes", "Alkynes", "Alkanes", "Aromatics"], a: 2 },
            { q: "The general formula of Alkanes is:", o: ["CnH2n", "CnH2n-2", "CnH2n+2", "CnH2n+1"], a: 2 },
            { q: "The general formula of Alkenes is:", o: ["CnH2n+2", "CnH2n", "CnH2n-2", "CnH2n+1"], a: 1 },
            { q: "The general formula of Alkynes is:", o: ["CnH2n+2", "CnH2n", "CnH2n-2", "CnH2n-1"], a: 2 },
            { q: "Which of the following is an unsaturated hydrocarbon?", o: ["Methane", "Ethane", "Ethene", "Propane"], a: 2 },
            { q: "The functional group -OH represents:", o: ["Aldehyde", "Alcohol", "Carboxylic Acid", "Ketone"], a: 1 },
            { q: "The functional group -CHO represents:", o: ["Alcohol", "Ketone", "Aldehyde", "Carboxylic Acid"], a: 2 },
            { q: "The functional group -COOH represents:", o: ["Ketone", "Aldehyde", "Alcohol", "Carboxylic Acid"], a: 3 },
            { q: "The functional group >C=O represents:", o: ["Aldehyde", "Alcohol", "Carboxylic Acid", "Ketone"], a: 3 },
            { q: "Ethanol on complete oxidation gives:", o: ["Ethanal", "Ethanoic Acid", "CO2 and Water", "Methane"], a: 2 },
            { q: "Which of the following is used in making tincture iodine and cough syrups?", o: ["Methanol", "Ethanol", "Propanol", "Ethanoic Acid"], a: 1 },
            { q: "The common name of Ethanoic Acid is:", o: ["Formic Acid", "Acetic Acid", "Propionic Acid", "Butyric Acid"], a: 1 },
            { q: "Vinegar is a solution of:", o: ["5-8% acetic acid in alcohol", "5-8% acetic acid in water", "50% acetic acid in water", "100% acetic acid"], a: 1 },
            { q: "The reaction between an acid and an alcohol to form an ester is called:", o: ["Saponification", "Esterification", "Combustion", "Neutralization"], a: 1 },
            { q: "Esters are sweet-smelling substances used in:", o: ["Making perfumes", "Making dyes", "Making medicines", "Fuel"], a: 0 },
            { q: "Saponification is the reaction used in the preparation of:", o: ["Soap", "Detergent", "Ester", "Alcohol"], a: 0 },
            { q: "Soaps are sodium or potassium salts of:", o: ["Long chain alcohols", "Long chain aldehydes", "Long chain carboxylic acids", "Short chain acids"], a: 2 },
            { q: "The hydrophobic end of a soap molecule attaches to:", o: ["Water", "Dirt/Oil", "Air", "Cloth"], a: 1 },
            { q: "The hydrophilic end of a soap molecule attaches to:", o: ["Water", "Dirt", "Oil", "Grease"], a: 0 },
            { q: "Micelles are formed when soap is added to:", o: ["Ethanol", "Water", "Oil", "Petrol"], a: 1 },
            { q: "Scum is formed when soap reacts with:", o: ["Soft water", "Hard water", "Distilled water", "Rain water"], a: 1 },
            { q: "Hardness of water is caused by salts of:", o: ["Sodium and Potassium", "Calcium and Magnesium", "Iron and Zinc", "Copper and Silver"], a: 1 },
            { q: "Detergents are generally used to make:", o: ["Shampoos", "Toothpaste", "Cake", "Biscuits"], a: 0 },
            { q: "The first organic compound synthesized in the laboratory was:", o: ["Methane", "Urea", "Acetic Acid", "Ethanol"], a: 1 },
            { q: "Butane (C4H10) has how many isomers?", o: ["2", "3", "4", "5"], a: 0 },
            { q: "The chemical formula of Benzene is:", o: ["C6H12", "C6H14", "C6H6", "C6H10"], a: 2 },
            { q: "Cyclohexane has the formula:", o: ["C6H6", "C6H12", "C6H14", "C6H10"], a: 1 },
            { q: "Which gas is evolved when Ethanol reacts with Sodium?", o: ["O2", "CO2", "H2", "N2"], a: 2 },
            { q: "Dehydration of Ethanol with conc. H2SO4 at 443K gives:", o: ["Ethane", "Ethene", "Ethyne", "Ethanoic Acid"], a: 1 },
            { q: "Oxidizing agent used to convert Ethanol to Ethanoic Acid is:", o: ["Alkaline KMnO4", "Conc. H2SO4", "Sodium", "Chlorine"], a: 0 },
            { q: "Addition reactions are undergone by:", o: ["Saturated hydrocarbons", "Unsaturated hydrocarbons", "Alkanes", "Aromatics only"], a: 1 },
            { q: "Vegetable oils are converted into vegetable ghee by:", o: ["Oxidation", "Hydrogenation", "Hydration", "Halogenation"], a: 1 },
            { q: "Which catalyst is used in the hydrogenation of vegetable oils?", o: ["Iron", "Nickel", "Copper", "Zinc"], a: 1 },
            { q: "Pure Ethanoic Acid freezes during winter and is called:", o: ["Glacial Acetic Acid", "Frozen Acid", "Ice Acid", "Cold Acid"], a: 0 },
            { q: "Successive members of a homologous series differ by a mass of:", o: ["12u", "14u", "16u", "18u"], a: 1 },
            { q: "Successive members of a homologous series differ by the group:", o: ["-CH3", "-CH2-", "-CH", "-C"], a: 1 },
            { q: "How many covalent bonds are there in Ethane (C2H6)?", o: ["6", "7", "8", "9"], a: 1 },
            { q: "Buckminsterfullerene is an allotrope of:", o: ["Phosphorus", "Sulphur", "Carbon", "Tin"], a: 2 },
            { q: "Which of the following does not belong to the same homologous series?", o: ["CH4", "C2H6", "C3H8", "C4H8"], a: 3 },
            { q: "The reaction of burning Carbon compounds in air is:", o: ["Reduction", "Oxidation/Combustion", "Substitution", "Addition"], a: 1 }
        ];

        // --- GAME LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const tracker = document.getElementById('question-tracker');
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');

        loadQuestion();

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1}`;
            qText.innerText = q.q;
            tracker.innerText = `${currentQuestion + 1}/${questions.length}`;
            
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({behavior: "smooth"});
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
                quizUI.scrollTop = 0;
            } else {
                showResult();
            }
        }

        function showResult() {
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            resultUI.style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
