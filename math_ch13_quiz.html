<!DOCTYPE html>
<html lang="en">
<head>

     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Math Ch-13: Surface Areas & Volumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Surface Areas & Volumes</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Surface Areas & Volumes) ---
        const questions = [
            { q: "The total surface area of a solid hemisphere of radius r is:", o: ["2πr²", "3πr²", "4πr²", "πr²"], a: 1 },
            { q: "The volume of a sphere of radius r is:", o: ["4/3 πr³", "2/3 πr³", "4πr²", "3πr³"], a: 0 },
            { q: "The curved surface area of a cylinder of radius r and height h is:", o: ["πr²h", "2πrh", "2πr(r+h)", "πrh"], a: 1 },
            { q: "The total surface area of a cylinder of radius r and height h is:", o: ["2πrh", "πr²h", "2πr(r+h)", "2πr²"], a: 2 },
            { q: "The volume of a cone of radius r and height h is:", o: ["πr²h", "1/3 πr²h", "2/3 πr²h", "1/2 πr²h"], a: 1 },
            { q: "The relation between slant height (l), radius (r) and height (h) of a cone is:", o: ["l² = h² + r²", "h² = l² + r²", "r² = h² + l²", "l = h + r"], a: 0 },
            { q: "The curved surface area of a cone of radius r and slant height l is:", o: ["πrl", "πr(l+r)", "2πrl", "πr²l"], a: 0 },
            { q: "If the radius of a sphere is doubled, its volume becomes:", o: ["2 times", "4 times", "8 times", "16 times"], a: 2 },
            { q: "A cylinder and a cone have equal base radii and equal heights. The ratio of their volumes is:", o: ["1:3", "3:1", "1:1", "1:2"], a: 1 },
            { q: "The number of surfaces in a solid cylinder is:", o: ["1", "2", "3", "4"], a: 2 },
            { q: "A solid sphere of radius r is melted and cast into the shape of a solid cone of height r, the radius of the base of the cone is:", o: ["2r", "3r", "r", "4r"], a: 0 },
            { q: "The volume of a cube is 64 cm³. Its surface area is:", o: ["16 cm²", "64 cm²", "96 cm²", "128 cm²"], a: 2 },
            { q: "If two solid hemispheres of same base radius r are joined together along their bases, then curved surface area of this new solid is:", o: ["4πr²", "6πr²", "3πr²", "8πr²"], a: 0 },
            { q: "A tank is made of the shape of a cylinder with a hemispherical depression at one end. The height of the cylinder is 1.45 m and radius is 30 cm. The total surface area of the tank is:", o: ["30 m²", "3.3 m²", "30.3 m²", "3300 m²"], a: 1 },
            { q: "The shape of a glass (tumbler) is usually in the form of:", o: ["Cone", "Frustum of a cone", "Cylinder", "Sphere"], a: 1 },
            { q: "During conversion of a solid from one shape to another, the volume of the new shape will:", o: ["Increase", "Decrease", "Remain unaltered", "Be doubled"], a: 2 },
            { q: "The radii of the ends of a frustum of a cone of height h are r1 and r2. The volume V of the frustum of the cone is given by:", o: ["1/3 πh(r1² + r2² + r1r2)", "1/3 πh(r1² + r2² - r1r2)", "1/3 πh(r1² - r2² + r1r2)", "1/3 πh(r1² + r2²)"], a: 0 },
            { q: "A shuttlecock used for playing badminton has the shape of the combination of:", o: ["A cylinder and a sphere", "A sphere and a cone", "A cylinder and a hemisphere", "Frustum of a cone and a hemisphere"], a: 3 },
            { q: "A cone is cut through a plane parallel to its base and then the cone that is formed on one side of that plane is removed. The new part that is left over on the other side of the plane is called:", o: ["Frustum of a cone", "Cone", "Cylinder", "Sphere"], a: 0 },
            { q: "The surface area of a sphere is 616 cm². Its radius is:", o: ["7 cm", "14 cm", "21 cm", "28 cm"], a: 0 },
            { q: "The volume of a cuboid of dimensions 10 cm × 8 cm × 6 cm is:", o: ["480 cm³", "240 cm³", "200 cm³", "100 cm³"], a: 0 },
            { q: "The lateral surface area of a cube of side a is:", o: ["4a²", "6a²", "a²", "a³"], a: 0 },
            { q: "A cylinder, a cone and a hemisphere are of equal base and have the same height. What is the ratio in their volumes?", o: ["3:1:2", "3:2:1", "1:2:3", "1:3:2"], a: 0 },
            { q: "If the radius of the base of a right circular cylinder is halved, keeping the height the same, then the ratio of the volume of the cylinder thus obtained to the volume of original cylinder is:", o: ["1:2", "2:1", "1:4", "4:1"], a: 2 },
            { q: "The number of liters in 1 m³ is:", o: ["10", "100", "1000", "10000"], a: 2 },
            { q: "A metallic sphere of radius 10.5 cm is melted and then recast into small cones each of radius 3.5 cm and height 3 cm. The number of such cones is:", o: ["63", "126", "21", "130"], a: 1 },
            { q: "A solid piece of iron in the form of a cuboid of dimensions 49cm × 33cm × 24cm, is moulded to form a solid sphere. The radius of the sphere is:", o: ["21 cm", "23 cm", "25 cm", "19 cm"], a: 0 },
            { q: "A mason constructs a wall of dimensions 270cm × 300cm × 350cm with the bricks each of size 22.5cm × 11.25cm × 8.75cm and it is assumed that 1/8 space is covered by the mortar. Then the number of bricks used to construct the wall is:", o: ["11100", "11200", "11000", "11300"], a: 1 },
            { q: "Twelve solid spheres of the same size are made by melting a solid metallic cylinder of base diameter 2 cm and height 16 cm. The diameter of each sphere is:", o: ["4 cm", "3 cm", "2 cm", "6 cm"], a: 2 },
            { q: "A cylindrical pencil sharpened at one edge is the combination of:", o: ["A cone and a cylinder", "Frustum of a cone and a cylinder", "A hemisphere and a cylinder", "Two cylinders"], a: 0 },
            { q: "A surahi is the combination of:", o: ["A sphere and a cylinder", "A hemisphere and a cylinder", "Two hemispheres", "A cylinder and a cone"], a: 0 },
            { q: "A plumbline (sahul) is the combination of:", o: ["A cone and a cylinder", "A hemisphere and a cone", "Frustum of a cone and a cylinder", "Sphere and cylinder"], a: 1 },
            { q: "The shape of a gilli, in the gilli-danda game, is a combination of:", o: ["Two cylinders", "A cone and a cylinder", "Two cones and a cylinder", "Two cylinders and a cone"], a: 2 },
            { q: "A medicine-capsule is in the shape of a cylinder of diameter 0.5 cm with two hemispheres stuck to each of its ends. The length of entire capsule is 2 cm. The capacity of the capsule is:", o: ["0.36 cm³", "0.35 cm³", "0.34 cm³", "0.33 cm³"], a: 0 },
            { q: "If two solid spheres of radii R and r are melted to form a hollow sphere of thickness t, then:", o: ["R³ + r³ = (R+t)³ - R³", "R³ + r³ = (R+r)³", "Volume remains same", "Surface area remains same"], a: 2 },
            { q: "The curved surface area of a frustum of a cone having slant height l and radii r1 and r2 is:", o: ["πl(r1 + r2)", "πl(r1 - r2)", "π(r1 + r2)l + π(r1² + r2²)", "π(r1 + r2)"], a: 0 },
            { q: "A hollow cube of internal edge 22cm is filled with spherical marbles of diameter 0.5 cm and it is assumed that 1/8 space of the cube remains unfilled. Then the number of marbles that the cube can accommodate is:", o: ["142296", "142396", "142496", "142596"], a: 0 },
            { q: "Total surface area of a cone is:", o: ["πrl", "πr(l+r)", "2πr(l+r)", "2πrl"], a: 1 },
            { q: "If the surface area of a sphere is 144π cm², then its radius is:", o: ["6 cm", "8 cm", "12 cm", "10 cm"], a: 0 },
            { q: "The height of a cone is 24 cm and diameter of base is 14 cm. The slant height is:", o: ["25 cm", "24 cm", "30 cm", "26 cm"], a: 0 },
            { q: "Volume of a hollow cylinder with height h, outer radius R and inner radius r is:", o: ["πh(R²-r²)", "πh(R²-r)", "πh(R-r²)", "πh(R+r)²"], a: 0 },
            { q: "A cone, a hemisphere and a cylinder stand on equal bases and have the same height. The ratio of their volumes is:", o: ["1:2:3", "2:1:3", "2:3:1", "3:2:1"], a: 0 },
            { q: "If the radius of a cylinder is doubled and height is halved, the volume will be:", o: ["Doubled", "Halved", "Same", "Four times"], a: 0 },
            { q: "The volume of two spheres are in the ratio 64:27. The ratio of their surface areas is:", o: ["3:4", "4:3", "9:16", "16:9"], a: 3 },
            { q: "The area of the base of a cone is 154 cm² and its height is 15 cm. Its volume is:", o: ["770 cm³", "750 cm³", "800 cm³", "780 cm³"], a: 0 },
            { q: "A rectangular sheet of paper 44cm × 20cm is rolled along its length to form a cylinder. The volume of the cylinder is:", o: ["3080 cm³", "3180 cm³", "3200 cm³", "3060 cm³"], a: 0 },
            { q: "The slant height of a frustum of a cone of height 8 cm and radii 10 cm and 4 cm is:", o: ["10 cm", "14 cm", "12 cm", "8 cm"], a: 0 },
            { q: "The capacity of a cylindrical tank is 6160 m³. If the radius of its base is 14 m, the depth of the tank is:", o: ["10 m", "12 m", "14 m", "15 m"], a: 0 },
            { q: "Surface area of a sphere is proportional to:", o: ["Radius", "Square of radius", "Cube of radius", "Square root of radius"], a: 1 },
            { q: "Ratio of volumes of two cylinders with equal height is:", o: ["H:r", "r:H", "R²:r²", "R:r"], a: 2 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Volume Master! You can fill any container! 🧊";
            else if(accuracy >= 70) feedback.innerText = "Great job! Keep revising the formulas. 📏";
            else if(accuracy >= 50) feedback.innerText = "Good effort. Watch out for unit conversions. ⚖️";
            else feedback.innerText = "Don't worry. Formulas are key here! 🔄";
        }
    </script>
</body>
</html>
