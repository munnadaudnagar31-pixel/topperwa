        { question: "43. भारत में कितने सार्वजनिक क्षेत्र के तेल परिष्करण केन्द्र कार्य कर रहे हैं?", answers: [ { text: "15", correct: false }, { text: "16", correct: false }, { text: "18", correct: true }, { text: "20", correct: false } ] },
        { question: "44. दमघोटू गैस किसे कहा जाता है?", answers: [ { text: "कार्बन मोनोऑक्साइड", correct: true }, { text: "कार्बन डाइऑक्साइड", correct: false }, { text: "सल्फर", correct: false }, { text: "सल्फ्यूरिक अम्ल", correct: false } ] },
        { question: "45. जूट उद्योग के सबसे अधिक कारखाने किस नदी के तट पर हैं?", answers: [ { text: "दामोदर", correct: false }, { text: "हुगली", correct: true }, { text: "गंगा", correct: false }, { text: "कोसी", correct: false } ] },
        { question: "46. मुर्री (बिहार) में किस उद्योग का कारखाना है?", answers: [ { text: "सीमेंट", correct: false }, { text: "एल्युमिनियम", correct: true }, { text: "कांच", correct: false }, { text: "खाद", correct: false } ] },
        { question: "47. किस राज्य में सॉफ्टवेयर प्रौद्योगिकी पार्क नहीं है?", answers: [ { text: "कर्नाटक", correct: false }, { text: "छत्तीसगढ़", correct: true }, { text: "राजस्थान", correct: false }, { text: "असम", correct: false } ] },
        { question: "48. निम्नलिखित में कौन-सा शहर तमिलनाडु का 'मैनचेस्टर' कहलाता है?", answers: [ { text: "कोयंबटूर", correct: true }, { text: "चेन्नई", correct: false }, { text: "सलेम", correct: false }, { text: "मदुरई", correct: false } ] },
        { question: "49. विशाखापत्तनम तेल शोधक कारखाना किस राज्य में है?", answers: [ { text: "आंध्र प्रदेश", correct: true }, { text: "तमिलनाडु", correct: false }, { text: "केरल", correct: false }, { text: "कर्नाटक", correct: false } ] },
        { question: "50. सूती वस्त्रों की राजधानी किसे कहा जाता है?", answers: [ { text: "सूरत", correct: false }, { text: "मुंबई", correct: true }, { text: "अहमदाबाद", correct: false }, { text: "कोलकाता", correct: false } ] }
    ];

    let currentIdx = 0;
    let score = 0;
    
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const qIndexSpan = document.getElementById("q-index");
    const totalQSpan = document.getElementById("total-q");
    const timerDisplay = document.getElementById("time-left");
    const progressFill = document.getElementById("progress-fill");
    const finalScoreEl = document.getElementById("final-score");
    const accuracyTextEl = document.getElementById("accuracy-text");
    const remarksEl = document.getElementById("remarks");

    function startQuiz() {
        totalQSpan.innerText = questions.length;
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeInSeconds--;
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.innerText = `${minutes}:${seconds}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function showQuestion() {
        resetState();
        let currentQ = questions[currentIdx];
        qIndexSpan.innerText = currentIdx + 1;
        qText.innerText = `Q${currentIdx + 1}. ${currentQ.question}`;
        let progress = ((currentIdx) / questions.length) * 100;
        progressFill.style.width = progress + "%";
        
        currentQ.answers.forEach(ans => {
            const btn = document.createElement("button");
            btn.innerText = ans.text;
            btn.classList.add("option-btn");
            if(ans.correct) btn.dataset.correct = ans.correct;
            btn.addEventListener("click", selectAnswer);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while(optContainer.firstChild) optContainer.removeChild(optContainer.firstChild);
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if(isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }
        Array.from(optContainer.children).forEach(btn => {
            if(btn.dataset.correct === "true") btn.classList.add("correct");
            btn.disabled = true;
        });
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        let accuracy = Math.round((score / questions.length) * 100);
        finalScoreEl.innerText = `${score} / ${questions.length}`;
        accuracyTextEl.innerText = `Accuracy: ${accuracy}%`;
        
        if(accuracy >= 80) {
            remarksEl.innerText = "🏭 शानदार! उद्योगों की जानकारी अच्छी है!";
            remarksEl.style.color = "green";
        } else if(accuracy >= 50) {
            remarksEl.innerText = "👍 ठीक है, पर किस राज्य में कौन सा उद्योग है, याद करें।";
            remarksEl.style.color = "orange";
        } else {
            remarksEl.innerText = "📚 रिवीजन की सख्त जरूरत है।";
            remarksEl.style.color = "red";
        }
    }

    startQuiz();
</script>

</body>
</html>
