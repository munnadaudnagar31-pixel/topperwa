    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL HINDI THEME (Saffron) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            --header-gradient: linear-gradient(135deg, #e65100 0%, #ff6f00 100%);
            --card-bg: #ffffff;
            --text-main: #3e2723;
            --text-sub: #e65100;
            --option-bg: #fff8e1;
            --correct-color: #2e7d32; /* Green */
            --wrong-color: #c62828;   /* Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #ffe0b2; }
        .progress-bar { height: 100%; background: #ef6c00; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(230, 81, 0, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #ff6f00;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #fff3e0; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #fff; background: #e65100; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #e65100; letter-spacing: 1px; }

        .question-text { 
            font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #3e2723; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 16px; color: #4e342e; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffcc80;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #ff9800; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #ffe0b2; }
        
        /* Correct State */
        .option-btn.correct { background: #e8f5e9; border-color: var(--correct-color); color: #1b5e20; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #fff3e0;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(230, 81, 0, 0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #e65100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #e65100; line-height: 1; }
        .score-label { font-size: 11px; color: #ef6c00; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #5d4037; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #2e7d32; }
        .red-text { color: #c62828; }
        .blue-text { color: #1565c0; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #e65100; color: white; box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3); }
        .btn-secondary { background: #ffe0b2; color: #e65100; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>

    <script>
        // --- DATA: 50 MCQs from 'Avinyo' ---
        const questions = [
            { q: "'आविन्यों' पाठ के लेखक कौन हैं?", o: ["अशोक वाजपेयी", "रामविलास शर्मा", "नलिन विलोचन शर्मा", "अमरकांत"], a: 0 },
            { q: "अशोक वाजपेयी का जन्म कब हुआ था?", o: ["16 जनवरी 1941", "16 जनवरी 1942", "16 जनवरी 1940", "16 जनवरी 1943"], a: 0 },
            { q: "अशोक वाजपेयी का जन्म कहाँ हुआ था?", o: ["दुर्ग (छत्तीसगढ़)", "रायपुर", "जबलपुर", "बिलासपुर"], a: 0 },
            { q: "अशोक वाजपेयी की माता का क्या नाम था?", o: ["निर्मला देवी", "सुशीला देवी", "कमला देवी", "विमला देवी"], a: 0 },
            { q: "अशोक वाजपेयी के पिता का क्या नाम था?", o: ["परमानंद वाजपेयी", "रामानंद वाजपेयी", "श्यामानंद वाजपेयी", "देवानंद वाजपेयी"], a: 0 },
            { q: "'आविन्यों' किस देश में स्थित है?", o: ["दक्षिणी फ्रांस", "रूस", "अमेरिका", "इंग्लैंड"], a: 0 },
            { q: "आविन्यों किस नदी के किनारे बसा है?", o: ["रोन नदी", "टेम्स नदी", "सीन नदी", "गंगा नदी"], a: 0 },
            { q: "'आविन्यों' क्या है?", o: ["एक पुराना शहर", "एक जंगल", "एक पहाड़", "एक देश"], a: 0 },
            { q: "पोप की राजधानी (Pope's Capital) कहाँ थी?", o: ["आविन्यों", "लंदन", "रोम", "पेरिस"], a: 0 },
            { q: "ला शत्रुज (La Chartreuse) क्या है?", o: ["ईसाई मठ (Carthusian monastery)", "किला", "अस्पताल", "स्कूल"], a: 0 },
            { q: "अशोक वाजपेयी ला शत्रुज में कितने दिनों तक रहे?", o: ["19 दिन", "20 दिन", "15 दिन", "10 दिन"], a: 0 },
            { q: "लेखक ने आविन्यों में रहकर कितनी कविताएँ लिखीं?", o: ["35 कविताएँ", "30 कविताएँ", "25 कविताएँ", "20 कविताएँ"], a: 0 },
            { q: "लेखक ने आविन्यों में रहकर कितने गद्य लिखे?", o: ["27 गद्य", "20 गद्य", "25 गद्य", "30 गद्य"], a: 0 },
            { q: "अशोक वाजपेयी अपने साथ क्या-क्या ले गए थे?", o: ["हिंदी का टाइपराइटर, टेप्स, किताबें", "कपड़े, खाना", "दोस्त", "कैमरा"], a: 0 },
            { q: "पिकासो (Picasso) कौन थे?", o: ["प्रसिद्ध चित्रकार", "कवि", "गायक", "लेखक"], a: 0 },
            { q: "पिकासो की प्रसिद्ध कृति का नाम क्या है?", o: ["ल मादा मोजेल द आविन्यों", "मोनालिसा", "द लास्ट सपर", "गुएर्निका"], a: 0 },
            { q: "आविन्यों में प्रतिवर्ष क्या आयोजित होता है?", o: ["रंग-समारोह (Theater Festival)", "खेल प्रतियोगिता", "संगीत समारोह", "विज्ञान मेला"], a: 0 },
            { q: "रोन नदी के दूसरी ओर आविन्यों का एक और हिस्सा है, उसे क्या कहते हैं?", o: ["विलनल्व ल आविन्यों", "ला शत्रुज", "नया आविन्यों", "पुराना आविन्यों"], a: 0 },
            { q: "'विलनल्व' का अर्थ क्या है?", o: ["नया गाँव", "पुराना गाँव", "बड़ा शहर", "छोटा शहर"], a: 0 },
            { q: "कार्थूसियन संप्रदाय का ईसाई मठ कहाँ है?", o: ["ला शत्रुज", "विलनल्व", "पेरिस", "रोम"], a: 0 },
            { q: "आंद्रे ब्रेताँ क्या हैं?", o: ["कवि", "चित्रकार", "संगीतकार", "नाटककार"], a: 0 },
            { q: "नदी के किनारे भी _____ है।", o: ["नदी", "पहाड़", "शहर", "पेड़"], a: 0 },
            { q: "अशोक वाजपेयी किस विश्वविद्यालय के प्रथम कुलपति रहे?", o: ["महात्मा गाँधी अंतरराष्ट्रीय हिंदी विश्वविद्यालय", "दिल्ली विश्वविद्यालय", "जवाहरलाल नेहरू वि०वि०", "बनारस हिन्दू वि०वि०"], a: 0 },
            { q: "'शहर अब भी संभावना है' किसकी कृति है?", o: ["अशोक वाजपेयी", "विनोद कुमार शुक्ल", "रामविलास शर्मा", "अज्ञेय"], a: 0 },
            { q: "'प्रतीक्षा करते हैं पत्थर' किसकी कविता संग्रह है?", o: ["अशोक वाजपेयी", "निराला", "दिनकर", "पंत"], a: 0 },
            { q: "फ्रांस का प्रमुख कला केंद्र रहा है:", o: ["आविन्यों", "पेरिस", "लियोन", "मार्सिले"], a: 0 },
            { q: "पीटर ब्रुक का विवादस्पद 'महाभारत' कहाँ प्रस्तुत किया जाने वाला था?", o: ["आविन्यों में", "भारत में", "लंदन में", "अमेरिका में"], a: 0 },
            { q: "किसने पोप की गतिविधियों पर नजर रखने के लिए किला बनवाया था?", o: ["फ्रेंच शासकों ने", "अंग्रेजों ने", "जर्मनों ने", "रूसियों ने"], a: 0 },
            { q: "ला शत्रुज का भीतरी भाग किस रंग के पत्थरों से बना था?", o: ["रंगीन", "सफेद", "काले", "लाल"], a: 0 },
            { q: "अशोक वाजपेयी ने 19 दिनों में कुल कितनी रचनाएँ कीं?", o: ["62 (35+27)", "50", "60", "70"], a: 0 },
            { q: "'एक पतंग अनंत में' किसकी रचना है?", o: ["अशोक वाजपेयी", "विनोद कुमार शुक्ल", "यतीन्द्र मिश्र", "अनामिका"], a: 0 },
            { q: "'तत्पुरुष' किसकी रचना है?", o: ["अशोक वाजपेयी", "ज्ञानेंद्रपति", "कुंवर नारायण", "वीरेन डंगवाल"], a: 0 },
            { q: "अशोक वाजपेयी ने किस पत्रिका का संपादन किया?", o: ["समवेत, पहचान, पूर्वग्रह", "हंस", "धर्मयुग", "सरस्वती"], a: 0 },
            { q: "'कविता का जनपद' किसकी पुस्तक है?", o: ["अशोक वाजपेयी", "मुक्तिबोध", "शमशेर", "त्रिलोचन"], a: 0 },
            { q: "लास शत्रुज में अब क्या होता है?", o: ["कला केंद्र है (लेखक/कलाकार रहते हैं)", "होटल है", "म्यूजियम है", "स्कूल है"], a: 0 },
            { q: "लेखक को आविन्यों किसने बुलाया था?", o: ["फ्रेंच सरकार के सहयोग से (पीटर ब्रुक)", "भारत सरकार", "दोस्तों ने", "रिश्तेदारों ने"], a: 0 },
            { q: "आविन्यों फ्रांस का एक प्रमुख _____ रहा है।", o: ["कला केंद्र", "व्यापार केंद्र", "राजनीतिक केंद्र", "सैनिक छावनी"], a: 0 },
            { q: "'कहीं नहीं वहीं' कविता संग्रह के रचयिता हैं:", o: ["अशोक वाजपेयी", "रघुवीर सहाय", "श्रीकांत वर्मा", "केदारनाथ सिंह"], a: 0 },
            { q: "अशोक वाजपेयी किस सेवा के अधिकारी थे?", o: ["भारतीय प्रशासनिक सेवा (IAS)", "IPS", "IFS", "IRS"], a: 0 },
            { q: "14वीं सदी में पोप की पीठ (Seat) कहाँ थी?", o: ["आविन्यों", "वेटिकन सिटी", "रोम", "जिनेवा"], a: 0 },
            { q: "लेखक ने अपनी रचनाएँ कहाँ बैठकर लिखीं?", o: ["ला शत्रुज के कमरों और बरामदों में", "नदी किनारे", "पार्क में", "होटल में"], a: 0 },
            { q: "आविन्यों पाठ गद्य की कौन सी विधा है?", o: ["ललित रचना / यात्रा वृत्तांत", "कहानी", "जीवनी", "डायरी"], a: 0 },
            { q: "अशोक वाजपेयी को कौन सा सम्मान मिला है?", o: ["साहित्य अकादमी पुरस्कार", "दयावती मोदी कवि शेखर सम्मान", "फ्रेंच सरकार का 'ऑफिसर ऑफ द ऑर्डर ऑफ आर्ट्स एंड लेटर्स'", "उपर्युक्त सभी"], a: 3 },
            { q: "नदी के किनारे लेखक को कैसा महसूस होता है?", o: ["जैसे वे स्वयं नदी हो गए हों", "अकेलापन", "डर", "खुशी"], a: 0 },
            { q: "विनोद कुमार शुक्ल को साहित्य अकादमी पुरस्कार कब मिला?", o: ["1999", "1990", "1992", "1994"], a: 0 }, /* Note: Though unrelated to Ashok Vajpeyi directly, sometimes board asks cross questions, but sticking to Ashok Vajpeyi mainly */
            { q: "'बहुरी अकेला' किसकी कृति है?", o: ["अशोक वाजपेयी", "निराला", "मैथिलीशरण गुप्त", "हरिऔध"], a: 0 },
            { q: "अशोक वाजपेयी किस राज्य के निवासी मूलतः हैं?", o: ["मध्य प्रदेश (छत्तीसगढ़)", "उत्तर प्रदेश", "बिहार", "राजस्थान"], a: 0 },
            { q: "कुंवर नारायण ने अशोक वाजपेयी के बारे में क्या कहा है?", o: ["वे एक संवेदनशील गद्यकार हैं", "वे कठोर हैं", "वे केवल कवि हैं", "कुछ नहीं"], a: 0 },
            { q: "आविन्यों में लेखक के पास मनोरंजन के लिए क्या था?", o: ["संगीत (टेप्स) और किताबें", "टीवी", "रेडियो", "इंटरनेट"], a: 0 },
            { q: "नदी तट पर लेखक को किसकी याद आती है?", o: ["विनोद कुमार शुक्ल की कविता की", "घर की", "माँ की", "दोस्तों की"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 900; // 15 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#c62828';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "कला प्रेमी! आपको साहित्य और कला की गहरी समझ है! 🎨";
            else if(accuracy >= 70) feedback.innerText = "बहुत बढ़िया! आविन्यों की यात्रा सफल रही। 👍";
            else if(accuracy >= 50) feedback.innerText = "ठीक है। पिकासो और नदी के बारे में और पढ़ें। 🌊";
            else feedback.innerText = "फ्रांस की यात्रा (किताब में) फिर से करें! 🔥";
        }
    </script>
</body>
</html>
