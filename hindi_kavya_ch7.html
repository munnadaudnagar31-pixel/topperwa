<!DOCTYPE html>
<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Kavya Ch-7: हिरोशिमा</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL HINDI THEME (Saffron) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            --header-gradient: linear-gradient(135deg, #e65100 0%, #ff6f00 100%);
            --card-bg: #ffffff;
            --text-main: #3e2723;
            --text-sub: #e65100;
            --option-bg: #fff8e1;
            --correct-color: #2e7d32; /* Green */
            --wrong-color: #c62828;   /* Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #ffe0b2; }
        .progress-bar { height: 100%; background: #ef6c00; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(230, 81, 0, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #ff6f00;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #fff3e0; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #fff; background: #e65100; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #e65100; letter-spacing: 1px; }

        .question-text { 
            font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #3e2723; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 16px; color: #4e342e; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffcc80;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #ff9800; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #ffe0b2; }
        
        /* Correct State */
        .option-btn.correct { background: #e8f5e9; border-color: var(--correct-color); color: #1b5e20; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #fff3e0;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(230, 81, 0, 0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #e65100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #e65100; line-height: 1; }
        .score-label { font-size: 11px; color: #ef6c00; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #5d4037; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #2e7d32; }
        .red-text { color: #c62828; }
        .blue-text { color: #1565c0; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #e65100; color: white; box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3); }
        .btn-secondary { background: #ffe0b2; color: #e65100; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="hindi_chapters.html" class="close-btn">✕</a>
        <div class="timer-box">
            <span>⏳</span> <span id="time-left">10:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">1 / 30</span>
                <span class="q-subject">हिरोशिमा</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#e65100; margin-bottom: 10px;">Quiz Complete!</h2>
            <p style="color:#ef6c00; font-size:14px; margin-bottom: 25px;">हिरोशिमा</p>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 30</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#5d4037; font-size:14px; margin-bottom:25px; line-height:1.4;">बहुत अच्छा!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='hindi_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 30 MCQs from 'Hiroshima' ---
        const questions = [
            { q: "'हिरोशिमा' कविता के कवि कौन हैं?", o: ["अज्ञेय (स. ही. वा.)", "कुंवर नारायण", "जीवननंद दास", "दिनकर"], a: 0 },
            { q: "अज्ञेय का पूरा नाम क्या है?", o: ["सच्चिदानंद हीरानंद वात्स्यायन 'अज्ञेय'", "सच्चिदानंद वात्स्यायन", "हीरानंद शास्त्री", "अज्ञेय कुमार"], a: 0 },
            { q: "अज्ञेय का जन्म कब हुआ था?", o: ["1911 ई०", "1910 ई०", "1912 ई०", "1915 ई०"], a: 0 },
            { q: "अज्ञेय का जन्म कहाँ हुआ था?", o: ["कसया (कुशीनगर, उ.प्र.)", "इलाहाबाद", "बनारस", "पटना"], a: 0 },
            { q: "'हिरोशिमा' कविता किस काव्य संग्रह से संकलित है?", o: ["सदानीरा", "हरी घास पर क्षण भर", "आंगन के पार द्वार", "चिंता"], a: 0 },
            { q: "हिरोशिमा कहाँ स्थित है?", o: ["जापान में", "चीन में", "जर्मनी में", "फ्रांस में"], a: 0 },
            { q: "कविता में 'सूरज' किसे कहा गया है?", o: ["परमाणु बम (अणु बम) को", "आकाश के सूर्य को", "बिजली के बल्ब को", "आग को"], a: 0 },
            { q: "एक दिन सहसा सूरज कहाँ निकला?", o: ["नगर के चौक पर (धरती पर)", "क्षितिज पर", "पहाड़ पर", "समुद्र में"], a: 0 },
            { q: "धूप बरसी, पर कहाँ से नहीं?", o: ["आकाश से नहीं (मिट्टी से)", "बादल से", "सूर्य से", "चाँद से"], a: 0 },
            { q: "छायाएँ दिशाहीन होकर कहाँ पड़ी थीं?", o: ["सब ओर (हर दिशा में)", "पूर्व में", "पश्चिम में", "मकानों में"], a: 0 },
            { q: "परमाणु बम गिरने पर मनुष्य किस रूप में बदल गया?", o: ["भाप बनकर उड़ गया", "राख बन गया", "पत्थर बन गया", "अदृश्य हो गया"], a: 0 },
            { q: "मनुष्य की छायाएँ कहाँ लिखी हुई हैं?", o: ["झुलसे हुए पत्थरों और सड़कों पर", "किताबों में", "इतिहास में", "दीवारों पर"], a: 0 },
            { q: "वह सूरज नहीं उगा था ____ पर।", o: ["क्षितिज (Horizon)", "छत", "पहाड़", "नदी"], a: 0 },
            { q: "काल-सूर्य के रथ के पहियों के ज्यों अरे टूटकर बिखर गए हों - इसमें कौन सा अलंकार है?", o: ["उपमा/उत्प्रेक्षा", "रूपक", "यमक", "श्लेष"], a: 0 },
            { q: "अज्ञेय ने हिंदी साहित्य में किस वाद का सूत्रपात किया?", o: ["प्रयोगवाद", "छायावाद", "प्रगतिवाद", "रहस्यवाद"], a: 0 },
            { q: "अज्ञेय ने 'तार सप्तक' का संपादन कब किया?", o: ["1943 ई०", "1940 ई०", "1945 ई०", "1950 ई०"], a: 0 },
            { q: "यह कविता किसका चित्रण करती है?", o: ["आधुनिक सभ्यता की दुर्दांत मानवीय विभीषिका का", "प्रकृति सौंदर्य का", "प्रेम का", "भक्ति का"], a: 0 },
            { q: "सूरज कहाँ से निकला था?", o: ["फोड़कर धरती (मिट्टी से)", "आसमान से", "गुफा से", "समुद्र से"], a: 0 },
            { q: "मानव का रचा हुआ सूरज मानव को ही _____ गया।", o: ["भाप बनाकर सोख गया", "प्रकाश दे गया", "जला गया", "अमर कर गया"], a: 0 },
            { q: "अज्ञेय को किस पुरस्कार से सम्मानित किया गया?", o: ["साहित्य अकादमी और ज्ञानपीठ", "भारत रत्न", "पद्म विभूषण", "नोबेल"], a: 0 },
            { q: "'शेखर: एक जीवनी' किसकी रचना है?", o: ["अज्ञेय", "प्रेमचंद", "जैनेंद्र", "यशपाल"], a: 0 },
            { q: "'नदी के द्वीप' किस विधा की रचना है?", o: ["उपन्यास", "कहानी", "कविता", "निबंध"], a: 0 },
            { q: "हिरोशिमा पर बम किसने गिराया था?", o: ["अमेरिका ने", "रूस ने", "चीन ने", "जर्मनी ने"], a: 0 },
            { q: "दुर्दांत मानवीय विभीषिका का चित्रण करने वाली कविता है:", o: ["हिरोशिमा", "भारतमाता", "जनतंत्र का जन्म", "एक वृक्ष की हत्या"], a: 0 },
            { q: "छायाएँ लंबी क्यों नहीं हुईं?", o: ["क्योंकि सूरज आकाश में नहीं, चौक पर उगा था (समय नहीं मिला)", "शाम हो गई थी", "बादल थे", "रात थी"], a: 0 },
            { q: "मानव जन की 'दुपहरी' कब आई?", o: ["पल भर में (अचानक)", "शाम को", "सुबह", "रात में"], a: 0 },
            { q: "साखी (काव्य संकलन) के रचयिता कौन हैं?", o: ["अज्ञेय", "कबीर", "रसखान", "दिनकर"], a: 0 },
            { q: "अज्ञेय का निधन कब हुआ?", o: ["1987 ई०", "1980 ई०", "1990 ई०", "1985 ई०"], a: 0 },
            { q: "पत्थर पर लिखी हुई वह जली हुई छाया किसकी साखी (गवाह) है?", o: ["मानव की (त्रासदी की)", "प्रकृति की", "ईश्वर की", "विज्ञान की"], a: 0 },
            { q: "कितनी नावों में कितनी बार - किसकी कृति है?", o: ["अज्ञेय", "पंत", "निराला", "महादेवी"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 600; // 10 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#c62828';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "संवेदनशील इंसान! आपने युद्ध की विभीषिका समझी! 🕊️";
            else if(accuracy >= 70) feedback.innerText = "बहुत बढ़िया! अज्ञेय जी की चेतावनी याद रखें। 👍";
            else if(accuracy >= 50) feedback.innerText = "अच्छा है। विज्ञान का सही उपयोग करें। 🧪";
            else feedback.innerText = "इतिहास और कविता दोनों फिर से पढ़ें! 🔥";
        }
    </script>
</body>
</html>
