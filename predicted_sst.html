            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            color: #aaa;
        }

        // ---------------------------------------------------------
        // RENDER LOGIC
        // ---------------------------------------------------------
        const list = document.getElementById('questionList');

        questions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-header" onclick="toggleAnswer(this)">
                    <div class="q-title">
                        <span class="tag">${item.tag}</span>
                        <br>
                        <span style="color:var(--primary)">Q${index + 1}.</span> ${item.q}
                    </div>
                    <div style="text-align:right">
                        <span class="prob-badge">${item.prob} Chance</span>
                        <br>
                        <div class="icon-toggle" style="margin-top:10px; text-align:right">▼</div>
                    </div>
                </div>
                <div class="q-answer">
                    <p style="margin-bottom:10px; color:#aaa; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">उत्तर (Answer):</p>
                    ${item.a}
                </div>
            `;
            list.appendChild(card);
        });

        // ---------------------------------------------------------
        // INTERACTION LOGIC
        // ---------------------------------------------------------
        function toggleAnswer(header) {
            playSound('click');
            const card = header.parentElement;
            const isOpen = card.classList.contains('active');

            // Optional: Close others (Accordion effect)
            document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));

            if (!isOpen) {
                card.classList.add('active');
            }
        }

        function playSound(type) {
            // Sound logic placeholder
        }
    </script>
