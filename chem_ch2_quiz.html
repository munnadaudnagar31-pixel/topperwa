<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Chemistry Ch-2 Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL GRADIENT THEME (CHEMISTRY - TEAL) --- */
        :root {
            --bg-gradient: linear-gradient(180deg, #E0F7FA 0%, #B2DFDB 100%);
            --header-gradient: linear-gradient(135deg, #00695C 0%, #004D40 100%);
            --card-bg: #ffffff;
            --text-main: #004D40;
            --text-sub: #00796B;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Green */
            --wrong-color: #FF1744;   /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        .quiz-header {
            background: var(--header-gradient); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10;
        }
        .close-btn { font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.8; }
        .timer-badge {
            background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); }
        .progress-bar { height: 100%; background: #00C853; width: 0%; transition: width 0.3s; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 77, 64, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 80px;
        }

        .q-count { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .question-text { font-size: 18px; font-weight: 700; margin-bottom: 25px; line-height: 1.4; color: #2d3436; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #444; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative;
        }

        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center;
        }

        .next-btn {
            background: var(--header-gradient); color: white; border: none;
            width: 100%; max-width: 600px; padding: 16px; border-radius: 18px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 77, 64, 0.3); transition: 0.2s;
            display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 30px; animation: fadeIn 0.5s;
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: white; border: 8px solid #009688;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .score-num { font-size: 36px; font-weight: 800; color: #004D40; }
        .score-total { font-size: 14px; color: #aaa; font-weight: 600; }
        .home-btn {
            background: #2d3436; color: white; padding: 15px 30px; border-radius: 50px;
            text-decoration: none; font-weight: 600; margin-top: 20px; display: inline-block;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="chemistry_chapters.html" class="close-btn">✕</a>
        <span>Ch-2: Acids, Bases & Salts</span>
        <div class="timer-badge" id="question-tracker">1/45</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <span class="q-count" id="q-number">Question 1</span>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="score-circle">
            <span class="score-num" id="final-score">0</span>
            <span class="score-total">OUT OF 45</span>
        </div>
        <h2 style="color: #004D40; margin-bottom: 10px;">Quiz Completed!</h2>
        <p style="color: #666; margin-bottom: 20px;">Well done on finishing Chapter 2.</p>
        <a href="chemistry_chapters.html" class="next-btn" style="display:block; text-align:center; text-decoration:none;">Back to Chapters</a>
        <br>
        <div style="cursor:pointer; color:#009688; font-weight:600;" onclick="location.reload()">↺ Restart Quiz</div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <script>
        // --- DATA: 45 QUESTIONS (Acids, Bases & Salts) ---
        const questions = [
            { q: "What is the taste of an Acid?", o: ["Bitter", "Sour", "Salty", "Sweet"], a: 1 },
            { q: "Litmus paper turns from blue to red in the presence of:", o: ["Acid", "Base", "Salt", "Water"], a: 0 },
            { q: "Which of the following is a natural indicator?", o: ["Methyl Orange", "Phenolphthalein", "Litmus", "Sodium Hydroxide"], a: 2 },
            { q: "Turmeric is a natural indicator. In a basic solution, its colour changes to:", o: ["Yellow", "Reddish-brown", "Blue", "Green"], a: 1 },
            { q: "Which acid is present in gastric juice?", o: ["Sulphuric Acid", "Nitric Acid", "Hydrochloric Acid", "Acetic Acid"], a: 2 },
            { q: "Which of the following is an olfactory indicator?", o: ["Litmus", "Vanilla", "Turmeric", "Methyl Orange"], a: 1 },
            { q: "When an acid reacts with a metal, which gas is evolved?", o: ["Oxygen", "Carbon Dioxide", "Hydrogen", "Nitrogen"], a: 2 },
            { q: "The pH of a neutral solution is:", o: ["0", "7", "14", "1"], a: 1 },
            { q: "Acids turn methyl orange solution:", o: ["Yellow", "Red", "Blue", "Green"], a: 1 },
            { q: "Bases turn phenolphthalein solution:", o: ["Colourless", "Pink", "Yellow", "Red"], a: 1 },
            { q: "What happens when CO2 gas is passed through lime water for a short time?", o: ["It turns milky", "It becomes colourless", "It turns blue", "No change"], a: 0 },
            { q: "If CO2 is passed in excess through lime water, the milkiness disappears due to formation of:", o: ["Calcium Carbonate", "Calcium Bicarbonate", "Calcium Oxide", "Calcium Chloride"], a: 1 },
            { q: "The chemical formula of Caustic Soda is:", o: ["NaCl", "NaOH", "Na2CO3", "NaHCO3"], a: 1 },
            { q: "Reaction of Acid and Base to form Salt and Water is called:", o: ["Combination", "Neutralization", "Decomposition", "Redox"], a: 1 },
            { q: "Which acid is found in vinegar?", o: ["Citric acid", "Acetic acid", "Lactic acid", "Tartaric acid"], a: 1 },
            { q: "Which acid is present in Tamarind?", o: ["Tartaric acid", "Oxalic acid", "Methanoic acid", "Acetic acid"], a: 0 },
            { q: "Which acid is present in a bee sting?", o: ["Formic acid (Methanoic acid)", "Acetic acid", "Citric acid", "Hydrochloric acid"], a: 0 },
            { q: "Tooth enamel is made up of:", o: ["Calcium Carbonate", "Calcium Phosphate", "Calcium Oxide", "Potassium Nitrate"], a: 1 },
            { q: "Tooth decay starts when the pH of the mouth is lower than:", o: ["7.0", "6.5", "5.5", "8.0"], a: 2 },
            { q: "What is the common name of CaOCl2?", o: ["Baking Soda", "Washing Soda", "Bleaching Powder", "Gypsum"], a: 2 },
            { q: "Chemical formula of Baking Soda is:", o: ["Na2CO3", "NaHCO3", "NaCl", "NaOH"], a: 1 },
            { q: "Chemical formula of Washing Soda is:", o: ["Na2CO3", "Na2CO3.10H2O", "NaHCO3", "NaOH"], a: 1 },
            { q: "Plaster of Paris is obtained by heating:", o: ["Gypsum", "Limestone", "Bleaching Powder", "Baking Soda"], a: 0 },
            { q: "The chemical formula of Plaster of Paris is:", o: ["CaSO4.2H2O", "CaSO4.1/2H2O", "CaSO4", "CaSO4.H2O"], a: 1 },
            { q: "How many water molecules does Gypsum contain?", o: ["1", "2", "1/2", "10"], a: 1 },
            { q: "Which of the following is a strong acid?", o: ["Acetic acid", "Citric acid", "Sulphuric acid", "Tartaric acid"], a: 2 },
            { q: "Which of the following is a weak base?", o: ["NaOH", "KOH", "NH4OH", "Ca(OH)2"], a: 2 },
            { q: "A solution turns red litmus blue, its pH is likely to be:", o: ["1", "4", "5", "10"], a: 3 },
            { q: "A solution reacts with crushed egg-shells to give a gas that turns lime-water milky. The solution contains:", o: ["NaCl", "HCl", "LiCl", "KCl"], a: 1 },
            { q: "Brine is an aqueous solution of:", o: ["NaOH", "NaCl", "NaHCO3", "Na2CO3"], a: 1 },
            { q: "Which process is used for the manufacture of Sodium Hydroxide?", o: ["Chlor-alkali process", "Solvay process", "Haber process", "Contact process"], a: 0 },
            { q: "The pH range of our body is:", o: ["7.0 to 7.8", "5.5 to 6.5", "0 to 14", "2.0 to 3.0"], a: 0 },
            { q: "Acid rain occurs when pH of rain water is less than:", o: ["6.5", "7.0", "5.6", "4.0"], a: 2 },
            { q: "Antacids contain:", o: ["Weak acid", "Weak base", "Strong acid", "Strong base"], a: 1 },
            { q: "Which of the following salts does not contain water of crystallization?", o: ["Blue vitriol", "Baking soda", "Washing soda", "Gypsum"], a: 1 },
            { q: "Sodium carbonate is a basic salt because it is a salt of:", o: ["Strong acid and strong base", "Weak acid and weak base", "Strong acid and weak base", "Weak acid and strong base"], a: 3 },
            { q: "Nettle sting causes pain due to:", o: ["Methanoic acid", "Lactic acid", "Tartaric acid", "Oxalic acid"], a: 0 },
            { q: "Which substance is used for disinfecting drinking water?", o: ["Baking Soda", "Washing Soda", "Bleaching Powder", "Gypsum"], a: 2 },
            { q: "The number of water molecules in Blue Vitriol (Copper Sulphate) is:", o: ["2", "5", "7", "10"], a: 1 },
            { q: "Which acid is present in sour milk (Curd)?", o: ["Citric acid", "Tartaric acid", "Lactic acid", "Oxalic acid"], a: 2 },
            { q: "What is the colour of hydrated Copper Sulphate?", o: ["White", "Blue", "Green", "Red"], a: 1 },
            { q: "What is the colour of heating Gypsum at 373K?", o: ["It turns black", "It loses water and becomes white powder", "It turns blue", "No change"], a: 1 },
            { q: "Which salt is used in fire extinguishers?", o: ["Washing Soda", "Baking Soda", "Bleaching Powder", "Common Salt"], a: 1 },
            { q: "Which of the following is acidic in nature?", o: ["Lime water", "Human blood", "Lime juice", "Antacid"], a: 2 },
            { q: "Zinc granules on treating with Sodium Hydroxide produce:", o: ["H2 gas", "O2 gas", "CO2 gas", "N2 gas"], a: 0 }
        ];

        // --- GAME LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const tracker = document.getElementById('question-tracker');
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');

        loadQuestion();

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1}`;
            qText.innerText = q.q;
            tracker.innerText = `${currentQuestion + 1}/${questions.length}`;
            
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({behavior: "smooth"});
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
                quizUI.scrollTop = 0;
            } else {
                showResult();
            }
        }

        function showResult() {
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            resultUI.style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
