<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Chapter 4 - Live Test</title>
    <style>
        /* --- MODERN UI STYLE (Theme: Indian Saffron/Orange) --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #FF512F 0%, #F09819 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        .quiz-container { background: #fff; width: 100%; max-width: 550px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
        .quiz-header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
        
        .timer-box { background: #fff3e0; color: #e65100; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .question-count { font-size: 14px; color: #666; font-weight: 500; }
        
        .progress-bar { height: 6px; width: 100%; background: #f1f1f1; }
        .progress-fill { height: 100%; background: #FF512F; width: 0%; transition: width 0.3s ease; }
        
        .quiz-body { padding: 25px 20px; }
        h2#question-text { font-size: 18px; color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; padding: 14px; border-radius: 10px; font-size: 15px; color: #444; cursor: pointer; text-align: left; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #ffe0b2; }
        
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        .quiz-footer { padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #next-btn { background: #FF512F; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; display: none; }
        #next-btn:hover { background: #e64a19; }
        .home-link { text-decoration: none; color: #666; font-size: 14px; font-weight: 500; }
        
        .result-box { text-align: center; padding: 40px 20px; display: none; }
        .score-circle { width: 120px; height: 120px; background: #FF512F; color: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 5px 15px rgba(255, 81, 47, 0.4); }
        .score-big { font-size: 32px; font-weight: bold; }
        .score-label { font-size: 12px; opacity: 0.9; }
        .accuracy-text { font-size: 18px; color: #333; margin-bottom: 20px; font-weight: 600; }
        .remarks { color: #666; font-size: 14px; margin-bottom: 30px; }
        .action-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-restart, .btn-home { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 500; text-decoration: none; }
        .btn-restart { background: #FF512F; color: white; }
        .btn-home { background: #eee; color: #333; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="quiz-header">
            <div class="question-count">Question: <span id="q-index">1</span>/<span id="total-q">5</span></div>
            <div class="timer-box">⏳ <span id="time-left">15:00</span></div>
        </div>
        <div class="quiz-body">
            <h2 id="question-text">प्रश्न लोड हो रहा है...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
        <div class="quiz-footer">
            <a href="history_chapters.html" class="home-link">Quit Quiz</a>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <div class="score-circle">
            <span class="score-big" id="final-score">0</span>
            <span class="score-label">Score</span>
        </div>
        <div class="accuracy-text" id="accuracy-text">Accuracy: 0%</div>
        <p class="remarks" id="remarks">Well Done!</p>
        <div class="action-btns">
            <button class="btn-restart" onclick="location.reload()">🔄 Retry</button>
            <a href="history_chapters.html" class="btn-home">📂 Chapter List</a>
        </div>
    </div>
</div>

<script>
    // Chapter 4 बड़ा है, इसलिए 15 मिनट का समय दिया है
    const TOTAL_TIME_MINUTES = 15;
    let timeInSeconds = TOTAL_TIME_MINUTES * 60;
    let timerInterval;

    // ▼▼▼ CHAPTER 4 QUESTIONS (भारत में राष्ट्रवाद) ▼▼▼
    const questions = [
        { question: "1. गदर पार्टी की स्थापना किसने और कब की?", answers: [ { text: "गुरदयाल सिंह, 1916", correct: false }, { text: "चंद्रशेखर आजाद, 1920", correct: false }, { text: "लाला हरदयाल, 1913", correct: true }, { text: "सोहन सिंह भाखना, 1918", correct: false } ] },
        { question: "2. जलियाँवाला बाग हत्याकांड किस तिथि को हुआ?", answers: [ { text: "13 अप्रैल 1919", correct: true }, { text: "14 अप्रैल 1919", correct: false }, { text: "15 अप्रैल 1919", correct: false }, { text: "16 अप्रैल 1919", correct: false } ] },
        { question: "3. लखनऊ समझौता किस वर्ष हुआ?", answers: [ { text: "1916", correct: true }, { text: "1918", correct: false }, { text: "1920", correct: false }, { text: "1922", correct: false } ] },
        { question: "4. असहयोग आंदोलन का प्रस्ताव कांग्रेस के किस अधिवेशन में पारित हुआ?", answers: [ { text: "सितंबर 1920, कलकत्ता", correct: true }, { text: "अक्टूबर 1920, अहमदाबाद", correct: false }, { text: "नवंबर 1920, फैजपुर", correct: false }, { text: "दिसंबर 1920, नागपुर", correct: false } ] },
        { question: "5. भारत में खिलाफत आंदोलन कब और किस देश के शासक के समर्थन में शुरू हुआ?", answers: [ { text: "1920, तुर्की", correct: true }, { text: "1920, अरब", correct: false }, { text: "1920, फ्रांस", correct: false }, { text: "1920, जर्मनी", correct: false } ] },
        { question: "6. सविनय अवज्ञा आंदोलन कब और किस यात्रा से शुरू हुआ?", answers: [ { text: "1920, भुज", correct: false }, { text: "1930, अहमदाबाद", correct: false }, { text: "1930, दांडी", correct: true }, { text: "1930, एलबा", correct: false } ] },
        { question: "7. पूर्ण स्वराज की मांग का प्रस्ताव कांग्रेस के किस वार्षिक अधिवेशन में पारित हुआ?", answers: [ { text: "1929, लाहौर", correct: true }, { text: "1931, कराची", correct: false }, { text: "1933, कलकत्ता", correct: false }, { text: "1937, बेलगाँव", correct: false } ] },
        { question: "8. राष्ट्रीय स्वयंसेवक संघ (RSS) की स्थापना कब और किसने की?", answers: [ { text: "1923, गुरु गोलवलकर", correct: false }, { text: "1925, के० बी० हेडगेवार", correct: true }, { text: "1926, चितरंजन दास", correct: false }, { text: "1928, लालचंद", correct: false } ] },
        { question: "9. वल्लभभाई पटेल को 'सरदार' की उपाधि किस किसान आंदोलन के दौरान दी गई?", answers: [ { text: "बारदोली", correct: true }, { text: "अहमदाबाद", correct: false }, { text: "खेड़ा", correct: false }, { text: "चंपारण", correct: false } ] },
        { question: "10. रम्पा विद्रोह कब हुआ?", answers: [ { text: "1916", correct: true }, { text: "1917", correct: false }, { text: "1918", correct: false }, { text: "1919", correct: false } ] },
        { question: "11. 'वेदों की ओर लौटो' का नारा किसने दिया?", answers: [ { text: "दयानंद सरस्वती", correct: true }, { text: "राजा राममोहन राय", correct: false }, { text: "स्वामी विवेकानंद", correct: false }, { text: "रामकृष्ण परमहंस", correct: false } ] },
        { question: "12. स्वराज दल के अध्यक्ष कौन थे?", answers: [ { text: "जवाहरलाल नेहरू", correct: false }, { text: "मोतीलाल नेहरू", correct: false }, { text: "मदन मोहन मालवीय", correct: false }, { text: "चितरंजन दास", correct: true } ] },
        { question: "13. भारतीय राष्ट्रीय कांग्रेस की स्थापना कब हुई?", answers: [ { text: "1879", correct: false }, { text: "1881", correct: false }, { text: "1885", correct: true }, { text: "1890", correct: false } ] },
        { question: "14. तिनकठिया प्रणाली किन पर लागू थी?", answers: [ { text: "किसानों पर", correct: true }, { text: "श्रमिकों पर", correct: false }, { text: "व्यापारियों पर", correct: false }, { text: "उद्योगपतियों पर", correct: false } ] },
        { question: "15. साइमन कमीशन किस वर्ष भारत आया?", answers: [ { text: "1922", correct: false }, { text: "1924", correct: false }, { text: "1927", correct: false }, { text: "1928", correct: true } ] },
        { question: "16. गाँधीजी ने साबरमती आश्रम की स्थापना किस वर्ष की?", answers: [ { text: "1895", correct: false }, { text: "1900", correct: false }, { text: "1915", correct: false }, { text: "1916", correct: true } ] },
        { question: "17. 'फॉरवर्ड ब्लॉक' के संस्थापक कौन थे?", answers: [ { text: "मदन मोहन मालवीय", correct: false }, { text: "सुभाष चन्द्र बोस", correct: true }, { text: "चितरंजन दास", correct: false }, { text: "जवाहरलाल नेहरू", correct: false } ] },
        { question: "18. गाँधीजी ने नमक कानून किस तिथि को भंग किया?", answers: [ { text: "2 मार्च 1930", correct: false }, { text: "12 मार्च 1930", correct: false }, { text: "6 अप्रैल 1930", correct: true }, { text: "25 मई 1930", correct: false } ] },
        { question: "19. भारतीय राष्ट्रीय कांग्रेस के पहले अध्यक्ष कौन थे?", answers: [ { text: "ए० ओ० ह्यूम", correct: false }, { text: "व्योमेश चन्द्र बनर्जी", correct: true }, { text: "बदरुद्दीन तैयबजी", correct: false }, { text: "एनी बेसेंट", correct: false } ] },
        { question: "20. चौरी-चौरा कांड के बाद गाँधीजी ने किस आंदोलन को स्थगित कर दिया?", answers: [ { text: "असहयोग आंदोलन", correct: true }, { text: "खिलाफत आंदोलन", correct: false }, { text: "सविनय अवज्ञा आंदोलन", correct: false }, { text: "भारत छोड़ो आंदोलन", correct: false } ] },
        { question: "21. अखिल भारतीय किसान सभा का गठन कहाँ और कब हुआ?", answers: [ { text: "बिहटा, 1928", correct: false }, { text: "सोनपुर, 1929", correct: false }, { text: "लखनऊ, 1936", correct: true }, { text: "पटना, 1937", correct: false } ] },
        { question: "22. गाँधी-इरविन समझौता (दिल्ली पैक्ट) किस वर्ष हुआ?", answers: [ { text: "1928", correct: false }, { text: "1929", correct: false }, { text: "1930", correct: false }, { text: "1931", correct: true } ] },
        { question: "23. पूना समझौता किनके बीच हुआ?", answers: [ { text: "गाँधी और जिन्ना", correct: false }, { text: "गाँधी और अंबेडकर", correct: true }, { text: "परिवर्तनवादी और अपरिवर्तनवादी", correct: false }, { text: "तिलक और लाला लाजपत राय", correct: false } ] },
        { question: "24. रॉलेट कानून (Rowlatt Act) किस वर्ष पारित हुआ?", answers: [ { text: "1909", correct: false }, { text: "1919", correct: true }, { text: "1935", correct: false }, { text: "1947", correct: false } ] },
        { question: "25. ब्रह्म समाज की स्थापना किसने की?", answers: [ { text: "राजा राममोहन राय", correct: true }, { text: "दयानंद सरस्वती", correct: false }, { text: "विवेकानंद", correct: false }, { text: "रामकृष्ण परमहंस", correct: false } ] },
        { question: "26. टीपू सुल्तान कहाँ के शासक थे?", answers: [ { text: "मैसूर", correct: true }, { text: "शिमला", correct: false }, { text: "कश्मीर", correct: false }, { text: "इनमें से कोई नहीं", correct: false } ] },
        { question: "27. सिखों के दसवें और अंतिम गुरु श्री गोविंद सिंह का जन्म बिहार के किस नगर में हुआ था?", answers: [ { text: "मुंगेर", correct: false }, { text: "खगड़िया", correct: false }, { text: "पटना", correct: true }, { text: "इनमें से कोई नहीं", correct: false } ] },
        { question: "28. अखिल भारतीय ट्रेड यूनियन कांग्रेस (AITUC) की स्थापना कब हुई?", answers: [ { text: "1848", correct: false }, { text: "1881", correct: false }, { text: "1885", correct: false }, { text: "1920", correct: true } ] },
        { question: "29. सविनय अवज्ञा आंदोलन के समय भारत के वायसराय कौन थे?", answers: [ { text: "लॉर्ड डलहौजी", correct: false }, { text: "लॉर्ड इरविन", correct: true }, { text: "लॉर्ड चेम्सफोर्ड", correct: false }, { text: "लॉर्ड मिंटो", correct: false } ] },
        { question: "30. 'हिंद स्वराज' पुस्तक किनके द्वारा लिखी गई?", answers: [ { text: "बाल गंगाधर तिलक", correct: false }, { text: "गोपाल कृष्ण गोखले", correct: false }, { text: "लाला लाजपत राय", correct: false }, { text: "मोहनदास करमचंद गाँधी", correct: true } ] }
    ];

    let currentIdx = 0;
    let score = 0;
    
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const qIndexSpan = document.getElementById("q-index");
    const totalQSpan = document.getElementById("total-q");
    const timerDisplay = document.getElementById("time-left");
    const progressFill = document.getElementById("progress-fill");
    const finalScoreEl = document.getElementById("final-score");
    const accuracyTextEl = document.getElementById("accuracy-text");
    const remarksEl = document.getElementById("remarks");

    function startQuiz() {
        totalQSpan.innerText = questions.length;
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeInSeconds--;
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.innerText = `${minutes}:${seconds}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function showQuestion() {
        resetState();
        let currentQ = questions[currentIdx];
        qIndexSpan.innerText = currentIdx + 1;
        qText.innerText = `Q${currentIdx + 1}. ${currentQ.question}`;
        let progress = ((currentIdx) / questions.length) * 100;
        progressFill.style.width = progress + "%";
        
        currentQ.answers.forEach(ans => {
            const btn = document.createElement("button");
            btn.innerText = ans.text;
            btn.classList.add("option-btn");
            if(ans.correct) btn.dataset.correct = ans.correct;
            btn.addEventListener("click", selectAnswer);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while(optContainer.firstChild) optContainer.removeChild(optContainer.firstChild);
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if(isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }
        Array.from(optContainer.children).forEach(btn => {
            if(btn.dataset.correct === "true") btn.classList.add("correct");
            btn.disabled = true;
        });
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        let accuracy = Math.round((score / questions.length) * 100);
        finalScoreEl.innerText = `${score} / ${questions.length}`;
        accuracyTextEl.innerText = `Accuracy: ${accuracy}%`;
        
        if(accuracy >= 80) {
            remarksEl.innerText = "🇮🇳 अद्भुत! आपकी तैयारी शानदार है!";
            remarksEl.style.color = "green";
        } else if(accuracy >= 50) {
            remarksEl.innerText = "👍 अच्छा है, पर थोड़ा और रिवीजन चाहिए।";
            remarksEl.style.color = "orange";
        } else {
            remarksEl.innerText = "📚 यह चैप्टर बहुत महत्वपूर्ण है, इसे दोबारा पढ़ें।";
            remarksEl.style.color = "red";
        }
    }

    startQuiz();
</script>

</body>
</html>
