<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Physics Ch-5 Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL GRADIENT THEME (PHYSICS - PURPLE) --- */
        :root {
            --bg-gradient: linear-gradient(180deg, #F3E5F5 0%, #E1BEE7 100%);
            --header-gradient: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%);
            --card-bg: #ffffff;
            --text-main: #2e1a47;
            --text-sub: #6a4f8a;
            --option-bg: #F3F0FF;
            --correct-color: #00C853; /* Green */
            --wrong-color: #FF1744;   /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        .quiz-header {
            background: var(--header-gradient); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10;
        }
        .close-btn { font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.8; }
        .timer-badge {
            background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); }
        .progress-bar { height: 100%; background: #00E676; width: 0%; transition: width 0.3s; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(74, 0, 224, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 80px;
        }

        .q-count { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .question-text { font-size: 18px; font-weight: 700; margin-bottom: 25px; line-height: 1.4; color: #2d3436; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #444; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative;
        }

        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center;
        }

        .next-btn {
            background: var(--header-gradient); color: white; border: none;
            width: 100%; max-width: 600px; padding: 16px; border-radius: 18px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(74, 0, 224, 0.3); transition: 0.2s;
            display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 30px; animation: fadeIn 0.5s;
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: white; border: 8px solid #6200ea;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .score-num { font-size: 36px; font-weight: 800; color: #4A00E0; }
        .score-total { font-size: 14px; color: #aaa; font-weight: 600; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="physics_chapters.html" class="close-btn">✕</a>
        <span>Ch-5: Sources of Energy</span>
        <div class="timer-badge" id="question-tracker">1/45</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <span class="q-count" id="q-number">Question 1</span>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="score-circle">
            <span class="score-num" id="final-score">0</span>
            <span class="score-total">OUT OF 45</span>
        </div>
        <h2 style="color: #4A00E0; margin-bottom: 10px;">Quiz Completed!</h2>
        <p style="color: #666; margin-bottom: 20px;">You are now an Energy Expert!</p>
        <a href="physics_chapters.html" class="next-btn" style="display:block; text-align:center; text-decoration:none;">Back to Chapters</a>
        <br>
        <div style="cursor:pointer; color:#6200ea; font-weight:600;" onclick="location.reload()">↺ Restart Quiz</div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <script>
        // --- DATA: 45 QUESTIONS (Sources of Energy) ---
        const questions = [
            { q: "Which of the following is a non-renewable source of energy?", o: ["Wood", "Sun", "Fossil fuels", "Wind"], a: 2 },
            { q: "Which of the following is a renewable source of energy?", o: ["Coal", "Petroleum", "Solar energy", "Natural gas"], a: 2 },
            { q: "The ultimate source of energy for us is:", o: ["LPG", "Nuclear Energy", "Sun", "CNG"], a: 2 },
            { q: "Acid rain happens because:", o: ["Sun heats up upper atmosphere", "Burning of fossil fuels releases oxides of carbon, nitrogen and sulphur", "Electrical charges in the atmosphere", "Excessive release of oxygen"], a: 1 },
            { q: "In a hydroelectric power plant:", o: ["Potential energy is converted into electricity", "Kinetic energy is converted into potential energy", "Electricity is extracted from water", "Water is converted into steam"], a: 0 },
            { q: "Which of the following is not a biomass energy source?", o: ["Wood", "Gobar gas", "Nuclear energy", "Coal"], a: 2 },
            { q: "The main constituent of biogas is:", o: ["Methane", "Carbon dioxide", "Hydrogen", "Hydrogen sulphide"], a: 0 },
            { q: "Biogas is considered an excellent fuel because it contains up to __% methane.", o: ["50%", "60%", "75%", "90%"], a: 2 },
            { q: "The minimum wind speed required for a wind generator to work is:", o: ["10 km/h", "15 km/h", "25 km/h", "150 km/h"], a: 1 },
            { q: "Which country is called the 'Country of Winds'?", o: ["India", "China", "Denmark", "Netherlands"], a: 2 },
            { q: "A solar cell converts:", o: ["Heat energy into electrical energy", "Solar energy into electrical energy", "Heat energy into light energy", "Solar energy into light energy"], a: 1 },
            { q: "The material used for making solar cells is:", o: ["Silicon", "Carbon", "Sodium", "Cobalt"], a: 0 },
            { q: "Energy obtained from the heat inside the earth is called:", o: ["Solar energy", "Geothermal energy", "Hydro energy", "Thermal energy"], a: 1 },
            { q: "OTEC stands for:", o: ["Ocean Thermal Energy Conservation", "Ocean Thermal Energy Conversion", "Ocean Temperature Energy Conversion", "Ocean Thermal Electric Conversion"], a: 1 },
            { q: "To exploit OTEC, the temperature difference between surface water and water at depths must be:", o: ["10°C", "20°C", "30°C", "40°C"], a: 1 },
            { q: "The process used in nuclear power plants to generate electricity is:", o: ["Nuclear Fusion", "Nuclear Fission", "Chemical Reaction", "Atomic Collision"], a: 1 },
            { q: "The major hazard of nuclear power generation is:", o: ["Release of CO2", "Release of SO2", "Storage and disposal of radioactive waste", "High cost"], a: 2 },
            { q: "In the sun, energy is produced by:", o: ["Nuclear Fission", "Nuclear Fusion", "Chemical Burning", "Gravitational Collapse"], a: 1 },
            { q: "Which of the following is a greenhouse gas?", o: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], a: 2 },
            { q: "CNG stands for:", o: ["Common Natural Gas", "Compressed Natural Gas", "Converted Natural Gas", "Clean Natural Gas"], a: 1 },
            { q: "LPG mainly contains:", o: ["Methane", "Ethane", "Butane", "Propane"], a: 2 },
            { q: "The most popular kitchen fuel in India is:", o: ["LPG", "Kerosene", "Coal", "Electricity"], a: 0 },
            { q: "Solar cookers use which property of light?", o: ["Reflection", "Refraction", "Greenhouse effect", "Dispersion"], a: 2 },
            { q: "Charcoal is formed by burning wood in:", o: ["Excess of air", "Absence of limited supply of air", "Presence of water", "Vacuum"], a: 1 },
            { q: "Which of the following produces more heat on burning?", o: ["Wood", "Biogas", "Charcoal", "Cow dung cakes"], a: 2 },
            { q: "A good fuel should have:", o: ["High ignition temperature", "High calorific value", "High moisture content", "High ash content"], a: 1 },
            { q: "Which element is commonly used as a fuel in nuclear reactors?", o: ["Uranium", "Cadmium", "Lead", "Iron"], a: 0 },
            { q: "Hydrogen bomb is based on the principle of:", o: ["Nuclear Fission", "Nuclear Fusion", "Natural Radioactivity", "Artificial Radioactivity"], a: 1 },
            { q: "The energy derived from the tides of the ocean is called:", o: ["Tidal energy", "Wave energy", "Ocean thermal energy", "Geothermal energy"], a: 0 },
            { q: "Which part of the solar cooker is responsible for the greenhouse effect?", o: ["Mirror", "Glass sheet", "Black coating", "Outer box"], a: 1 },
            { q: "Black surfaces absorb ____ heat as compared to white surfaces.", o: ["Less", "More", "Same", "No"], a: 1 },
            { q: "Fossil fuels are formed from:", o: ["Dead remains of living organisms", "Volcanic eruptions", "Rocks", "Sand"], a: 0 },
            { q: "Which of the following is not a fossil fuel?", o: ["Coal", "Petroleum", "Natural Gas", "Biogas"], a: 3 },
            { q: "The efficiency of a solar cell is about:", o: ["10-15%", "25-30%", "50%", "100%"], a: 0 },
            { q: "Hot spots are related to:", o: ["Solar Energy", "Geothermal Energy", "Wind Energy", "Nuclear Energy"], a: 1 },
            { q: "The reaction responsible for the energy of the hydrogen bomb is:", o: ["Fission of Uranium", "Fusion of Deuterium", "Combustion of Hydrogen", "None"], a: 1 },
            { q: "Spent slurry from a biogas plant is used as:", o: ["Fuel", "Manure", "Brick making", "Road construction"], a: 1 },
            { q: "Global warming is caused by:", o: ["O2", "N2", "CO2", "H2"], a: 2 },
            { q: "Which mirror is best suited for a solar cooker?", o: ["Convex mirror", "Concave mirror", "Plane mirror", "Cylindrical mirror"], a: 1 },
            { q: "1 eV (electron volt) is a unit of:", o: ["Charge", "Potential Difference", "Energy", "Power"], a: 2 },
            { q: "Which of the following sources of energy is not derived from the sun?", o: ["Geothermal energy", "Wind energy", "Biomass", "Nuclear energy"], a: 3 },
            { q: "The binding energy of a nucleus is the energy released during:", o: ["Its formation from nucleons", "Its breaking into nucleons", "Alpha decay", "Beta decay"], a: 0 },
            { q: "In India, the largest source of electricity generation is:", o: ["Hydro power", "Thermal power", "Nuclear power", "Solar power"], a: 1 },
            { q: "Narmada Bachao Andolan is associated with:", o: ["Tehri Dam", "Sardar Sarovar Dam", "Bhakra Nangal Dam", "Hirakud Dam"], a: 1 },
            { q: "Einstein's mass-energy relation is:", o: ["E = mc", "E = mc^2", "E = m/c", "E = m^2c"], a: 1 }
        ];

        // --- GAME LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const tracker = document.getElementById('question-tracker');
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');

        loadQuestion();

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1}`;
            qText.innerText = q.q;
            tracker.innerText = `${currentQuestion + 1}/${questions.length}`;
            
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({behavior: "smooth"});
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
                quizUI.scrollTop = 0;
            } else {
                showResult();
            }
        }

        function showResult() {
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            resultUI.style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
