<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Chemistry Ch-3 Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL GRADIENT THEME (CHEMISTRY - TEAL) --- */
        :root {
            --bg-gradient: linear-gradient(180deg, #E0F7FA 0%, #B2DFDB 100%);
            --header-gradient: linear-gradient(135deg, #00695C 0%, #004D40 100%);
            --card-bg: #ffffff;
            --text-main: #004D40;
            --text-sub: #00796B;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Green */
            --wrong-color: #FF1744;   /* Red */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        .quiz-header {
            background: var(--header-gradient); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10;
        }
        .close-btn { font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.8; }
        .timer-badge {
            background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px;
            font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.05); }
        .progress-bar { height: 100%; background: #00C853; width: 0%; transition: width 0.3s; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 77, 64, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 80px;
        }

        .q-count { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .question-text { font-size: 18px; font-weight: 700; margin-bottom: 25px; line-height: 1.4; color: #2d3436; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #444; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative;
        }

        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center;
        }

        .next-btn {
            background: var(--header-gradient); color: white; border: none;
            width: 100%; max-width: 600px; padding: 16px; border-radius: 18px;
            font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 77, 64, 0.3); transition: 0.2s;
            display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; padding: 30px; animation: fadeIn 0.5s;
        }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            background: white; border: 8px solid #009688;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .score-num { font-size: 36px; font-weight: 800; color: #004D40; }
        .score-total { font-size: 14px; color: #aaa; font-weight: 600; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="chemistry_chapters.html" class="close-btn">✕</a>
        <span>Ch-3: Metals & Non-Metals</span>
        <div class="timer-badge" id="question-tracker">1/45</div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <span class="q-count" id="q-number">Question 1</span>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="score-circle">
            <span class="score-num" id="final-score">0</span>
            <span class="score-total">OUT OF 45</span>
        </div>
        <h2 style="color: #004D40; margin-bottom: 10px;">Quiz Completed!</h2>
        <p style="color: #666; margin-bottom: 20px;">You've mastered Metals & Non-Metals.</p>
        <a href="chemistry_chapters.html" class="next-btn" style="display:block; text-align:center; text-decoration:none;">Back to Chapters</a>
        <br>
        <div style="cursor:pointer; color:#009688; font-weight:600;" onclick="location.reload()">↺ Restart Quiz</div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <script>
        // --- DATA: 45 QUESTIONS (Metals & Non-Metals) ---
        const questions = [
            { q: "Which of the following metals exists as liquid at room temperature?", o: ["Sodium", "Mercury", "Magnesium", "Potassium"], a: 1 },
            { q: "Which non-metal is liquid at room temperature?", o: ["Carbon", "Bromine", "Sulphur", "Phosphorus"], a: 1 },
            { q: "Which non-metal is lustrous?", o: ["Sulphur", "Oxygen", "Nitrogen", "Iodine"], a: 3 },
            { q: "Which metal can be easily cut with a knife?", o: ["Sodium", "Iron", "Copper", "Gold"], a: 0 },
            { q: "Which metal is the best conductor of electricity?", o: ["Gold", "Silver", "Copper", "Aluminium"], a: 1 },
            { q: "Which of the following is an amphoteric oxide?", o: ["Na2O", "MgO", "Al2O3", "CaO"], a: 2 },
            { q: "Which metal does not react with water at all?", o: ["Sodium", "Magnesium", "Lead", "Iron"], a: 2 },
            { q: "Food cans are coated with Tin and not Zinc because:", o: ["Zinc is costlier than Tin", "Zinc has higher melting point", "Zinc is more reactive than Tin", "Zinc is less reactive than Tin"], a: 2 },
            { q: "Cinnabar is an ore of which metal?", o: ["Zinc", "Lead", "Mercury", "Copper"], a: 2 },
            { q: "Which method is suitable for preventing an iron frying pan from rusting?", o: ["Applying grease", "Applying paint", "Applying a coating of Zinc", "All of the above"], a: 2 },
            { q: "Galvanization is a method of protecting iron from rusting by coating it with a thin layer of:", o: ["Gallium", "Aluminium", "Zinc", "Silver"], a: 2 },
            { q: "An alloy is:", o: ["An element", "A compound", "A homogeneous mixture", "A heterogeneous mixture"], a: 2 },
            { q: "Stainless steel is very useful. The elements present in stainless steel are:", o: ["Fe, Ni and Cr", "Fe, Cr and Cu", "Fe, Ni and Cu", "Cu, Cr and Ni"], a: 0 },
            { q: "Which of the following pairs will give displacement reaction?", o: ["NaCl solution and copper metal", "MgCl2 solution and aluminium metal", "FeSO4 solution and silver metal", "AgNO3 solution and copper metal"], a: 3 },
            { q: "Which of the following metals is found in nature in free state?", o: ["Sodium", "Magnesium", "Iron", "Gold"], a: 3 },
            { q: "The process of heating an ore in the absence of air is called:", o: ["Roasting", "Calcination", "Reduction", "Refining"], a: 1 },
            { q: "Roasting is done for which type of ores?", o: ["Oxide ores", "Sulphide ores", "Carbonate ores", "Nitrate ores"], a: 1 },
            { q: "Which metal is used in thermite reaction to join railway tracks?", o: ["Iron", "Aluminium", "Copper", "Magnesium"], a: 1 },
            { q: "The most abundant metal in the earth's crust is:", o: ["Iron", "Aluminium", "Calcium", "Sodium"], a: 1 },
            { q: "Which of the following is an alloy of Copper and Zinc?", o: ["Brass", "Bronze", "Solder", "Steel"], a: 0 },
            { q: "Bronze is an alloy of:", o: ["Cu and Zn", "Cu and Sn", "Pb and Sn", "Fe and C"], a: 1 },
            { q: "Solder is an alloy of:", o: ["Cu and Zn", "Pb and Sn", "Cu and Sn", "Pb and Zn"], a: 1 },
            { q: "Amalgam is an alloy containing which metal?", o: ["Copper", "Silver", "Mercury", "Gold"], a: 2 },
            { q: "Ionic compounds have:", o: ["Low melting point", "High melting point", "Low boiling point", "No melting point"], a: 1 },
            { q: "In electrolytic refining, the cathode is made of:", o: ["Pure metal", "Impure metal", "Graphite", "Platinum"], a: 0 },
            { q: "In electrolytic refining, the anode is made of:", o: ["Pure metal", "Impure metal", "Graphite", "Platinum"], a: 1 },
            { q: "Metals generally form which type of oxides?", o: ["Acidic", "Basic", "Neutral", "None of these"], a: 1 },
            { q: "Non-metals generally form which type of oxides?", o: ["Acidic", "Basic", "Amphoteric", "None of these"], a: 0 },
            { q: "Which metal is preserved in Kerosene oil?", o: ["Magnesium", "Sodium", "Zinc", "Iron"], a: 1 },
            { q: "Reaction of Magnesium with air is:", o: ["Exothermic", "Endothermic", "Reversible", "Substitution"], a: 0 },
            { q: "Which metal floats on water when it reacts with it?", o: ["Sodium", "Calcium", "Magnesium", "Both Calcium and Magnesium"], a: 3 },
            { q: "Which non-metal is a good conductor of electricity?", o: ["Sulphur", "Graphite", "Iodine", "Diamond"], a: 1 },
            { q: "The hardest natural substance is:", o: ["Graphite", "Iron", "Diamond", "Tungsten"], a: 2 },
            { q: "Aqua regia is a mixture of conc. HCl and conc. HNO3 in the ratio:", o: ["1:3", "3:1", "1:1", "2:1"], a: 1 },
            { q: "Which metal does not react with cold or hot water but reacts with steam?", o: ["Sodium", "Calcium", "Iron", "Lead"], a: 2 },
            { q: "Copper reacts with dilute HCl:", o: ["Vigorously", "Slowly", "Very slowly", "Does not react"], a: 3 },
            { q: "Metals lose electrons to form:", o: ["Anions", "Cations", "Neutral atoms", "Isotopes"], a: 1 },
            { q: "Non-metals gain electrons to form:", o: ["Anions", "Cations", "Neutral atoms", "Isotopes"], a: 0 },
            { q: "Which property is NOT shown by metals?", o: ["Electrical conduction", "Sonorous", "Dullness", "Ductility"], a: 2 },
            { q: "Formation of NaCl involves transfer of electrons from:", o: ["Na to Cl", "Cl to Na", "Sharing of electrons", "None of these"], a: 0 },
            { q: "Carbonate ores are changed into oxides by heating strongly in limited air. This process is:", o: ["Roasting", "Calcination", "Refining", "Reduction"], a: 1 },
            { q: "Highly reactive metals like Na, K, Mg, etc. are extracted by:", o: ["Electrolysis of their molten chloride", "Reduction with Carbon", "Reduction with Aluminium", "Roasting"], a: 0 },
            { q: "The green coating on copper is chemically:", o: ["Copper Sulphate", "Copper Carbonate", "Copper Oxide", "Copper Chloride"], a: 1 },
            { q: "24 carat gold is:", o: ["Very hard", "Very soft", "Mixed with copper", "Mixed with silver"], a: 1 },
            { q: "Which metal is used for making jewellery because it is soft and does not corrode?", o: ["Copper", "Iron", "Gold", "Aluminium"], a: 2 }
        ];

        // --- GAME LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const tracker = document.getElementById('question-tracker');
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');

        loadQuestion();

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1}`;
            qText.innerText = q.q;
            tracker.innerText = `${currentQuestion + 1}/${questions.length}`;
            
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({behavior: "smooth"});
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
                quizUI.scrollTop = 0;
            } else {
                showResult();
            }
        }

        function showResult() {
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            resultUI.style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
