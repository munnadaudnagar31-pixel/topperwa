    <meta charset="UTF-8">

    <title>Ch-7: परम्परा का मूल्यांकन</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL HINDI THEME (Saffron) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            --header-gradient: linear-gradient(135deg, #e65100 0%, #ff6f00 100%);
            --card-bg: #ffffff;
            --text-main: #3e2723;
            --text-sub: #e65100;
            --option-bg: #fff8e1;
            --correct-color: #2e7d32; /* Green */
            --wrong-color: #c62828;   /* Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #ffe0b2; }
        .progress-bar { height: 100%; background: #ef6c00; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(230, 81, 0, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #ff6f00;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #fff3e0; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #fff; background: #e65100; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #e65100; letter-spacing: 1px; }

        .question-text { 
            font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #3e2723; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 16px; color: #4e342e; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffcc80;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #ff9800; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #ffe0b2; }
        
        /* Correct State */
        .option-btn.correct { background: #e8f5e9; border-color: var(--correct-color); color: #1b5e20; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #fff3e0;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(230, 81, 0, 0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #e65100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #e65100; line-height: 1; }
        .score-label { font-size: 11px; color: #ef6c00; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #5d4037; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #2e7d32; }
        .red-text { color: #c62828; }
        .blue-text { color: #1565c0; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #e65100; color: white; box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3); }
        .btn-secondary { background: #ffe0b2; color: #e65100; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>

            <button class="action-btn btn-primary" onclick="window.location.href='hindi_chapters.html'">Back to Chapters</button>

    <script>
        // --- DATA: 50 MCQs from 'Parampara Ka Mulyankan' ---
        const questions = [
            { q: "'परम्परा का मूल्यांकन' किसकी रचना है?", o: ["रामविलास शर्मा", "हजारी प्रसाद द्विवेदी", "अशोक वाजपेयी", "महात्मा गाँधी"], a: 0 },
            { q: "रामविलास शर्मा का जन्म कब हुआ था?", o: ["10 अक्टूबर 1912", "12 अक्टूबर 1914", "10 अक्टूबर 1910", "12 अक्टूबर 1916"], a: 0 },
            { q: "रामविलास शर्मा का जन्म कहाँ हुआ था?", o: ["ऊँचगाँव, सानी (उन्नाव, उ.प्र.)", "बलिया, उ.प्र.", "नागपुर, महाराष्ट्र", "पटना, बिहार"], a: 0 },
            { q: "रामविलास शर्मा की मृत्यु कब हुई?", o: ["30 मई 2000", "30 मई 1999", "30 मई 2001", "30 मई 2002"], a: 0 },
            { q: "परम्परा का मूल्यांकन पाठ गद्य की कौन सी विधा है?", o: ["निबंध", "कहानी", "जीवनी", "संस्मरण"], a: 0 },
            { q: "परम्परा का ज्ञान किनके लिए सबसे ज्यादा आवश्यक है?", o: ["जो रूढ़िवादी हैं", "जो साहित्य में युग परिवर्तन करना चाहते हैं", "जो अमीर बनना चाहते हैं", "जो व्यापारी हैं"], a: 1 },
            { q: "रामविलास शर्मा को किस कृति के लिए साहित्य अकादमी पुरस्कार मिला?", o: ["निराला की साहित्य साधना", "प्रेमचंद और उनका युग", "भाषा और समाज", "भारत की भाषा समस्या"], a: 0 },
            { q: "प्रगतिशील आलोचना का विकास होता है:", o: ["साहित्य की परम्परा के ज्ञान से", "धर्म के ज्ञान से", "इतिहास के ज्ञान से", "कला के ज्ञान से"], a: 0 },
            { q: "साहित्य की परम्परा का पूर्ण ज्ञान किस व्यवस्था में संभव है?", o: ["सामंतवादी व्यवस्था", "पूँजीवादी व्यवस्था", "समाजवादी व्यवस्था", "जातिवादी व्यवस्था"], a: 2 },
            { q: "लेखक ने किसे 'जारशाही' (Czar) कहा है?", o: ["रूसी शासन को", "ब्रिटिश शासन को", "अमेरिकी शासन को", "फ्रांसीसी शासन को"], a: 0 },
            { q: "साहित्य सापेक्ष रूप में क्या होता है?", o: ["स्वाधीन", "पराधीन", "परतंत्र", "गुलाम"], a: 0 },
            { q: "कौन सा देश ऐसा है जहाँ की परम्परा का ज्ञान सबसे अधिक आवश्यक है?", o: ["भारत", "रूस", "अमेरिका", "चीन"], a: 0 },
            { q: "साहित्य में विकास प्रक्रिया किस तरह संपन्न होती है?", o: ["समाज की तरह", "घड़ी की तरह", "जंगल की तरह", "मशीन की तरह"], a: 0 },
            { q: "निराला की साहित्य साधना कितने खंडों में है?", o: ["तीन खंडों में", "दो खंडों में", "चार खंडों में", "पाँच खंडों में"], a: 0 },
            { q: "प्रेमचंद और उनका युग किसकी रचना है?", o: ["रामविलास शर्मा", "हजारी प्रसाद द्विवेदी", "डॉ. नगेन्द्र", "नामवर सिंह"], a: 0 },
            { q: "रामविलास शर्मा किस विश्वविद्यालय में अंग्रेजी विभाग के अध्यक्ष रहे?", o: ["आगरा विश्वविद्यालय", "दिल्ली विश्वविद्यालय", "इलाहाबाद विश्वविद्यालय", "पटना विश्वविद्यालय"], a: 0 },
            { q: "सभ्यता का हर स्तर क्या नहीं होता?", o: ["वर्ग-युद्ध", "धर्म-युद्ध", "शांति", "विकास"], a: 0 },
            { q: "साहित्य की परम्परा का मूल्यांकन करते समय हम सबसे पहले किस साहित्य का मूल्य निर्धारित करते हैं?", o: ["जो श्रमिक जनता के हितों को प्रतिबिंबित करता है", "जो अमीरों का गुणगान करता है", "जो राजाओं की कहानी कहता है", "जो केवल मनोरंजन करता है"], a: 0 },
            { q: "लेखक के अनुसार, परम्परा के मूल्यांकन में अनिवार्य क्या है?", o: ["विवेक", "धन", "सत्ता", "हथियार"], a: 0 },
            { q: "1917 की रूसी क्रांति के बाद रूसी और गैर-रूसी जातियों के संबंधों में क्या हुआ?", o: ["बड़ा परिवर्तन हुआ", "कोई परिवर्तन नहीं हुआ", "दुश्मनी बढ़ गई", "युद्ध हुआ"], a: 0 },
            { q: "एथेंस किस महादेश में है?", o: ["यूरोप", "एशिया", "अफ्रीका", "ऑस्ट्रेलिया"], a: 0 },
            { q: "बायरन (Byron) किस भाषा के कवि थे?", o: ["अंग्रेजी", "फ्रेंच", "जर्मन", "रूसी"], a: 0 },
            { q: "शेक्सपियर कौन थे?", o: ["नाटककार", "वैज्ञानिक", "गणितज्ञ", "खगोलशास्त्री"], a: 0 },
            { q: "अविभाजित बंगाल में किसका संबंध रामायण-महाभारत से था?", o: ["रवीन्द्रनाथ ठाकुर", "बंकिमचंद्र चटर्जी", "शरतचंद्र", "इनमें से कोई नहीं"], a: 0 },
            { q: "लेखक ने भारत की राष्ट्रीय एकता का सबसे बड़ा आधार किसे माना है?", o: ["रामायण और महाभारत को", "संविधान को", "संसद को", "सेना को"], a: 0 },
            { q: "बहुजातीय राष्ट्र की हैसियत से कोई भी देश किसका मुकाबला नहीं कर सकता?", o: ["भारत का", "चीन का", "रूस का", "अमेरिका का"], a: 0 },
            { q: "समाजवादी व्यवस्था किस संस्कृति से नाता नहीं तोड़ती?", o: ["प्राचीन संस्कृति", "पाश्चात्य संस्कृति", "आधुनिक संस्कृति", "नगरीय संस्कृति"], a: 0 },
            { q: "जो लोग साहित्य में युग-परिवर्तन करना चाहते हैं, वे क्या करते हैं?", o: ["साहित्य की परम्परा का अध्ययन", "नकल करते हैं", "केवल आलोचना करते हैं", "चुप रहते हैं"], a: 0 },
            { q: "दूसरों की नकल कर लिखा गया साहित्य कैसा होता है?", o: ["अधम", "उत्तम", "मध्यम", "श्रेष्ठ"], a: 0 },
            { q: "किस वर्ष की क्रांति ने रूसी साम्राज्य को बदल दिया?", o: ["1917", "1915", "1920", "1947"], a: 0 },
            { q: "साहित्य मनुष्य के संपूर्ण जीवन से संबद्ध है - यह कथन किसका है?", o: ["रामविलास शर्मा", "प्रेमचंद", "निराला", "दिनकर"], a: 0 },
            { q: "लैटिन कवि कौन है?", o: ["वर्जिल", "शेक्सपियर", "बायरन", "कीट्स"], a: 0 },
            { q: "तारसप्तक में कितने कवियों की कविताएँ संगृहीत हैं?", o: ["सात", "पाँच", "आठ", "दस"], a: 0 },
            { q: "अज्ञेय ने किस सप्तक का संपादन किया?", o: ["तारसप्तक", "दूसरा सप्तक", "तीसरा सप्तक", "इनमें से सभी"], a: 3 },
            { q: "मनुष्य और परिस्थिति का संबंध कैसा है?", o: ["द्वन्द्वात्मक", "सरल", "मित्रवत", "शत्रुवत"], a: 0 },
            { q: "साहित्य विचारधारा मात्र नहीं है, उसमें क्या शामिल है?", o: ["मनुष्य का इंद्रिय बोध और भावनाएँ", "केवल राजनीति", "केवल दर्शन", "केवल इतिहास"], a: 0 },
            { q: "यदि मनुष्य परिस्थितियों का नियामक नहीं है, तो परिस्थितियाँ भी मनुष्य की _____ नहीं हैं।", o: ["नियामक", "गुलाम", "मित्र", "दुश्मन"], a: 0 },
            { q: "जारशाही शासन का संबंध किस देश से था?", o: ["रूस", "फ्रांस", "जर्मनी", "इंग्लैंड"], a: 0 },
            { q: "रूस की क्रांति कब हुई थी?", o: ["1917 ई०", "1916 ई०", "1918 ई०", "1919 ई०"], a: 0 },
            { q: "व्यास और वाल्मीकि किस देश की परम्परा के अंग हैं?", o: ["भारत", "यूनान", "रोम", "चीन"], a: 0 },
            { q: "किसने सोवियत संघ पर आक्रमण किया था?", o: ["हिटलर ने", "नेपोलियन ने", "चर्चिल ने", "लेनिन ने"], a: 0 },
            { q: "टॉलस्टॉय कौन थे?", o: ["रूसी लेखक", "फ्रेंच लेखक", "जर्मन लेखक", "इतालवी लेखक"], a: 0 },
            { q: "रामविलास शर्मा का निधन कहाँ हुआ?", o: ["दिल्ली", "लखनऊ", "कानपुर", "इलाहाबाद"], a: 0 },
            { q: "साहित्य की परम्परा का मूल्यांकन करते हुए सबसे पहले हम किस साहित्य को महत्व देते हैं?", o: ["जनता के साहित्य को", "दरबारी साहित्य को", "धार्मिक साहित्य को", "विदेशी साहित्य को"], a: 0 },
            { q: "अविच्छिन्न का क्या अर्थ है?", o: ["अटूट/निरंतर", "टूटा हुआ", "रुक-रुक कर", "समाप्त"], a: 0 },
            { q: "भारत की भाषा समस्या किसकी रचना है?", o: ["रामविलास शर्मा", "हजारी प्रसाद द्विवेदी", "गुणाकर मुले", "अमरकांत"], a: 0 },
            { q: "भौतिकवाद का अर्थ क्या नहीं है?", o: ["भाग्यवाद", "विज्ञान", "तर्क", "यथार्थ"], a: 0 },
            { q: "परम्परा का मूल्यांकन पाठ से हमें क्या शिक्षा मिलती है?", o: ["अपनी संस्कृति और साहित्य का सम्मान करना", "नकल करना", "अंधविश्वास", "जातिवाद"], a: 0 },
            { q: "शेली और कीट्स कौन थे?", o: ["कवि", "गायक", "चित्रकार", "खिलाड़ी"], a: 0 },
            { q: "साहित्य में किसका योगदान महत्वपूर्ण होता है?", o: ["प्रतिभाशाली मनुष्यों का", "धन का", "सत्ता का", "कागज का"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 900; // 15 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#c62828';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "परम्परा के ज्ञानी! आप साहित्य मर्मज्ञ हैं! 📚";
            else if(accuracy >= 70) feedback.innerText = "बहुत बढ़िया! आपने पाठ की गहराई को समझा है। 👍";
            else if(accuracy >= 50) feedback.innerText = "अच्छा प्रयास। मार्क्सवाद और परंपरा को फिर से पढ़ें। 🧐";
            else feedback.innerText = "परम्परा का ज्ञान जरूरी है! फिर से प्रयास करें। 🔥";
        }
    </script>
</body>
