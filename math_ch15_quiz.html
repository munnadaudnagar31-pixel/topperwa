<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Math Ch-15: Probability</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Probability</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Probability) ---
        const questions = [
            { q: "The probability of an event E + Probability of the event 'not E' is:", o: ["0", "1", "-1", "Infinite"], a: 1 },
            { q: "Which of the following cannot be the probability of an event?", o: ["2/3", "-1.5", "15%", "0.7"], a: 1 },
            { q: "The probability of an impossible event is:", o: ["0", "1", "1/2", "Undefined"], a: 0 },
            { q: "The probability of a sure event is:", o: ["0", "1", "100", "0.5"], a: 1 },
            { q: "If P(E) = 0.05, what is the probability of 'not E'?", o: ["0.05", "0.95", "0", "1.05"], a: 1 },
            { q: "A coin is tossed once. What is the probability of getting a head?", o: ["1/2", "1/3", "1/4", "1"], a: 0 },
            { q: "A die is thrown once. The probability of getting a prime number is:", o: ["1/3", "1/2", "2/3", "1/6"], a: 1 },
            { q: "A die is thrown once. The probability of getting a number greater than 6 is:", o: ["1", "0", "1/6", "1/2"], a: 1 },
            { q: "A card is drawn from a well-shuffled deck of 52 cards. The probability of getting a king of red colour is:", o: ["1/26", "1/13", "1/52", "1/4"], a: 0 },
            { q: "A card is drawn from 52 cards. The probability of getting a face card is:", o: ["3/13", "4/13", "1/13", "3/26"], a: 0 },
            { q: "The probability of getting a doublet in a throw of a pair of dice is:", o: ["1/3", "1/6", "5/12", "1/2"], a: 1 },
            { q: "What is the probability of getting a sum of 9 from two dice?", o: ["1/6", "1/8", "1/9", "1/12"], a: 2 },
            { q: "A bag contains 3 red balls and 5 black balls. A ball is drawn at random. The probability that the ball drawn is red is:", o: ["3/5", "3/8", "5/8", "1/8"], a: 1 },
            { q: "The sum of probabilities of all the elementary events of an experiment is:", o: ["0", "1", "2", "0.5"], a: 1 },
            { q: "Which of the following can be the probability of an event?", o: ["-0.04", "1.004", "18/23", "10/7"], a: 2 },
            { q: "Two coins are tossed simultaneously. The probability of getting at most one head is:", o: ["1/4", "1/2", "3/4", "1"], a: 2 },
            { q: "The probability of a leap year selected at random containing 53 Sundays is:", o: ["1/7", "2/7", "53/366", "1/4"], a: 1 },
            { q: "The probability of a non-leap year having 53 Mondays is:", o: ["1/7", "2/7", "1/365", "6/7"], a: 0 },
            { q: "If a number x is chosen from the numbers 1, 2, 3 and a number y is chosen from 1, 4, 9. Then P(xy < 9) is:", o: ["5/9", "4/9", "1/3", "2/3"], a: 0 },
            { q: "A box contains cards numbered 6 to 50. A card is drawn at random. The probability that the drawn card has a number which is a perfect square is:", o: ["1/45", "2/15", "1/9", "4/45"], a: 3 },
            { q: "Two dice are thrown together. The probability that sum of the two numbers appearing on the top is less than 13 is:", o: ["0", "1", "1/2", "1/13"], a: 1 },
            { q: "A card is drawn from a pack of 52 cards. The probability of getting a queen of club is:", o: ["1/13", "1/52", "1/26", "1/4"], a: 1 },
            { q: "One card is drawn from a well-shuffled deck of 52 cards. The probability of getting a spade is:", o: ["1/13", "1/4", "1/2", "1/26"], a: 1 },
            { q: "If a die is thrown, the probability of getting an odd number less than 3 is:", o: ["1/6", "1/3", "1/2", "0"], a: 0 },
            { q: "A bag contains 5 red balls and some blue balls. If the probability of drawing a blue ball is double that of a red ball, then the number of blue balls is:", o: ["5", "10", "15", "20"], a: 1 },
            { q: "The probability of getting a bad egg in a lot of 400 is 0.035. The number of bad eggs in the lot is:", o: ["7", "14", "21", "28"], a: 1 },
            { q: "A girl calculates that the probability of her winning the first prize in a lottery is 0.08. If 6000 tickets are sold, how many tickets has she bought?", o: ["40", "240", "480", "750"], a: 2 },
            { q: "Someone is asked to take a number from 1 to 100. The probability that it is a prime is:", o: ["1/5", "6/25", "1/4", "13/50"], a: 2 },
            { q: "In a family of 3 children, the probability of having at least one boy is:", o: ["7/8", "1/8", "5/8", "3/4"], a: 0 },
            { q: "Three coins are tossed together. The probability of getting exactly two heads is:", o: ["1/8", "3/8", "1/2", "5/8"], a: 1 },
            { q: "A letter is chosen at random from the word 'MATHEMATICS'. The probability that it is a vowel is:", o: ["4/11", "3/11", "5/11", "2/11"], a: 0 },
            { q: "Two dice are thrown simultaneously. The probability of getting a sum of 8 is:", o: ["5/36", "1/6", "1/9", "1/12"], a: 0 },
            { q: "A game consists of tossing a one rupee coin 3 times and noting its outcome each time. Hanif wins if all the tosses give the same result. The probability that Hanif will lose the game is:", o: ["1/4", "1/2", "3/4", "5/8"], a: 2 },
            { q: "If P(A) denotes the probability of an event A, then:", o: ["P(A) < 0", "P(A) > 1", "0 ≤ P(A) ≤ 1", "-1 ≤ P(A) ≤ 1"], a: 2 },
            { q: "A card is drawn from a pack of 52 cards. The event E is that card is not an ace of hearts. The number of outcomes favourable to E is:", o: ["4", "13", "48", "51"], a: 3 },
            { q: "The probability of getting a number between 1 and 100 which is divisible by 1 and itself only is:", o: ["25/98", "25/100", "24/98", "26/98"], a: 0 },
            { q: "When a die is thrown, the probability of getting an odd number less than 4 is:", o: ["1/6", "1/3", "1/2", "0"], a: 0 },
            { q: "A card is drawn from a deck of 52 cards. The probability that it is a red face card is:", o: ["3/26", "2/13", "1/26", "1/13"], a: 0 },
            { q: "Determining probability by actual observation is called:", o: ["Theoretical", "Empirical", "Subjective", "Axiomatic"], a: 1 },
            { q: "If three coins are tossed, the probability of getting no head is:", o: ["1/8", "3/8", "7/8", "1/4"], a: 0 },
            { q: "Two dice are thrown. The probability that the product of numbers is 12 is:", o: ["1/9", "2/9", "4/9", "5/36"], a: 0 },
            { q: "A number x is selected from the numbers 1, 2, 3 and then a second number y is randomly selected from the numbers 1, 4, 9. What is the probability that the product xy of the two numbers will be less than 9?", o: ["5/9", "4/9", "1/3", "2/3"], a: 0 },
            { q: "If the probability of winning a game is 0.3, then probability of losing it is:", o: ["0.6", "0.7", "0.5", "0.3"], a: 1 },
            { q: "Cards marked with numbers 2 to 101 are placed in a box. A card is drawn. The probability that it bears a perfect cube is:", o: ["3/100", "4/100", "3/99", "4/99"], a: 0 },
            { q: "Probability of drawing a 10 of a black suit from a deck of cards is:", o: ["1/26", "1/13", "1/52", "2/13"], a: 0 },
            { q: "The letters of the word SOCIETY are placed at random. The probability of getting a vowel is:", o: ["1/7", "2/7", "3/7", "4/7"], a: 2 },
            { q: "A lot consists of 144 ball pens of which 20 are defective. Probability that a customer will buy a good pen is:", o: ["20/144", "124/144", "144/124", "1"], a: 1 },
            { q: "Which of these is correct?", o: ["P(E) = 1/2", "P(E) + P(not E) = 1", "P(E) = P(not E)", "P(not E) = 1 + P(E)"], a: 1 },
            { q: "The total number of events of throwing 10 coins simultaneously is:", o: ["1024", "512", "100", "10"], a: 0 },
            { q: "A box has 6 black, 8 white, 10 yellow marbles. One marble is drawn. Probability it is not black is:", o: ["3/4", "1/4", "1/2", "2/3"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Probability Pro! You can predict the future! 🔮";
            else if(accuracy >= 70) feedback.innerText = "Good job! You understand chance well. 🎲";
            else if(accuracy >= 50) feedback.innerText = "Not bad, but watch out for leap years. 🗓️";
            else feedback.innerText = "Chance is tricky. Practice more! 🔄";
        }
    </script>
</body>
</html>
