<!DOCTYPE html>
<html lang="hi">
<head>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1109901963732620"
     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Chapter 4 - Live Test</title>
    <style>
        /* --- MODERN UI STYLE (Theme: Corporate Banking Blue) --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        .quiz-container { background: #fff; width: 100%; max-width: 550px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
        .quiz-header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
        
        .timer-box { background: #e8eaf6; color: #1a237e; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .question-count { font-size: 14px; color: #666; font-weight: 500; }
        
        .progress-bar { height: 6px; width: 100%; background: #f1f1f1; }
        .progress-fill { height: 100%; background: #1e3c72; width: 0%; transition: width 0.3s ease; }
        
        .quiz-body { padding: 25px 20px; }
        h2#question-text { font-size: 18px; color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; padding: 14px; border-radius: 10px; font-size: 15px; color: #444; cursor: pointer; text-align: left; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #c5cae9; }
        
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        .quiz-footer { padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #next-btn { background: #1e3c72; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; display: none; }
        #next-btn:hover { background: #122245; }
        .home-link { text-decoration: none; color: #666; font-size: 14px; font-weight: 500; }
        
        .result-box { text-align: center; padding: 40px 20px; display: none; }
        .score-circle { width: 120px; height: 120px; background: #1e3c72; color: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4); }
        .score-big { font-size: 32px; font-weight: bold; }
        .score-label { font-size: 12px; opacity: 0.9; }
        .accuracy-text { font-size: 18px; color: #333; margin-bottom: 20px; font-weight: 600; }
        .remarks { color: #666; font-size: 14px; margin-bottom: 30px; }
        .action-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-restart, .btn-home { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 500; text-decoration: none; }
        .btn-restart { background: #1e3c72; color: white; }
        .btn-home { background: #eee; color: #333; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="quiz-header">
            <div class="question-count">Question: <span id="q-index">1</span>/<span id="total-q">5</span></div>
            <div class="timer-box">⏳ <span id="time-left">10:00</span></div>
        </div>
        <div class="quiz-body">
            <h2 id="question-text">प्रश्न लोड हो रहा है...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
        <div class="quiz-footer">
            <a href="economics_chapters.html" class="home-link">Quit Quiz</a>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <div class="score-circle">
            <span class="score-big" id="final-score">0</span>
            <span class="score-label">Score</span>
        </div>
        <div class="accuracy-text" id="accuracy-text">Accuracy: 0%</div>
        <p class="remarks" id="remarks">Well Done!</p>
        <div class="action-btns">
            <button class="btn-restart" onclick="location.reload()">🔄 Retry</button>
            <a href="economics_chapters.html" class="btn-home">📂 Chapter List</a>
        </div>
    </div>
</div>

<script>
    const TOTAL_TIME_MINUTES = 10;
    let timeInSeconds = TOTAL_TIME_MINUTES * 60;
    let timerInterval;

    // ▼▼▼ ECONOMICS CHAPTER 4 QUESTIONS (हमारी वित्तीय संस्थाएँ) ▼▼▼
    const questions = [
        { question: "1. गैर-संस्थागत वित्त प्रदान करने वाला सबसे लोकप्रिय साधन है?", answers: [ { text: "देशी बैंकर", correct: false }, { text: "महाजन", correct: true }, { text: "व्यापारी", correct: false }, { text: "सहकारी बैंक", correct: false } ] },
        { question: "2. इनमें से कौन संस्थागत वित्त का साधन है?", answers: [ { text: "सेठ साहूकार", correct: false }, { text: "रिश्तेदार", correct: false }, { text: "व्यावसायिक बैंक", correct: true }, { text: "महाजन", correct: false } ] },
        { question: "3. भारत का केन्द्रीय बैंक कौन है?", answers: [ { text: "रिज़र्व बैंक ऑफ इंडिया", correct: true }, { text: "क्षेत्रीय ग्रामीण बैंक", correct: false }, { text: "स्टेट बैंक ऑफ इंडिया", correct: false }, { text: "पंजाब नेशनल बैंक", correct: false } ] },
        { question: "4. राज्य में कार्यरत केंद्रीय सहकारी बैंक की संख्या कितनी है?", answers: [ { text: "50", correct: false }, { text: "75", correct: false }, { text: "35", correct: false }, { text: "25", correct: true } ] },
        { question: "5. दीर्घकालीन ऋण प्रदान करने वाली संस्था कौन-सी है?", answers: [ { text: "कृषक महाजन", correct: false }, { text: "भूमि विकास बैंक", correct: true }, { text: "प्राथमिक कृषि साख समिति", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "6. भारत की वित्तीय राजधानी (Financial Capital) किस शहर को कहा गया है?", answers: [ { text: "मुंबई", correct: true }, { text: "दिल्ली", correct: false }, { text: "पटना", correct: false }, { text: "बेंगलुरु", correct: false } ] },
        { question: "7. सहकारिता प्रांतीय सरकारों का हस्तांतरित विषय कब बनी?", answers: [ { text: "1929", correct: false }, { text: "1919", correct: true }, { text: "1918", correct: false }, { text: "1914", correct: false } ] },
        { question: "8. देश में अभी कार्यरत क्षेत्रीय ग्रामीण बैंक की संख्या कितनी है (किताब के अनुसार)?", answers: [ { text: "190", correct: false }, { text: "192", correct: false }, { text: "199", correct: false }, { text: "196", correct: true } ] },
        { question: "9. व्यावसायिक बैंक का राष्ट्रीयकरण कब किया गया?", answers: [ { text: "1966", correct: false }, { text: "1980", correct: false }, { text: "1969", correct: true }, { text: "1975", correct: false } ] },
        { question: "10. राष्ट्रीय कृषि एवं ग्रामीण विकास बैंक (NABARD) की स्थापना कब हुई?", answers: [ { text: "1982", correct: true }, { text: "1952", correct: false }, { text: "1962", correct: false }, { text: "1972", correct: false } ] },
        { question: "11. भारतीय रिज़र्व बैंक की स्थापना किस वर्ष हुई?", answers: [ { text: "1934", correct: false }, { text: "1935", correct: true }, { text: "1948", correct: false }, { text: "1951", correct: false } ] },
        { question: "12. स्वयं सहायता समूह (SHG) में लगभग कितने सदस्य होते हैं?", answers: [ { text: "15-20", correct: true }, { text: "20-25", correct: false }, { text: "50-100", correct: false }, { text: "5-10", correct: false } ] },
        { question: "13. मैकलैगन समिति कब बनाई गई?", answers: [ { text: "1911", correct: false }, { text: "1914", correct: true }, { text: "1915", correct: false }, { text: "1916", correct: false } ] },
        { question: "14. भारत में सहकारिता आंदोलन का प्रारंभ कब हुआ?", answers: [ { text: "1904", correct: true }, { text: "1905", correct: false }, { text: "1907", correct: false }, { text: "1920", correct: false } ] },
        { question: "15. बिहार में संस्थागत वित्तीय संस्थाएं कितने प्रकार की हैं?", answers: [ { text: "एक", correct: false }, { text: "दो", correct: false }, { text: "तीन", correct: false }, { text: "चार", correct: true } ] },
        { question: "16. शेयर बाजार की नियामक संस्था है?", answers: [ { text: "SIDBI", correct: false }, { text: "SEBI", correct: true }, { text: "RBI", correct: false }, { text: "Stock Exchange", correct: false } ] },
        { question: "17. वित्तीय सेवाओं की आवश्यकता किसे होती है?", answers: [ { text: "सरकार को", correct: false }, { text: "उद्यमों को", correct: false }, { text: "व्यक्तियों को", correct: false }, { text: "इनमें सभी", correct: true } ] },
        { question: "18. 'सूक्ष्म वित्त योजना' (Microfinance) के प्रणेता कौन हैं?", answers: [ { text: "मो० युनुस", correct: true }, { text: "अमर्त्य सेन", correct: false }, { text: "मार्शल", correct: false }, { text: "केन्स", correct: false } ] },
        { question: "19. वित्तीय संस्थाओं के मुख्य प्रकार होते हैं?", answers: [ { text: "दो", correct: true }, { text: "तीन", correct: false }, { text: "चार", correct: false }, { text: "पाँच", correct: false } ] },
        { question: "20. राज्य स्तरीय संस्थागत वित्तीय संस्था है?", answers: [ { text: "महाजन", correct: false }, { text: "सहकारी बैंक", correct: true }, { text: "व्यापारी", correct: false }, { text: "सेठ साहूकार", correct: false } ] },
        { question: "21. व्यावसायिक बैंकों द्वारा स्वीकार किए गए जमा के प्रकार हैं?", answers: [ { text: "स्थायी जमा", correct: false }, { text: "चालू जमा", correct: false }, { text: "आवर्ती जमा", correct: false }, { text: "उपर्युक्त सभी", correct: true } ] },
        { question: "22. भारतीय पूंजी बाजार का अंग है?", answers: [ { text: "प्रतिभूति बाजार", correct: false }, { text: "औद्योगिक बाजार", correct: false }, { text: "विकास वित्त संस्थान", correct: false }, { text: "इनमें सभी", correct: true } ] },
        { question: "23. प्राथमिक कृषि साख समिति किस स्तर पर कार्य करती है?", answers: [ { text: "गाँव", correct: true }, { text: "प्रखंड", correct: false }, { text: "जिला", correct: false }, { text: "राज्य", correct: false } ] },
        { question: "24. बैंक लिंकेज कार्यक्रम का संबंध किससे है?", answers: [ { text: "स्वयं सहायता समूह (SHG)", correct: true }, { text: "शेयर बाजार", correct: false }, { text: "बीमा क्षेत्र", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "25. भूमि विकास बैंक का पुराना नाम क्या था?", answers: [ { text: "बंधक बैंक", correct: true }, { text: "सहकारी बैंक", correct: false }, { text: "ग्रामीण बैंक", correct: false }, { text: "व्यापारिक बैंक", correct: false } ] }
    ];

    let currentIdx = 0;
    let score = 0;
    
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const qIndexSpan = document.getElementById("q-index");
    const totalQSpan = document.getElementById("total-q");
    const timerDisplay = document.getElementById("time-left");
    const progressFill = document.getElementById("progress-fill");
    const finalScoreEl = document.getElementById("final-score");
    const accuracyTextEl = document.getElementById("accuracy-text");
    const remarksEl = document.getElementById("remarks");

    function startQuiz() {
        totalQSpan.innerText = questions.length;
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeInSeconds--;
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.innerText = `${minutes}:${seconds}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function showQuestion() {
        resetState();
        let currentQ = questions[currentIdx];
        qIndexSpan.innerText = currentIdx + 1;
        qText.innerText = `Q${currentIdx + 1}. ${currentQ.question}`;
        let progress = ((currentIdx) / questions.length) * 100;
        progressFill.style.width = progress + "%";
        
        currentQ.answers.forEach(ans => {
            const btn = document.createElement("button");
            btn.innerText = ans.text;
            btn.classList.add("option-btn");
            if(ans.correct) btn.dataset.correct = ans.correct;
            btn.addEventListener("click", selectAnswer);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while(optContainer.firstChild) optContainer.removeChild(optContainer.firstChild);
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if(isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }
        Array.from(optContainer.children).forEach(btn => {
            if(btn.dataset.correct === "true") btn.classList.add("correct");
            btn.disabled = true;
        });
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        let accuracy = Math.round((score / questions.length) * 100);
        finalScoreEl.innerText = `${score} / ${questions.length}`;
        accuracyTextEl.innerText = `Accuracy: ${accuracy}%`;
        
        if(accuracy >= 80) {
            remarksEl.innerText = "🏦 बहुत बढ़िया! वित्तीय संस्थाओं की जानकारी अच्छी है!";
            remarksEl.style.color = "green";
        } else if(accuracy >= 50) {
            remarksEl.innerText = "👍 ठीक है, पर तारीखें (Dates) और संस्थाओं के नाम याद करें।";
            remarksEl.style.color = "orange";
        } else {
            remarksEl.innerText = "📚 रिवीजन करें।";
            remarksEl.style.color = "red";
        }
    }

    startQuiz();
</script>

</body>
</html>
