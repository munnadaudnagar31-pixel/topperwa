<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Math Ch-8: Trigonometry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Trigonometry</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Trigonometry) ---
        const questions = [
            { q: "In a right triangle ABC, right-angled at B, if AB = 24 cm, BC = 7 cm, then sin A is:", o: ["7/25", "24/25", "7/24", "24/7"], a: 0 },
            { q: "The value of tan 45° is:", o: ["0", "1", "√3", "1/√3"], a: 1 },
            { q: "The value of sin 60° is:", o: ["1/2", "1/√2", "√3/2", "1"], a: 2 },
            { q: "The value of cos 0° is:", o: ["0", "1", "Not defined", "1/2"], a: 1 },
            { q: "The reciprocal of sin A is:", o: ["cos A", "sec A", "cosec A", "cot A"], a: 2 },
            { q: "If sin A = 3/5, then the value of cos A is:", o: ["4/5", "3/4", "5/3", "5/4"], a: 0 },
            { q: "sin² θ + cos² θ is equal to:", o: ["0", "1", "-1", "2"], a: 1 },
            { q: "The value of (sin 30° + cos 30°) - (sin 60° + cos 60°) is:", o: ["-1", "0", "1", "2"], a: 1 },
            { q: "tan A is equal to:", o: ["sin A / cos A", "cos A / sin A", "1 / sin A", "1 / cos A"], a: 0 },
            { q: "The value of sin 90° is:", o: ["0", "1", "Not defined", "1/2"], a: 1 },
            { q: "sec² A - tan² A is equal to:", o: ["0", "1", "-1", "2"], a: 1 },
            { q: "The value of cos 60° is:", o: ["1/2", "1/√2", "√3/2", "0"], a: 0 },
            { q: "1 + cot² A is equal to:", o: ["sec² A", "cosec² A", "tan² A", "sin² A"], a: 1 },
            { q: "If tan A = 4/3, then sin A is:", o: ["3/5", "4/5", "3/4", "5/3"], a: 1 },
            { q: "The value of sin 45° is:", o: ["1/2", "1/√2", "√3/2", "1"], a: 1 },
            { q: "Evaluate: 2tan² 45° + cos² 30° - sin² 60°", o: ["0", "1", "2", "1/2"], a: 2 },
            { q: "cos(90° - A) is equal to:", o: ["cos A", "sin A", "tan A", "cot A"], a: 1 },
            { q: "The value of tan 90° is:", o: ["0", "1", "√3", "Not defined"], a: 3 },
            { q: "If 15 cot A = 8, then find sin A.", o: ["15/17", "17/15", "8/17", "17/8"], a: 0 },
            { q: "Find the value of (sin 18°) / (cos 72°).", o: ["0", "1", "-1", "1/2"], a: 1 },
            { q: "If tan(A+B) = √3 and tan(A-B) = 1/√3, find A and B.", o: ["A=30, B=15", "A=45, B=15", "A=60, B=30", "A=15, B=45"], a: 1 },
            { q: "The value of sin 60° cos 30° + sin 30° cos 60° is:", o: ["0", "1", "1/2", "2"], a: 1 },
            { q: "In a right triangle, the longest side is called:", o: ["Perpendicular", "Base", "Hypotenuse", "None"], a: 2 },
            { q: "The value of cot 45° is:", o: ["0", "1", "√3", "1/√3"], a: 1 },
            { q: "If sin θ = cos θ, then the value of θ is:", o: ["0°", "30°", "45°", "60°"], a: 2 },
            { q: "The value of cos 48° - sin 42° is:", o: ["0", "1", "-1", "2"], a: 0 },
            { q: "If A, B, C are interior angles of a triangle ABC, then sin((B+C)/2) is equal to:", o: ["sin A/2", "cos A/2", "-sin A/2", "-cos A/2"], a: 1 },
            { q: "9 sec² A - 9 tan² A is equal to:", o: ["1", "9", "8", "0"], a: 1 },
            { q: "Evaluate: (1 + tan² A) / (1 + cot² A)", o: ["sec² A", "-1", "cot² A", "tan² A"], a: 3 },
            { q: "Maximum value of sin θ is:", o: ["1", "0", "1/2", "∞"], a: 0 },
            { q: "Maximum value of 1/sec θ is:", o: ["1", "0", "1/2", "∞"], a: 0 },
            { q: "If x = a cos θ and y = b sin θ, then b²x² + a²y² =", o: ["a²b²", "ab", "a⁴b⁴", "a²+b²"], a: 0 },
            { q: "The value of sin² 29° + sin² 61° is:", o: ["0", "1", "2sin² 29°", "2sin² 61°"], a: 1 },
            { q: "If tan θ = √3, then sec θ is:", o: ["2/√3", "√3/2", "1/2", "2"], a: 3 },
            { q: "The value of (tan 1° tan 2° tan 3° ... tan 89°) is:", o: ["0", "1", "2", "1/2"], a: 1 },
            { q: "Which of the following is true?", o: ["sin(A+B) = sin A + sin B", "The value of sin θ increases as θ increases", "The value of cos θ increases as θ increases", "sin θ = cos θ for all values of θ"], a: 1 },
            { q: "If cos A = 4/5, then tan A is:", o: ["3/5", "3/4", "4/3", "5/3"], a: 1 },
            { q: "The value of sin 30° is equal to the value of:", o: ["cos 60°", "cos 30°", "sin 60°", "tan 45°"], a: 0 },
            { q: "In a right triangle, hypotenuse is the side opposite to:", o: ["Acute angle", "Right angle", "Obtuse angle", "Reflex angle"], a: 1 },
            { q: "The value of cosec 30° is:", o: ["1/2", "2", "√3/2", "1"], a: 1 },
            { q: "If sin A = 1/2 and cos B = 1/2, then A + B =", o: ["0°", "30°", "60°", "90°"], a: 3 },
            { q: "If sec 4A = cosec(A - 20°), where 4A is an acute angle, then the value of A is:", o: ["20°", "22°", "24°", "25°"], a: 1 },
            { q: "If sin A + sin² A = 1, then the value of cos² A + cos⁴ A is:", o: ["1", "2", "3", "0"], a: 0 },
            { q: "If x = 2sin² θ and y = 2cos² θ + 1, then x + y is:", o: ["3", "2", "1", "1/2"], a: 0 },
            { q: "Given that sin α = 1/2 and cos β = 1/2, then the value of (α + β) is:", o: ["0°", "30°", "60°", "90°"], a: 3 },
            { q: "The value of the expression (sin² 22° + sin² 68°) / (cos² 22° + cos² 68°) is:", o: ["3", "2", "1", "0"], a: 2 },
            { q: "If 4 tan θ = 3, then (4sin θ - cos θ) / (4sin θ + cos θ) is equal to:", o: ["2/3", "1/3", "1/2", "3/4"], a: 2 },
            { q: "If cos 9α = sin α and 9α < 90°, then the value of tan 5α is:", o: ["1/√3", "√3", "1", "0"], a: 2 },
            { q: "If a cos θ + b sin θ = m and a sin θ - b cos θ = n, then a² + b² =", o: ["m² - n²", "m²n²", "n² - m²", "m² + n²"], a: 3 },
            { q: "The value of (sec A + tan A)(1 - sin A) is:", o: ["sec A", "sin A", "cosec A", "cos A"], a: 3 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Trigonometry Legend! You know your Sin, Cos, Tan! 📐";
            else if(accuracy >= 70) feedback.innerText = "Great job! Keep revising the table values. 📊";
            else if(accuracy >= 50) feedback.innerText = "Good start. Memorize the identities. 🧠";
            else feedback.innerText = "Trig is tough, but you are tougher! Try again. 🔥";
        }
    </script>
</body>
</html>
