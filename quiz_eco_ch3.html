<!DOCTYPE html>
<html lang="hi">
<head>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1109901963732620"
     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Chapter 3 - Live Test</title>
    <style>
        /* --- MODERN UI STYLE (Theme: Currency Green) --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
        }

        .quiz-container { background: #fff; width: 100%; max-width: 550px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
        .quiz-header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 10; }
        
        .timer-box { background: #e0f2f1; color: #00695c; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .question-count { font-size: 14px; color: #666; font-weight: 500; }
        
        .progress-bar { height: 6px; width: 100%; background: #f1f1f1; }
        .progress-fill { height: 100%; background: #43cea2; width: 0%; transition: width 0.3s ease; }
        
        .quiz-body { padding: 25px 20px; }
        h2#question-text { font-size: 18px; color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; padding: 14px; border-radius: 10px; font-size: 15px; color: #444; cursor: pointer; text-align: left; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #b2dfdb; }
        
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        .quiz-footer { padding: 15px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #next-btn { background: #185a9d; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; display: none; }
        #next-btn:hover { background: #103c68; }
        .home-link { text-decoration: none; color: #666; font-size: 14px; font-weight: 500; }
        
        .result-box { text-align: center; padding: 40px 20px; display: none; }
        .score-circle { width: 120px; height: 120px; background: #43cea2; color: white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 5px 15px rgba(67, 206, 162, 0.4); }
        .score-big { font-size: 32px; font-weight: bold; }
        .score-label { font-size: 12px; opacity: 0.9; }
        .accuracy-text { font-size: 18px; color: #333; margin-bottom: 20px; font-weight: 600; }
        .remarks { color: #666; font-size: 14px; margin-bottom: 30px; }
        .action-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-restart, .btn-home { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 500; text-decoration: none; }
        .btn-restart { background: #43cea2; color: white; }
        .btn-home { background: #eee; color: #333; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="quiz-header">
            <div class="question-count">Question: <span id="q-index">1</span>/<span id="total-q">5</span></div>
            <div class="timer-box">⏳ <span id="time-left">10:00</span></div>
        </div>
        <div class="quiz-body">
            <h2 id="question-text">प्रश्न लोड हो रहा है...</h2>
            <div class="options-list" id="options-container"></div>
        </div>
        <div class="quiz-footer">
            <a href="economics_chapters.html" class="home-link">Quit Quiz</a>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <div class="score-circle">
            <span class="score-big" id="final-score">0</span>
            <span class="score-label">Score</span>
        </div>
        <div class="accuracy-text" id="accuracy-text">Accuracy: 0%</div>
        <p class="remarks" id="remarks">Well Done!</p>
        <div class="action-btns">
            <button class="btn-restart" onclick="location.reload()">🔄 Retry</button>
            <a href="economics_chapters.html" class="btn-home">📂 Chapter List</a>
        </div>
    </div>
</div>

<script>
    const TOTAL_TIME_MINUTES = 10;
    let timeInSeconds = TOTAL_TIME_MINUTES * 60;
    let timerInterval;

    // ▼▼▼ ECONOMICS CHAPTER 3 QUESTIONS (मुद्रा, बचत एवं साख) ▼▼▼
    const questions = [
        { question: "1. विनिमय के कितने रूप हैं?", answers: [ { text: "एक", correct: false }, { text: "दो (वस्तु विनिमय और मौद्रिक विनिमय)", correct: true }, { text: "तीन", correct: false }, { text: "चार", correct: false } ] },
        { question: "2. मुद्रा वह है जो मुद्रा का कार्य करती है - यह परिभाषा किसने दी?", answers: [ { text: "मार्शल", correct: false }, { text: "रॉबर्टसन", correct: false }, { text: "हार्टले विदर्स", correct: true }, { text: " Seligman", correct: false } ] },
        { question: "3. प्लास्टिक मुद्रा (Plastic Money) का एक उदाहरण है?", answers: [ { text: "चेक", correct: false }, { text: "बैंक ड्राफ्ट", correct: false }, { text: "एटीएम (ATM) कार्ड", correct: true }, { text: "मिश्रित मुद्रा", correct: false } ] },
        { question: "4. भारत का केंद्रीय बैंक (Central Bank) कौन है?", answers: [ { text: "स्टेट बैंक ऑफ इंडिया", correct: false }, { text: "सेंट्रल बैंक ऑफ इंडिया", correct: false }, { text: "रिज़र्व बैंक ऑफ इंडिया (RBI)", correct: true }, { text: "पंजाब नेशनल बैंक", correct: false } ] },
        { question: "5. 'रिज़र्व बैंक ऑफ इंडिया' की स्थापना कब हुई थी?", answers: [ { text: "1930", correct: false }, { text: "1935", correct: true }, { text: "1947", correct: false }, { text: "1950", correct: false } ] },
        { question: "6. साख (Credit) का क्या अर्थ है?", answers: [ { text: "विश्वास करना", correct: false }, { text: "ऋण लौटाने की क्षमता", correct: false }, { text: "A और B दोनों", correct: true }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "7. इनमें से कौन मुद्रा का कार्य नहीं है?", answers: [ { text: "माध्यम", correct: false }, { text: "मापन", correct: false }, { text: "भुगतान", correct: false }, { text: "लेखन एवं संपादन", correct: true } ] },
        { question: "8. किस धातु का मुद्रा के रूप में सर्वाधिक प्रयोग हुआ है?", answers: [ { text: "लोहा", correct: false }, { text: "तांबा", correct: false }, { text: "पीतल", correct: false }, { text: "चाँदी और सोना", correct: true } ] },
        { question: "9. एक रुपये का नोट कौन जारी करता है?", answers: [ { text: "रिजर्व बैंक", correct: false }, { text: "केन्द्र सरकार (वित्त विभाग)", correct: true }, { text: "स्टेट बैंक", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "10. मुद्रा के प्रयोग से किसको लाभ हुआ है?", answers: [ { text: "उपभोक्ताओं को", correct: false }, { text: "उत्पादकों को", correct: false }, { text: "A और B दोनों", correct: true }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "11. 'बचत' (Saving) को प्रभावित करने वाला प्रमुख तत्व है?", answers: [ { text: "बचत की क्षमता", correct: false }, { text: "बचत की इच्छा", correct: false }, { text: "बचत की सुविधाएं", correct: false }, { text: "तीनों", correct: true } ] },
        { question: "12. मुद्रा एक अच्छा है?", answers: [ { text: "रैयत", correct: false }, { text: "मालिक", correct: false }, { text: "राजा", correct: false }, { text: "सेवक", correct: true } ] },
        { question: "13. एटीएम (ATM) का पूर्ण रूप क्या है?", answers: [ { text: "ऑटोमैटिक टेलर मशीन", correct: true }, { text: "ऑटोमैटिक टॉकिंग मशीन", correct: false }, { text: "ऑटोमैटिक टेकिंग मशीन", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "14. साख के मुख्य आधार क्या हैं?", answers: [ { text: "विश्वास", correct: true }, { text: "चरित्र", correct: false }, { text: "पूंजी", correct: false }, { text: "ये सभी", correct: false } ] },
        { question: "15. रूस की मुद्रा क्या है?", answers: [ { text: "डॉलर", correct: false }, { text: "पाउंड", correct: false }, { text: "रूबल", correct: true }, { text: "रियाल", correct: false } ] },
        { question: "16. स्वीडन की मुद्रा क्या है?", answers: [ { text: "डॉलर", correct: false }, { text: "पाउंड", correct: false }, { text: "क्रोना", correct: true }, { text: "रूबल", correct: false } ] },
        { question: "17. व्यावसायिक बैंकों का राष्ट्रीयकरण कब किया गया?", answers: [ { text: "1966", correct: false }, { text: "1980", correct: false }, { text: "1969", correct: true }, { text: "1975", correct: false } ] },
        { question: "18. भारत में सहकारिता आंदोलन का प्रारंभ कब हुआ?", answers: [ { text: "1904", correct: true }, { text: "1905", correct: false }, { text: "1907", correct: false }, { text: "1920", correct: false } ] },
        { question: "19. इनमें कौन संस्थागत वित्त का साधन है?", answers: [ { text: "सेठ साहूकार", correct: false }, { text: "रिश्तेदार", correct: false }, { text: "व्यावसायिक बैंक", correct: true }, { text: "महाजन", correct: false } ] },
        { question: "20. बांग्लादेश की मुद्रा का नाम क्या है?", answers: [ { text: "रुपया", correct: false }, { text: "डॉलर", correct: false }, { text: "टका", correct: true }, { text: "दिनार", correct: false } ] },
        { question: "21. प्रारंभिक अवस्था में मनुष्य अपनी आवश्यकता की पूर्ति करते थे?", answers: [ { text: "स्वयं उत्पादन करके", correct: false }, { text: "वस्तुओं के आदान-प्रदान से", correct: true }, { text: "मुद्रा से", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "22. विनिमय का सर्वोत्तम माध्यम क्या है?", answers: [ { text: "वस्तु", correct: false }, { text: "चेक", correct: false }, { text: "मुद्रा", correct: true }, { text: "हुंडी", correct: false } ] },
        { question: "23. आय एवं उपभोग के अंतर को क्या कहते हैं?", answers: [ { text: "बचत", correct: true }, { text: "विनियोग", correct: false }, { text: "उपभोग व्यय", correct: false }, { text: "इनमें कोई नहीं", correct: false } ] },
        { question: "24. क्रेडिट कार्ड (Credit Card) प्रसिद्ध है?", answers: [ { text: "पत्र मुद्रा", correct: false }, { text: "धात्विक मुद्रा", correct: false }, { text: "प्लास्टिक मुद्रा", correct: true }, { text: "साख मुद्रा", correct: false } ] },
        { question: "25. हमारे देश में किस मुद्रा को वैधानिक मान्यता प्राप्त है?", answers: [ { text: "वस्तु मुद्रा", correct: false }, { text: "साख मुद्रा", correct: false }, { text: "पत्र मुद्रा", correct: true }, { text: "चेक", correct: false } ] }
    ];

    let currentIdx = 0;
    let score = 0;
    
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const qIndexSpan = document.getElementById("q-index");
    const totalQSpan = document.getElementById("total-q");
    const timerDisplay = document.getElementById("time-left");
    const progressFill = document.getElementById("progress-fill");
    const finalScoreEl = document.getElementById("final-score");
    const accuracyTextEl = document.getElementById("accuracy-text");
    const remarksEl = document.getElementById("remarks");

    function startQuiz() {
        totalQSpan.innerText = questions.length;
        startTimer();
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeInSeconds--;
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timerDisplay.innerText = `${minutes}:${seconds}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function showQuestion() {
        resetState();
        let currentQ = questions[currentIdx];
        qIndexSpan.innerText = currentIdx + 1;
        qText.innerText = `Q${currentIdx + 1}. ${currentQ.question}`;
        let progress = ((currentIdx) / questions.length) * 100;
        progressFill.style.width = progress + "%";
        
        currentQ.answers.forEach(ans => {
            const btn = document.createElement("button");
            btn.innerText = ans.text;
            btn.classList.add("option-btn");
            if(ans.correct) btn.dataset.correct = ans.correct;
            btn.addEventListener("click", selectAnswer);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while(optContainer.firstChild) optContainer.removeChild(optContainer.firstChild);
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if(isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }
        Array.from(optContainer.children).forEach(btn => {
            if(btn.dataset.correct === "true") btn.classList.add("correct");
            btn.disabled = true;
        });
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        let accuracy = Math.round((score / questions.length) * 100);
        finalScoreEl.innerText = `${score} / ${questions.length}`;
        accuracyTextEl.innerText = `Accuracy: ${accuracy}%`;
        
        if(accuracy >= 80) {
            remarksEl.innerText = "💳 शानदार! बैंकिंग और मुद्रा का अच्छा ज्ञान है!";
            remarksEl.style.color = "green";
        } else if(accuracy >= 50) {
            remarksEl.innerText = "👍 ठीक है, पर 1935 (RBI) और 1969 (राष्ट्रीयकरण) जैसी तारीखें याद करें।";
            remarksEl.style.color = "orange";
        } else {
            remarksEl.innerText = "📚 रिवीजन करें।";
            remarksEl.style.color = "red";
        }
    }

    startQuiz();
</script>

</body>
</html>
