<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1109901963732620"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Task Manager – Topperwa</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{font-family:'Outfit',sans-serif;background:#F0F7FF;min-height:100vh;}
    .navbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid #BFDBFE;}
    /* Progress bar */
    .prog-bar{height:10px;background:#DBEAFE;border-radius:999px;overflow:hidden;}
    .prog-fill{height:100%;background:linear-gradient(90deg,#3B82F6,#1D4ED8);border-radius:999px;transition:width .5s cubic-bezier(.22,.68,0,1.2);}
    /* Task item */
    .task-item{background:#fff;border:1.5px solid #BFDBFE;border-radius:1rem;padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem;transition:all .3s;animation:slideIn .35s cubic-bezier(.22,.68,0,1.2) both;}
    .task-item:hover{box-shadow:0 6px 20px rgba(59,130,246,.12);border-color:#93C5FD;}
    .task-item.done{background:#F0FDF4;border-color:#86EFAC;opacity:.85;}
    .task-item.done .task-text{text-decoration:line-through;color:#94A3B8;}
    @keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    @keyframes fadeOut{to{opacity:0;transform:scale(.9);height:0;padding:0;margin:0;border:0}}
    .task-item.removing{animation:fadeOut .3s ease forwards;}
    /* Checkbox */
    .check-box{width:22px;height:22px;border-radius:50%;border:2px solid #93C5FD;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;}
    .check-box.checked{background:#3B82F6;border-color:#3B82F6;}
    .check-box.checked i{display:block;}
    .check-box i{display:none;color:#fff;font-size:.65rem;}
    /* Priority badges */
    .p-high{background:#FEE2E2;color:#DC2626;font-size:.65rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .p-med{background:#FEF9C3;color:#CA8A04;font-size:.65rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    .p-low{background:#DCFCE7;color:#16A34A;font-size:.65rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;}
    /* Input */
    input[type=text],select{font-family:'Outfit',sans-serif;}
    /* Filter tabs */
    .ftab{font-size:.8rem;font-weight:600;padding:.4rem .9rem;border-radius:999px;cursor:pointer;transition:all .2s;border:1.5px solid #BFDBFE;background:#fff;color:#64748B;}
    .ftab.active,.ftab:hover{background:#3B82F6;color:#fff;border-color:#3B82F6;}
    /* Shake animation for empty */
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .shake{animation:shake .3s ease;}
  </style>
</head>
<body>

<nav class="navbar px-4 h-14 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <a href="index.html" class="text-blue-400 hover:text-blue-600 text-lg transition"><i class="fas fa-arrow-left"></i></a>
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-gradient-to-br from-green-400 to-green-600 rounded-lg flex items-center justify-center text-white text-sm"><i class="fas fa-list-check"></i></div>
      <span class="font-extrabold text-blue-800 text-base">Task Manager</span>
    </div>
  </div>
  <button onclick="clearCompleted()" class="text-xs font-bold text-red-400 hover:text-red-600 transition px-3 py-1.5 rounded-lg hover:bg-red-50">
    <i class="fas fa-broom mr-1"></i> Clear Done
  </button>
</nav>

<main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

  <!-- Progress Card -->
  <div class="bg-white rounded-2xl p-5 shadow-sm border border-blue-100">
    <div class="flex items-center justify-between mb-3">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Today's Progress</p>
        <p class="text-2xl font-extrabold text-blue-700" id="progress-label">0 / 0 Tasks</p>
      </div>
      <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center">
        <span class="text-2xl font-extrabold text-blue-600" id="progress-pct">0%</span>
      </div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="flex items-center justify-between mt-2 text-xs text-slate-400">
      <span id="done-count">0 completed</span>
      <span id="rem-count">0 remaining</span>
    </div>
  </div>

  <!-- Add Task -->
  <div class="bg-white rounded-2xl p-5 shadow-sm border border-blue-100">
    <h2 class="font-bold text-blue-800 text-sm mb-3">+ Add New Task</h2>
    <div class="flex gap-2 mb-3">
      <input id="task-input" type="text" placeholder="e.g. Revise Trigonometry Chapter 8…"
        class="flex-1 bg-blue-50 border border-BFDBFE border-blue-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition"/>
      <select id="priority-select" class="bg-blue-50 border border-blue-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400 transition text-slate-700">
        <option value="high">🔴 High</option>
        <option value="med" selected>🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </div>
    <button onclick="addTask()" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 hover:-translate-y-0.5 active:scale-95">
      <i class="fas fa-plus"></i> Add Task
    </button>
  </div>

  <!-- Filter Tabs -->
  <div class="flex gap-2 flex-wrap">
    <button class="ftab active" data-filter="all"       onclick="setFilter('all',this)">All</button>
    <button class="ftab"        data-filter="pending"   onclick="setFilter('pending',this)">Pending</button>
    <button class="ftab"        data-filter="done"      onclick="setFilter('done',this)">Completed</button>
    <button class="ftab"        data-filter="high"      onclick="setFilter('high',this)">🔴 High</button>
    <button class="ftab"        data-filter="med"       onclick="setFilter('med',this)">🟡 Medium</button>
    <button class="ftab"        data-filter="low"       onclick="setFilter('low',this)">🟢 Low</button>
  </div>

  <!-- Task List -->
  <div id="task-list" class="space-y-3 min-h-[60px]">
    <!-- Tasks rendered by JS -->
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="hidden text-center py-12">
    <div class="text-5xl mb-3">📋</div>
    <p class="font-bold text-blue-700 text-lg">No tasks yet!</p>
    <p class="text-sm text-slate-400">Add your first study task above.</p>
  </div>

</main>

<script>
  const STORAGE_KEY = 'topperwa_tasks';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  // Seed demo tasks if empty
  if (tasks.length === 0) {
    tasks = [
      { id: Date.now()+1, text: 'Revise Trigonometry – Chapter 8', priority: 'high', done: false, created: new Date().toISOString() },
      { id: Date.now()+2, text: 'Read Godhuli Gadya Chapter 3',   priority: 'med',  done: false, created: new Date().toISOString() },
      { id: Date.now()+3, text: 'Practice Previous Year Math Paper', priority: 'high', done: true, created: new Date().toISOString() },
      { id: Date.now()+4, text: 'Make notes on Ohm\'s Law',         priority: 'low',  done: false, created: new Date().toISOString() },
    ];
    saveTasks();
  }

  function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function addTask() {
    const input = document.getElementById('task-input');
    const text  = input.value.trim();
    if (!text) { input.classList.add('shake'); setTimeout(()=>input.classList.remove('shake'),400); input.focus(); return; }
    const priority = document.getElementById('priority-select').value;
    tasks.unshift({ id: Date.now(), text, priority, done: false, created: new Date().toISOString() });
    input.value = '';
    saveTasks(); render();
  }

  function toggleTask(id) {
    const t = tasks.find(t=>t.id===id);
    if(t) { t.done = !t.done; saveTasks(); render(); }
  }

  function deleteTask(id) {
    const el = document.getElementById('task-'+id);
    if (el) {
      el.classList.add('removing');
      setTimeout(() => { tasks = tasks.filter(t=>t.id!==id); saveTasks(); render(); }, 300);
    }
  }

  function editTask(id) {
    const t = tasks.find(t=>t.id===id);
    if (!t) return;
    const newText = prompt('Edit task:', t.text);
    if (newText && newText.trim()) { t.text = newText.trim(); saveTasks(); render(); }
  }

  function clearCompleted() {
    if (!tasks.some(t=>t.done)) return;
    if (!confirm('Remove all completed tasks?')) return;
    tasks = tasks.filter(t=>!t.done); saveTasks(); render();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function getFiltered() {
    switch(currentFilter) {
      case 'pending': return tasks.filter(t=>!t.done);
      case 'done':    return tasks.filter(t=>t.done);
      case 'high':    return tasks.filter(t=>t.priority==='high');
      case 'med':     return tasks.filter(t=>t.priority==='med');
      case 'low':     return tasks.filter(t=>t.priority==='low');
      default:        return tasks;
    }
  }

  function priorityBadge(p) {
    if(p==='high') return '<span class="p-high">HIGH</span>';
    if(p==='low')  return '<span class="p-low">LOW</span>';
    return '<span class="p-med">MED</span>';
  }

  function render() {
    const list    = document.getElementById('task-list');
    const empty   = document.getElementById('empty-state');
    const filtered = getFiltered();
    const done    = tasks.filter(t=>t.done).length;
    const total   = tasks.length;
    const pct     = total ? Math.round(done/total*100) : 0;

    document.getElementById('prog-fill').style.width  = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-label').textContent = `${done} / ${total} Tasks`;
    document.getElementById('done-count').textContent    = `${done} completed`;
    document.getElementById('rem-count').textContent     = `${total-done} remaining`;

    if (filtered.length === 0) { list.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    list.innerHTML = filtered.map(t => `
      <div class="task-item ${t.done?'done':''}" id="task-${t.id}">
        <div class="check-box ${t.done?'checked':''}" onclick="toggleTask(${t.id})">
          <i class="fas fa-check"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="task-text text-sm font-semibold text-slate-700 truncate">${escHtml(t.text)}</p>
          <div class="flex items-center gap-2 mt-0.5">${priorityBadge(t.priority)}</div>
        </div>
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button onclick="editTask(${t.id})"   class="w-8 h-8 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-500 flex items-center justify-center transition text-xs"><i class="fas fa-pen"></i></button>
          <button onclick="deleteTask(${t.id})" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-400 flex items-center justify-center transition text-xs"><i class="fas fa-trash"></i></button>
        </div>
      </div>`).join('');
  }

  function escHtml(str) {
    const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  document.getElementById('task-input').addEventListener('keydown', e => { if(e.key==='Enter') addTask(); });
  render();
</script>
</body>
</html>
