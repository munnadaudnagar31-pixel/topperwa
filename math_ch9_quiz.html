    <meta charset="UTF-8">

    <title>Math Ch-9: App. of Trigonometry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Applications of Trigonometry</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Heights and Distances) ---
        const questions = [
            { q: "The angle formed by the line of sight with the horizontal when the point being viewed is above the horizontal level is called:", o: ["Angle of depression", "Angle of elevation", "Right angle", "Obtuse angle"], a: 1 },
            { q: "The angle formed by the line of sight with the horizontal when the point being viewed is below the horizontal level is called:", o: ["Angle of elevation", "Angle of depression", "Acute angle", "Straight angle"], a: 1 },
            { q: "If the length of the shadow of a tower is equal to its height, then the angle of elevation of the sun is:", o: ["30°", "45°", "60°", "90°"], a: 1 },
            { q: "The angle of elevation of the top of a tower from a point on the ground, which is 30 m away from the foot of the tower, is 30°. The height of the tower is:", o: ["10√3 m", "30√3 m", "15√3 m", "10 m"], a: 0 },
            { q: "A tower stands vertically on the ground. From a point on the ground, which is 15 m away from the foot of the tower, the angle of elevation of the top of the tower is found to be 60°. The height of the tower is:", o: ["15√3 m", "10√3 m", "15 m", "5√3 m"], a: 0 },
            { q: "A kite is flying at a height of 60 m above the ground. The string attached to the kite is temporarily tied to a point on the ground. The inclination of the string with the ground is 60°. The length of the string is:", o: ["40√3 m", "30√3 m", "20√3 m", "60√3 m"], a: 0 },
            { q: "The angle of depression of a point on the ground from the top of a tower is 30°. If the height of the tower is 10 m, find the distance of the point from the foot of the tower.", o: ["10√3 m", "10 m", "10/√3 m", "20 m"], a: 0 },
            { q: "If the angle of elevation of a tower from a distance of 100 m from its foot is 60°, then the height of the tower is:", o: ["100√3 m", "100/√3 m", "50√3 m", "200/√3 m"], a: 0 },
            { q: "A pole 6 m high casts a shadow 2√3 m long on the ground, then the Sun's elevation is:", o: ["60°", "45°", "30°", "90°"], a: 0 },
            { q: "The ratio of the length of a rod and its shadow is 1:√3. The angle of elevation of the sun is:", o: ["30°", "45°", "60°", "90°"], a: 0 },
            { q: "From a point P on the ground the angle of elevation of the top of a 10 m tall building is 30°. A flag is hoisted at the top of the building and the angle of elevation of the top of the flagstaff from P is 45°. Find the length of the flagstaff.", o: ["10(√3-1) m", "10(√3+1) m", "7.32 m", "10(1-1/√3) m"], a: 2 },
            { q: "The angle of elevation of the top of a tower from two points at distances a and b from the base and in the same straight line with it are complementary. The height of the tower is:", o: ["ab", "√(ab)", "a/b", "√(a/b)"], a: 1 },
            { q: "A ladder 15 m long just reaches the top of a vertical wall. If the ladder makes an angle of 60° with the wall, then the height of the wall is:", o: ["15√3 m", "15√3/2 m", "7.5 m", "15 m"], a: 2 },
            { q: "From the top of a 7 m high building, the angle of elevation of the top of a cable tower is 60° and the angle of depression of its foot is 45°. Determine the height of the tower.", o: ["7(√3+1) m", "7(√3-1) m", "7√3 m", "7 m"], a: 0 },
            { q: "The angle of elevation of the top of a hill at the foot of a tower is 60° and the angle of elevation of the top of the tower from the foot of the hill is 30°. If the tower is 50 m high, what is the height of the hill?", o: ["150 m", "100 m", "50 m", "120 m"], a: 0 },
            { q: "A tree breaks due to storm and the broken part bends so that the top of the tree touches the ground making an angle 30° with it. The distance between the foot of the tree to the point where the top touches the ground is 8 m. The height of the tree is:", o: ["8√3 m", "24/√3 m", "8 m", "16/√3 m"], a: 0 },
            { q: "The angles of elevation of the top of a tower from two points at a distance of 4 m and 9 m from the base of the tower and in the same straight line with it are complementary. The height of the tower is:", o: ["6 m", "4 m", "9 m", "36 m"], a: 0 },
            { q: "From a point on a bridge across a river, the angles of depression of the banks on opposite sides of the river are 30° and 45°, respectively. If the bridge is at a height of 3 m from the banks, find the width of the river.", o: ["3(√3+1) m", "3(√3-1) m", "3√3 m", "9 m"], a: 0 },
            { q: "The angle of elevation of the sun, when the length of the shadow of a tree is equal to the height of the tree, is:", o: ["30°", "45°", "60°", "90°"], a: 1 },
            { q: "If the height of a tower and the distance of the point of observation from its foot, both, are increased by 10%, then the angle of elevation of its top:", o: ["Increases", "Decreases", "Remains unchanged", "Becomes 90°"], a: 2 },
            { q: "A circus artist is climbing a 20 m long rope, which is tightly stretched and tied from the top of a vertical pole to the ground. Find the height of the pole, if the angle made by the rope with the ground level is 30°.", o: ["10 m", "20 m", "15 m", "10√3 m"], a: 0 },
            { q: "The shadow of a tower standing on level ground is found to be 40 m longer when the Sun's altitude is 30° than when it is 60°. Find the height of the tower.", o: ["20√3 m", "40√3 m", "20 m", "10√3 m"], a: 0 },
            { q: "From the top of a 7 m high building, the angle of elevation of the top of a tower is 60° and the angle of depression of its foot is 45°. The height of the tower is:", o: ["7(√3+1) m", "7(√3-1) m", "7√3 m", "14 m"], a: 0 },
            { q: "The angle of elevation of a jet plane from a point A on the ground is 60°. After a flight of 15 seconds, the angle of elevation changes to 30°. If the jet plane is flying at a constant height of 1500√3 m, find the speed of the jet plane.", o: ["200 m/s", "150 m/s", "100 m/s", "300 m/s"], a: 0 },
            { q: "A straight highway leads to the foot of a tower. A man standing at the top of the tower observes a car at an angle of depression of 30°, which is approaching the foot of the tower with a uniform speed. Six seconds later, the angle of depression of the car is found to be 60°. Find the time taken by the car to reach the foot of the tower from this point.", o: ["3 seconds", "6 seconds", "9 seconds", "1.5 seconds"], a: 0 },
            { q: "The angle of elevation of the top of a vertical tower from a point on the ground is 60°. From another point 10 m vertically above the first, its angle of elevation is 45°. Find the height of the tower.", o: ["5(√3+3) m", "5(√3-1) m", "10√3 m", "15 m"], a: 0 },
            { q: "The angles of depression of the top and the bottom of an 8 m tall building from the top of a multi-storeyed building are 30° and 45°, respectively. Find the height of the multi-storeyed building.", o: ["4(3+√3) m", "4(3-√3) m", "8√3 m", "12 m"], a: 0 },
            { q: "Two ships are sailing in the sea on the two sides of a lighthouse. The angle of elevation of the top of the lighthouse is observed from the ships are 30° and 45° respectively. If the lighthouse is 100 m high, the distance between the two ships is:", o: ["100(√3+1) m", "100(√3-1) m", "100√3 m", "200 m"], a: 0 },
            { q: "An observer 1.5 m tall is 28.5 m away from a chimney. The angle of elevation of the top of the chimney from her eyes is 45°. What is the height of the chimney?", o: ["30 m", "28.5 m", "27 m", "31.5 m"], a: 0 },
            { q: "The horizontal distance between two towers is 140 m. The angle of elevation of the top of the first tower when seen from the top of the second tower is 30°. If the height of the second tower is 60 m, find the height of the first tower.", o: ["60 + 140/√3 m", "60 - 140/√3 m", "140√3 m", "80 m"], a: 0 },
            { q: "If the angle of elevation of a cloud from a point h metres above a lake is α and the angle of depression of its reflection in the lake is β, prove that the height of the cloud is:", o: ["h(tanβ + tanα)/(tanβ - tanα)", "h(tanβ - tanα)/(tanβ + tanα)", "h tanα", "h tanβ"], a: 0 },
            { q: "As the sun rises, the shadow of a tower:", o: ["Decreases", "Increases", "Remains same", "None of these"], a: 0 },
            { q: "When the sun is 30° above the horizon, the length of the shadow of a tree is 20 m. What is the height of the tree?", o: ["20/√3 m", "20√3 m", "10 m", "40 m"], a: 0 },
            { q: "If the angle of elevation of the top of a tower from two points at distances a and b from the base and in the same straight line with it are complementary, then the height of the tower is:", o: ["√(ab)", "ab", "a/b", "b/a"], a: 0 },
            { q: "A ladder rests against a vertical wall at an inclination α to the horizontal. Its foot is pulled away from the wall through a distance p so that its upper end slides a distance q down the wall and then the ladder makes an angle β to the horizontal. Then p/q =", o: ["(cosβ - cosα)/(sinα - sinβ)", "(cosα - cosβ)/(sinβ - sinα)", "sinα/sinβ", "cosα/cosβ"], a: 0 },
            { q: "The angle of elevation of the top of a tower is 30°. If the height of the tower is doubled, then the angle of elevation of its top will be:", o: ["Less than 60°", "60°", "More than 60°", "Double the previous angle"], a: 0 },
            { q: "From the top of a cliff 25 m high the angle of elevation of a tower is found to be equal to the angle of depression of the foot of the tower. The height of the tower is:", o: ["50 m", "25 m", "75 m", "100 m"], a: 0 },
            { q: "At a point 15 m away from the base of a 15 m high house, the angle of elevation of the top is:", o: ["45°", "30°", "60°", "90°"], a: 0 },
            { q: "A flag pole 18 m high casts a shadow of 9.6 m. Find the distance of the top of the pole from the far end of the shadow.", o: ["20.4 m", "18 m", "24 m", "30 m"], a: 0 },
            { q: "A round balloon of radius r subtends an angle α at the eye of the observer while the angle of elevation of its centre is β. The height of the centre of the balloon is:", o: ["r sinβ cosec(α/2)", "r sinα cosec(β/2)", "r sinβ sec(α/2)", "r sinα sec(β/2)"], a: 0 },
            { q: "The angle of elevation of a ladder leaning against a wall is 60° and the foot of the ladder is 9.5 m away from the wall. The length of the ladder is:", o: ["19 m", "10 m", "20 m", "18 m"], a: 0 },
            { q: "If the angle of depression of an object from a 75 m high tower is 30°, then the distance of the object from the tower is:", o: ["75√3 m", "25√3 m", "50 m", "150 m"], a: 0 },
            { q: "A tree 6 m tall casts a 4 m long shadow. At the same time, a flag pole casts a 50 m long shadow. How long is the flag pole?", o: ["75 m", "50 m", "100 m", "60 m"], a: 0 },
            { q: "If the ratio of the height of a tower and the length of its shadow is √3 : 1, what is the angle of elevation of the Sun?", o: ["60°", "30°", "45°", "90°"], a: 0 },
            { q: "A 1.6 m tall girl stands at a distance of 3.2 m from a lamp post and casts a shadow of 4.8 m on the ground. Find the height of the lamp post.", o: ["2.67 m", "1.8 m", "2.8 m", "2.5 m"], a: 0 },
            { q: "A man on the top of a vertical observation tower observes a car moving at a uniform speed coming directly towards it. If it takes 12 minutes for the angle of depression to change from 30° to 45°, how soon after this will the car reach the observation tower?", o: ["16 min 23 sec", "12 min", "14 min 30 sec", "15 min"], a: 0 },
            { q: "The angle of elevation of the top of a building from the foot of the tower is 30° and the angle of elevation of the top of the tower from the foot of the building is 60°. If the tower is 50 m high, find the height of the building.", o: ["16.67 m", "25 m", "30 m", "50 m"], a: 0 },
            { q: "Two poles are 'a' metres apart and the height of one is double of the other. If from the middle point of the line joining their feet an observer finds the angular elevations of their tops to be complementary, then the height of the smaller pole is:", o: ["a/(2√2)", "a/4", "a√2", "2a"], a: 0 },
            { q: "The shadow of a stick 5 m long is 2 m. At the same time, the shadow of a tree 12.5 m high is:", o: ["5 m", "3 m", "4.5 m", "6 m"], a: 0 },
            { q: "If the elevation of the sun changes from 30° to 60°, then the difference between the lengths of shadows of a pole 15 m high, is:", o: ["10√3 m", "5√3 m", "15√3 m", "7.5 m"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Heights & Distances Pro! Amazing! 🏔️";
            else if(accuracy >= 70) feedback.innerText = "Good job! You can calculate any height. 📐";
            else if(accuracy >= 50) feedback.innerText = "Not bad, but draw diagrams carefully. ✏️";
            else feedback.innerText = "Practice makes perfect. Try again! 🔥";
        }
    </script>
</body>
</html>
