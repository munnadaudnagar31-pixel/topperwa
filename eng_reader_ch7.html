<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Reader Ch-7: Love Defiled</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL READER THEME (Royal Purple) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            --header-gradient: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%);
            --card-bg: #ffffff;
            --text-main: #4a148c;
            --text-sub: #7b1fa2;
            --option-bg: #fdfbff;
            --correct-color: #9c27b0; /* Purple */
            --wrong-color: #d32f2f;   /* Red */
            --timer-bg: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(74,20,140,0.2);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #e1bee7; }
        .progress-bar { height: 100%; background: #9c27b0; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(74, 20, 140, 0.08);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #7b1fa2;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #f3e5f5; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #e1bee7; background: #4a148c; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #7b1fa2; text-transform: uppercase; letter-spacing: 1px; }

        .question-text { 
            font-size: 18px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #263238; font-family: 'Lora', serif; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 15px; color: #37474f; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #b0bec5;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #b0bec5; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #f3e5f5; }
        
        /* Correct State */
        .option-btn.correct { background: #f3e5f5; border-color: var(--correct-color); color: #4a148c; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(74, 20, 140, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #f3e5f5;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(74,20,140,0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #4a148c;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #4a148c; line-height: 1; }
        .score-label { font-size: 11px; color: #7b1fa2; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #546e7a; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #9c27b0; }
        .red-text { color: #d32f2f; }
        .blue-text { color: #2962ff; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #4a148c; color: white; box-shadow: 0 5px 15px rgba(74,20,140,0.3); }
        .btn-secondary { background: #e1bee7; color: #4a148c; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="english_reader_chapters.html" class="close-btn">✕</a>
        <div class="timer-box">
            <span>⏳</span> <span id="time-left">10:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">1 / 30</span>
                <span class="q-subject">Love Defiled</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#4a148c; margin-bottom: 10px;">Quiz Complete!</h2>
            <p style="color:#7b1fa2; font-size:14px; margin-bottom: 25px;">Love Defiled</p>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 30</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#546e7a; font-size:14px; margin-bottom:25px; line-height:1.4;">Well done!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='english_reader_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 30 MCQs from 'Love Defiled' ---
        const questions = [
            { q: "Who is the author of 'Love Defiled'?", o: ["Giridhar Jha", "Binapani Mohanty", "Anton Chekhov", "Katherine Mansfield"], a: 0 },
            { q: "Giridhar Jha is a professional _____.", o: ["Journalist", "Doctor", "Lawyer", "Teacher"], a: 0 },
            { q: "The story is about the relationship between the narrator and his:", o: ["Girlfriend", "Wife", "Sister", "Mother"], a: 0 },
            { q: "For how many years were they in a relationship?", o: ["8 years", "5 years", "2 years", "10 years"], a: 0 },
            { q: "The narrator describes his girlfriend as:", o: ["Intelligent and sensible", "Rich and arrogant", "Beautiful but dumb", "Mean"], a: 0 },
            { q: "Why did the narrator not marry his girlfriend?", o: ["Societal pressure/Cowardice", "He didn't love her", "She cheated", "She refused"], a: 0 },
            { q: "The narrator ultimately had an _____ marriage.", o: ["Arranged", "Love", "Secret", "No"], a: 0 },
            { q: "Who arranged the narrator's marriage?", o: ["His parents", "His friends", "His girlfriend", "Himself"], a: 0 },
            { q: "What did the girlfriend do after the breakup?", o: ["Married someone else", "Remained single", "Committed suicide", "Left the country"], a: 0 },
            { q: "Who did the girlfriend marry?", o: ["An IAS officer", "A doctor", "A journalist", "A businessman"], a: 0 },
            { q: "The narrator feels that he has _____ his love.", o: ["Defiled (Impured)", "Saved", "Honoured", "Forgotten"], a: 0 },
            { q: "The girlfriend accepted the breakup with:", o: ["Dignity and silence", "Anger and shouting", "Violence", "Revenge"], a: 0 },
            { q: "The narrator's character is portrayed as:", o: ["Weak/Cowardly", "Strong", "Heroic", "Honest"], a: 0 },
            { q: "Did the narrator tell his wife about his past?", o: ["No", "Yes", "Partially", "She knew"], a: 0 },
            { q: "The story highlights the conflict between:", o: ["True love and Social norms", "Rich and Poor", "City and Village", "War and Peace"], a: 0 },
            { q: "In the end, the narrator is left with:", o: ["Guilt and regret", "Happiness", "Peace", "Anger"], a: 0 },
            { q: "The narrator met his girlfriend while working as a:", o: ["Journalist", "Banker", "Teacher", "Clerk"], a: 0 },
            { q: "The girlfriend's name is:", o: ["Not mentioned", "Radha", "Sita", "Gita"], a: 0 },
            { q: "The title 'Love Defiled' suggests:", o: ["Polluted/Ruined love", "Pure love", "Godly love", "Funny love"], a: 0 },
            { q: "The narrator admits he did not have the _____ to rebel against his family.", o: ["Courage", "Money", "Time", "Interest"], a: 0 },
            { q: "The girlfriend was looking for a:", o: ["Life partner", "Friend", "Job", "House"], a: 0 },
            { q: "The narrator's parents wanted a:", o: ["Traditional daughter-in-law", "Modern girl", "Working woman", "Foreigner"], a: 0 },
            { q: "The story questions the validity of:", o: ["Arranged marriages without love", "Love marriages", "Education", "Journalism"], a: 0 },
            { q: "The narrator realizes that he was:", o: ["Dishonest to his love", "A hero", "A good son", "Smart"], a: 0 },
            { q: "When the narrator sees his ex-girlfriend later, she looks:", o: ["Happy and settled", "Sad and poor", "Angry", "Sick"], a: 0 },
            { q: "The narrator feels he betrayed:", o: ["His girlfriend and himself", "His parents", "Society", "No one"], a: 0 },
            { q: "The story is narrated in the _____ person.", o: ["First (I)", "Third (He)", "Second (You)", "None"], a: 0 },
            { q: "Giridhar Jha is based in:", o: ["New Delhi/Patna", "London", "New York", "Mumbai"], a: 0 },
            { q: "The theme of the story is:", o: ["Betrayal in love", "Patriotism", "Horror", "Comedy"], a: 0 },
            { q: "Love becomes 'defiled' when it lacks:", o: ["Commitment and courage", "Money", "Beauty", "Gifts"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 600; // 10 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Deep Thinker! You understand complex emotions! 🧠";
            else if(accuracy >= 70) feedback.innerText = "Good job! You followed the story well. 💔";
            else if(accuracy >= 50) feedback.innerText = "Good effort. Don't be a coward in love! 🥀";
            else feedback.innerText = "Read the story to feel the regret. 🔥";
        }
    </script>
</body>
</html>
