<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1109901963732620"
     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Hindi Varnika Chapters</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL HINDI THEME (Varnika Special) --- */
        :root {
            --bg-gradient: linear-gradient(180deg, #fff8e1 0%, #ffecb3 100%); /* Light Yellow-Orange */
            --header-gradient: linear-gradient(135deg, #ff6f00 0%, #ff8f00 100%); /* Deep Orange */
            --text-main: #3e2723;
            --text-sub: #5d4037;
            --card-bg: #ffffff;
            --card-shadow: 0 10px 20px rgba(255, 111, 0, 0.15);
            --num-gradient: linear-gradient(135deg, #ffca28 0%, #ffb300 100%); /* Amber */
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        .dark-mode {
            --bg-gradient: linear-gradient(180deg, #212121 0%, #323232 100%);
            --header-gradient: linear-gradient(135deg, #bf360c 0%, #d84315 100%);
            --text-main: #eceff1;
            --text-sub: #cfd8dc;
            --card-bg: #424242;
            --card-shadow: 0 4px 10px rgba(0,0,0,0.5);
            --num-gradient: linear-gradient(135deg, #e65100 0%, #ef6c00 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            overflow-y: scroll; transition: 0.3s;
        }

        /* --- HEADER --- */
        .app-header {
            background: var(--header-gradient); padding: 25px 25px 45px 25px;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            box-shadow: 0 15px 30px rgba(255, 111, 0, 0.25); 
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 15px; color: white;
        }

        .back-btn {
            width: 42px; height: 42px; background: var(--glass-bg); border-radius: 14px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            border: 1px solid var(--glass-border); backdrop-filter: blur(10px); font-size: 20px;
            text-decoration: none; color: white; transition: transform 0.2s;
        }
        .back-btn:active { transform: scale(0.9); }

        .header-title h1 { font-size: 24px; font-weight: 800; margin: 0; }
        .header-title p { font-size: 13px; opacity: 0.9; margin: 0; font-weight: 500; }

        .theme-toggle {
            margin-left: auto; width: 42px; height: 42px; background: var(--glass-bg);
            border-radius: 14px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: 1px solid var(--glass-border); backdrop-filter: blur(10px);
        }

        /* --- CHAPTER LIST --- */
        .container { padding: 20px; margin-top: -30px; padding-bottom: 40px; }

        .chapter-card {
            background: var(--card-bg); border-radius: 24px; padding: 15px 20px;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--card-shadow); text-decoration: none; color: var(--text-main);
            animation: slideUp 0.5s ease forwards; opacity: 0; transform: translateY(20px);
            border: 1px solid rgba(0,0,0,0.03); transition: transform 0.2s;
        }
        
        .chapter-card:active { transform: scale(0.97); }

        .ch-left { display: flex; align-items: center; gap: 18px; }
        
        .ch-num {
            background: var(--num-gradient); color: white; width: 50px; height: 50px;
            border-radius: 16px; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 20px; flex-shrink: 0;
        }

        .ch-info h3 { font-size: 17px; font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
        .ch-info span { font-size: 12px; color: var(--text-sub); font-weight: 600; }

        .play-icon {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; 
            color: #ccc; font-size: 14px; border: 2px solid #eee;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <div class="header-title">
            <h1>हिंदी (वर्णिका)</h1>
            <p>Class 10 • 5 Chapters</p>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
    </div>

    <div class="container">
        
        <a href="hindi_varnika_ch1.html" class="chapter-card" style="animation-delay: 0.1s;">
            <div class="ch-left">
                <div class="ch-num">01</div>
                <div class="ch-info">
                    <h3>दही वाली मंगम्मा</h3>
                    <span>श्रीनिवास</span>
                </div>
            </div>
            <div class="play-icon">▶</div>
        </a>

        <a href="hindi_varnika_ch2.html" class="chapter-card" style="animation-delay: 0.2s;">
            <div class="ch-left">
                <div class="ch-num">02</div>
                <div class="ch-info">
                    <h3>ढहते विश्वास</h3>
                    <span>सातकोड़ी होता</span>
                </div>
            </div>
            <div class="play-icon">▶</div>
        </a>

        <a href="hindi_varnika_ch3.html" class="chapter-card" style="animation-delay: 0.3s;">
            <div class="ch-left">
                <div class="ch-num">03</div>
                <div class="ch-info">
                    <h3>माँ</h3>
                    <span>ईश्वर पेटलीकर</span>
                </div>
            </div>
            <div class="play-icon">▶</div>
        </a>

        <a href="hindi_varnika_ch4.html" class="chapter-card" style="animation-delay: 0.4s;">
            <div class="ch-left">
                <div class="ch-num">04</div>
                <div class="ch-info">
                    <h3>नगर</h3>
                    <span>सुजाता</span>
                </div>
            </div>
            <div class="play-icon">▶</div>
        </a>

        <a href="hindi_varnika_ch5.html" class="chapter-card" style="animation-delay: 0.5s;">
            <div class="ch-left">
                <div class="ch-num">05</div>
                <div class="ch-info">
                    <h3>धरती कब तक घूमेगी</h3>
                    <span>साँवर दइया</span>
                </div>
            </div>
            <div class="play-icon">▶</div>
        </a>

    </div>

    <script>
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = "☀️";
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('.theme-toggle').textContent = isDark ? "☀️" : "🌙";
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>

</body>
</html>
