<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7566722243290201"
     crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0; maximum-scale=1.0; user-scalable=no">
    <title>Math Ch-3: Linear Equations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* --- PROFESSIONAL MATH THEME (Royal Blue) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --card-bg: #ffffff;
            --text-main: #1e3c72;
            --text-sub: #546e7a;
            --option-bg: #F0F4F8;
            --correct-color: #00C853; /* Success Green */
            --wrong-color: #D50000;   /* Error Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            padding: 20px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10;
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 16px; border-radius: 20px;
            font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
        }
        .timer-icon { font-size: 14px; }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.2); margin-top: 5px; }
        .progress-bar { height: 100%; background: #00E5FF; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px #00E5FF; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 600px;
            padding: 25px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .q-count { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .q-subject { font-size: 12px; font-weight: 700; color: #2a5298; background: #e3f2fd; padding: 2px 8px; border-radius: 6px; }

        .question-text { font-size: 19px; font-weight: 700; margin-bottom: 25px; line-height: 1.5; color: #2c3e50; }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 12px; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 18px 20px;
            border-radius: 16px; font-size: 16px; color: #455a64; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; position: relative; display: flex; align-items: center;
        }
        
        .option-circle {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cfd8dc;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }

        .option-btn:active { transform: scale(0.98); }
        
        /* Correct State */
        .option-btn.correct { background: #E8F5E9; border-color: var(--correct-color); color: var(--correct-color); font-weight: 700; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #FFEBEE; border-color: var(--wrong-color); color: var(--wrong-color); font-weight: 700; animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER (NEXT BUTTON) --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; width: 100%; max-width: 600px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px;
            background: #f8f9fa; border-radius: 30px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 140px; height: 140px; border-radius: 50%;
            background: white; border: 10px solid #2a5298;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); position: relative;
        }
        .score-num { font-size: 42px; font-weight: 800; color: #1e3c72; line-height: 1; }
        .score-label { font-size: 12px; color: #888; font-weight: 600; margin-top: 5px; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px;
        }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 11px; color: #888; font-weight: 600; }

        .green-text { color: #00C853; }
        .red-text { color: #D50000; }
        .blue-text { color: #2962FF; }

        .action-btn {
            display: block; width: 100%; padding: 15px; border-radius: 15px;
            font-weight: 700; font-size: 16px; margin-bottom: 10px; cursor: pointer; border: none;
        }
        .btn-primary { background: #1e3c72; color: white; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3); }
        .btn-secondary { background: #e3f2fd; color: #1e3c72; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    </style>
</head>
<body>

    <div class="quiz-header" id="header">
        <a href="math_chapters.html" class="close-btn">✕</a>
        <div class="timer-box" id="timer-display">
            <span class="timer-icon">⏱</span> <span id="time-left">30:00</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="quiz-container" id="quiz-ui">
        <div class="question-card">
            <div class="q-meta">
                <span class="q-count" id="q-number">Question 1/50</span>
                <span class="q-subject">Linear Equations</span>
            </div>
            <div class="question-text" id="question-text">Loading...</div>
            <div class="options-list" id="options-container"></div>
        </div>
    </div>

    <div class="quiz-footer" id="footer">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
    </div>

    <div class="result-screen" id="result-ui">
        <div class="result-card">
            <h2 style="color:#1e3c72; margin-bottom: 20px;">Quiz Result</h2>
            
            <div class="score-circle">
                <span class="score-num" id="final-score">0</span>
                <span class="score-label">OUT OF 50</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val green-text" id="correct-count">0</span>
                    <span class="stat-lbl">Correct</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val red-text" id="wrong-count">0</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val blue-text" id="accuracy-percent">0%</span>
                    <span class="stat-lbl">Accuracy</span>
                </div>
            </div>

            <p id="feedback-text" style="color:#666; font-size:14px; margin-bottom:25px; line-height:1.4;">Keep practicing!</p>

            <button class="action-btn btn-primary" onclick="window.location.href='math_chapters.html'">Back to Chapters</button>
            <button class="action-btn btn-secondary" onclick="location.reload()">Retry Quiz</button>
        </div>
    </div>

    <script>
        // --- DATA: 50 MATH QUESTIONS (Linear Equations) ---
        const questions = [
            { q: "The general form of a linear equation in two variables x and y is:", o: ["ax + by = c", "ax² + by + c = 0", "ax + by + c = 0", "ax + b = 0"], a: 2 },
            { q: "The graph of a linear equation in two variables is a:", o: ["Straight line", "Curved line", "Parabola", "Ellipse"], a: 0 },
            { q: "The pair of equations x = 0 and x = 5 has:", o: ["No solution", "Unique solution", "Two solutions", "Infinitely many solutions"], a: 0 },
            { q: "The pair of equations y = 0 and y = -7 has:", o: ["One solution", "Two solutions", "Infinitely many solutions", "No solution"], a: 3 },
            { q: "If a pair of linear equations is consistent, then the lines will be:", o: ["Parallel", "Always coincident", "Intersecting or coincident", "Always intersecting"], a: 2 },
            { q: "The value of k for which the system of equations kx - y = 2 and 6x - 2y = 3 has a unique solution is:", o: ["k = 3", "k ≠ 3", "k ≠ 0", "k = 0"], a: 1 },
            { q: "The value of k for which the system of equations 2x + 3y = 5 and 4x + ky = 10 has infinite number of solutions is:", o: ["1", "3", "6", "0"], a: 2 },
            { q: "The value of k for which the system of equations x + 2y - 3 = 0 and 5x + ky + 7 = 0 has no solution is:", o: ["10", "6", "3", "1"], a: 0 },
            { q: "If the lines given by 3x + 2ky = 2 and 2x + 5y + 1 = 0 are parallel, then the value of k is:", o: ["-5/4", "2/5", "15/4", "3/2"], a: 2 },
            { q: "The graph of x = -2 is a line parallel to the:", o: ["x-axis", "y-axis", "Both x and y axis", "None"], a: 1 },
            { q: "The graph of y = 4x is a line:", o: ["Parallel to x-axis", "Parallel to y-axis", "Perpendicular to y-axis", "Passing through the origin"], a: 3 },
            { q: "The point of intersection of the lines x = 2 and y = 3 is:", o: ["(2, 3)", "(3, 2)", "(2, 2)", "(3, 3)"], a: 0 },
            { q: "The pair of equations x + 2y + 5 = 0 and -3x - 6y + 1 = 0 have:", o: ["A unique solution", "Exactly two solutions", "Infinitely many solutions", "No solution"], a: 3 },
            { q: "If a pair of linear equations is inconsistent, then the lines will be:", o: ["Parallel", "Always coincident", "Intersecting", "Intersecting or coincident"], a: 0 },
            { q: "One equation of a pair of dependent linear equations is -5x + 7y = 2. The second equation can be:", o: ["10x + 14y + 4 = 0", "-10x - 14y + 4 = 0", "-10x + 14y + 4 = 0", "10x - 14y = -4"], a: 3 },
            { q: "Two numbers differ by 26 and one number is three times the other. The numbers are:", o: ["39, 13", "30, 10", "26, 0", "40, 14"], a: 0 },
            { q: "The sum of the digits of a two-digit number is 9. If 27 is added to it, the digits of the number get reversed. The number is:", o: ["25", "72", "63", "36"], a: 3 },
            { q: "A fraction becomes 1/3 when 1 is subtracted from the numerator and it becomes 1/4 when 8 is added to its denominator. The fraction is:", o: ["3/12", "5/12", "4/12", "7/12"], a: 1 },
            { q: "Five years ago, Nuri was thrice as old as Sonu. Ten years later, Nuri will be twice as old as Sonu. Nuri's age is:", o: ["40", "50", "60", "30"], a: 1 },
            { q: "The solution of equations x + y = 14 and x - y = 4 is:", o: ["x=9, y=5", "x=5, y=9", "x=7, y=7", "x=10, y=4"], a: 0 },
            { q: "If 2x + 3y = 11 and 2x - 4y = -24, then value of 'm' for which y = mx + 3 is:", o: ["1", "-1", "2", "-2"], a: 1 },
            { q: "The larger of two supplementary angles exceeds the smaller by 18 degrees. Find the angles.", o: ["99°, 81°", "90°, 90°", "100°, 80°", "81°, 18°"], a: 0 },
            { q: "The cost of 5 oranges and 3 apples is Rs. 35 and the cost of 2 oranges and 4 apples is Rs. 28. The cost of an orange is:", o: ["Rs. 4", "Rs. 5", "Rs. 6", "Rs. 3"], a: 0 },
            { q: "For what value of k, do the equations 3x - y + 8 = 0 and 6x - ky = -16 represent coincident lines?", o: ["1/2", "-1/2", "2", "-2"], a: 2 },
            { q: "If the system 6x - 2y = 3 and kx - y = 2 has a unique solution, the value of k is:", o: ["k = 3", "k ≠ 3", "k = 4", "k ≠ 4"], a: 1 },
            { q: "The area of the triangle formed by the line x/a + y/b = 1 with the coordinate axes is:", o: ["ab", "2ab", "1/2 ab", "1/4 ab"], a: 2 },
            { q: "If x = a, y = b is the solution of the equations x - y = 2 and x + y = 4, then the values of a and b are, respectively:", o: ["3 and 5", "5 and 3", "3 and 1", "-1 and -3"], a: 2 },
            { q: "The value of k for which the system of equations x + 2y = 5 and 3x + ky + 15 = 0 has no solution is:", o: ["6", "-6", "3/2", "None of these"], a: 0 },
            { q: "If am ≠ bl, then the system of equations ax + by = c and lx + my = n has:", o: ["A unique solution", "No solution", "Infinitely many solutions", "None"], a: 0 },
            { q: "If 29x + 37y = 103 and 37x + 29y = 95, then:", o: ["x=1, y=2", "x=2, y=1", "x=2, y=3", "x=3, y=2"], a: 0 },
            { q: "If the system of equations 2x + 3y = 7 and 2ax + (a + b)y = 28 has infinitely many solutions, then:", o: ["a = 2b", "b = 2a", "a + 2b = 0", "2a + b = 0"], a: 1 },
            { q: "The sum of the digits of a two-digit number is 9. If 27 is added to it, the digits of the number get reversed. The number is:", o: ["25", "72", "63", "36"], a: 3 },
            { q: "Solve for x and y: 2x + y = 7, 4x - 3y + 1 = 0.", o: ["x=2, y=3", "x=3, y=2", "x=1, y=5", "x=5, y=1"], a: 0 },
            { q: "Graphically, the pair of equations 6x - 3y + 10 = 0 and 2x - y + 9 = 0 represents two lines which are:", o: ["Intersecting at exactly one point", "Intersecting at exactly two points", "Coincident", "Parallel"], a: 3 },
            { q: "Which of the following pairs of linear equations are consistent?", o: ["x + y = 5, 2x + 2y = 10", "x - y = 8, 3x - 3y = 16", "2x + y - 6 = 0, 4x - 2y - 4 = 0", "Both A and C"], a: 3 },
            { q: "The value of c for which the pair of equations cx - y = 2 and 6x - 2y = 3 will have infinitely many solutions is:", o: ["3", "-3", "-12", "No value"], a: 3 },
            { q: "In a cyclic quadrilateral ABCD, angles are A = 4y + 20, B = 3y - 5, C = 4x, D = 7x + 5. Find x and y.", o: ["x=15, y=10", "x=10, y=15", "x=20, y=15", "x=15, y=20"], a: 0 },
            { q: "A boat goes 20 km upstream and 30 km downstream. If speed of boat in still water is x and speed of stream is y, then time taken for upstream is:", o: ["20/(x+y)", "20/(x-y)", "30/(x-y)", "30/(x+y)"], a: 1 },
            { q: "The value of k for which the equations 3x + 5y = 0 and kx + 10y = 0 has a non-zero solution is:", o: ["0", "2", "6", "10"], a: 2 },
            { q: "If x = a, y = b is the solution of the pair of equations x - y = 2 and x + y = 4, find a and b.", o: ["a=3, b=1", "a=1, b=3", "a=2, b=2", "a=4, b=0"], a: 0 },
            { q: "The lines x = a and y = b are:", o: ["Parallel", "Intersecting at (a, b)", "Coincident", "None of these"], a: 1 },
            { q: "If the angles of a triangle are x, y and 40°, and the difference between the two angles x and y is 30°, then find x and y.", o: ["85°, 55°", "70°, 40°", "80°, 50°", "100°, 40°"], a: 0 },
            { q: "The equations ax + by + c = 0 and dx + ey + f = 0 represent the same straight line if:", o: ["a/d = b/e = c/f", "a = d, b = e", "c = f", "None"], a: 0 },
            { q: "Determine k so that the system of equations kx + 3y = k-3 and 12x + ky = k has infinite solutions.", o: ["6", "-6", "0", "6 or -6"], a: 0 },
            { q: "The father's age is six times his son's age. Four years hence, the age of the father will be four times his son's age. The present ages, in years, of the son and the father are, respectively:", o: ["4 and 24", "5 and 30", "6 and 36", "3 and 24"], a: 2 },
            { q: "The pair of equations x = a and y = b graphically represents lines which are:", o: ["Parallel", "Intersecting at (b, a)", "Coincident", "Intersecting at (a, b)"], a: 3 },
            { q: "For what value of k, the system of equations 2x + 3y = 5 and 4x + ky = 10 has infinite solutions?", o: ["1", "3", "6", "0"], a: 2 },
            { q: "If 10/(x+y) + 2/(x-y) = 4 and 15/(x+y) - 5/(x-y) = -2, then:", o: ["x=3, y=2", "x=2, y=3", "x=5, y=1", "x=1, y=5"], a: 0 },
            { q: "The solution of 2/x + 3/y = 13 and 5/x - 4/y = -2 is:", o: ["x=1/2, y=1/3", "x=1/3, y=1/2", "x=2, y=3", "x=3, y=2"], a: 0 },
            { q: "Which of these is NOT a linear equation in two variables?", o: ["2x + 3y = 5", "x + y = 0", "x² + x = 2", "x - y = 1"], a: 2 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer Variables
        let timeLeft = 1800; // 30 Minutes
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start Quiz
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 300) { // Last 5 mins warning
                        document.querySelector('.timer-box').style.background = 'rgba(213, 0, 0, 0.4)';
                        document.querySelector('.timer-box').style.borderColor = '#ff5252';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `Question ${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Update Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index); // A, B, C, D
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "Superb! Equations Master! 📐";
            else if(accuracy >= 70) feedback.innerText = "Good job! Focus on word problems. 📝";
            else if(accuracy >= 50) feedback.innerText = "Average. Practice elimination method. 📉";
            else feedback.innerText = "Need more practice on graphs. Try again! 🔥";
        }
    </script>
</body>
</html>
