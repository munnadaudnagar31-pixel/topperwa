    <style>
        /* --- PROFESSIONAL HINDI THEME (Saffron) --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            --header-gradient: linear-gradient(135deg, #e65100 0%, #ff6f00 100%);
            --card-bg: #ffffff;
            --text-main: #3e2723;
            --text-sub: #e65100;
            --option-bg: #fff8e1;
            --correct-color: #2e7d32; /* Green */
            --wrong-color: #c62828;   /* Red */
            --timer-bg: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER with TIMER --- */
        .quiz-header {
            background: var(--header-gradient);
            padding: 20px 25px; display: flex; align-items: center; justify-content: space-between;
            color: white; z-index: 10; box-shadow: 0 4px 15px rgba(230, 81, 0, 0.3);
        }
        .close-btn { 
            font-size: 24px; cursor: pointer; text-decoration: none; color: white; opacity: 0.9; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%; transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }
        
        .timer-box {
            background: var(--timer-bg); padding: 8px 18px; border-radius: 30px;
            font-family: 'Poppins', monospace; font-size: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(5px);
        }

        /* --- PROGRESS BAR --- */
        .progress-container { width: 100%; height: 6px; background: #ffe0b2; }
        .progress-bar { height: 100%; background: #ef6c00; width: 0%; transition: width 0.3s ease; }

        /* --- MAIN QUIZ CARD --- */
        .quiz-container {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }

        .question-card {
            background: var(--card-bg); width: 100%; max-width: 650px;
            padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(230, 81, 0, 0.1);
            animation: slideUp 0.4s ease-out; margin-bottom: 90px; position: relative;
            border-top: 5px solid #ff6f00;
        }

        /* Literature Decoration */
        .question-card::before {
            content: '“'; position: absolute; top: 10px; left: 20px; font-size: 60px;
            color: #fff3e0; font-family: 'Lora', serif; z-index: 0;
        }

        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1; }
        .q-count { font-size: 13px; font-weight: 700; color: #fff; background: #e65100; padding: 4px 12px; border-radius: 20px; }
        .q-subject { font-size: 13px; font-weight: 700; color: #e65100; letter-spacing: 1px; }

        .question-text { 
            font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.6; 
            color: #3e2723; position: relative; z-index: 1;
        }

        /* --- OPTIONS --- */
        .options-list { display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }

        .option-btn {
            background: var(--option-bg); border: 2px solid transparent; padding: 16px 20px;
            border-radius: 16px; font-size: 16px; color: #4e342e; font-weight: 500; text-align: left;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        
        .option-circle {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ffcc80;
            margin-right: 15px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; 
            font-size: 14px; color: #ff9800; font-weight: 700; transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.98); background: #ffe0b2; }
        
        /* Correct State */
        .option-btn.correct { background: #e8f5e9; border-color: var(--correct-color); color: #1b5e20; }
        .option-btn.correct .option-circle { background: var(--correct-color); border-color: var(--correct-color); color: white; content: '✓'; }
        
        /* Wrong State */
        .option-btn.wrong { background: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); animation: shake 0.4s; }
        .option-btn.wrong .option-circle { background: var(--wrong-color); border-color: var(--wrong-color); color: white; }

        .option-btn.disabled { pointer-events: none; opacity: 0.7; }

        /* --- FOOTER --- */
        .quiz-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: white;
            padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            display: flex; justify-content: center; z-index: 20;
        }

        .next-btn {
            background: var(--header-gradient);
            color: white; border: none; width: 100%; max-width: 650px; padding: 16px; 
            border-radius: 18px; font-size: 18px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.3); transition: 0.2s; display: none;
        }
        .next-btn:active { transform: scale(0.98); }

        /* --- RESULT SCREEN --- */
        .result-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; animation: fadeIn 0.5s;
            background: white; position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
        }
        
        .result-card {
            width: 100%; max-width: 400px; background: #fff3e0;
            border-radius: 30px; padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(230, 81, 0, 0.15);
        }

        .score-circle {
            width: 130px; height: 130px; border-radius: 50%;
            background: white; border: 8px solid #e65100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-num { font-size: 38px; font-weight: 800; color: #e65100; line-height: 1; }
        .score-label { font-size: 11px; color: #ef6c00; font-weight: 700; margin-top: 5px; letter-spacing: 1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: white; padding: 15px 5px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-val { font-size: 18px; font-weight: 700; display: block; }
        .stat-lbl { font-size: 10px; color: #5d4037; font-weight: 600; text-transform: uppercase; }

        .green-text { color: #2e7d32; }
        .red-text { color: #c62828; }
        .blue-text { color: #1565c0; }

        .action-btn {
            display: block; width: 100%; padding: 16px; border-radius: 16px;
            font-weight: 700; font-size: 16px; margin-bottom: 12px; cursor: pointer; border: none;
        }
        .btn-primary { background: #e65100; color: white; box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3); }
        .btn-secondary { background: #ffe0b2; color: #e65100; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

    
        /* === ENHANCED QUIZ AESTHETICS === */
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .option-btn:hover::before { left: 100%; }
        .option-btn:hover:not(.disabled):not(.correct):not(.wrong) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .option-btn.correct {
            animation: correctPulse 0.6s ease;
        }
        .option-btn.wrong {
            animation: wrongShake 0.5s ease;
        }
        .option-btn.correct::after {
            content: '✓';
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; font-weight: 700;
            color: #00C853;
        }
        .option-btn.wrong::after {
            content: '✗';
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; font-weight: 700;
            color: #FF1744;
        }
        @keyframes correctPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.03); }
            60% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .question-card, .quiz-body {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .progress-bar, .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        .score-circle {
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .next-btn, #next-btn {
            transition: all 0.3s ease !important;
        }
        .next-btn:hover, #next-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2) !important;
        }
        /* Disabled state for options - prevent interaction */
        .option-btn.disabled, .option-btn:disabled {
            pointer-events: none !important;
            cursor: not-allowed !important;
        }
        /* Quiz result screen improvements */
        .result-screen, .result-box {
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        // --- DATA: 30 MCQs from 'Akshar Gyan' ---
        const questions = [
            { q: "'अक्षर ज्ञान' कविता की कवयित्री कौन हैं?", o: ["अनामिका", "महादेवी वर्मा", "सुभद्रा कुमारी चौहान", "मीराबाई"], a: 0 },
            { q: "अनामिका का जन्म कब हुआ था?", o: ["17 अगस्त 1961", "17 अगस्त 1960", "17 अगस्त 1962", "17 अगस्त 1965"], a: 0 },
            { q: "अनामिका का जन्म कहाँ हुआ था?", o: ["मुजफ्फरपुर (बिहार)", "पटना", "भागलपुर", "राँची"], a: 0 },
            { q: "यह कविता किस काव्य संग्रह से संकलित है?", o: ["कवि ने कहा", "बीजाक्षर", "गलत पते की चिट्ठी", "टोकरी में दिगंत"], a: 0 },
            { q: "बच्चे के 'चौखटे' में क्या नहीं अँटता?", o: ["क (कबूतर)", "ख", "ग", "घ"], a: 0 },
            { q: "कबूतर (क) कैसा होता है?", o: ["फुदक जाता है/पंक्ति से उतर जाता है", "सो जाता है", "रोता है", "डरता है"], a: 0 },
            { q: "'ख' से क्या बनता है?", o: ["खरगोश", "खलनायक", "खरबूजा", "खाना"], a: 0 },
            { q: "खरगोश की खालिस _____।", o: ["बेचैनी", "नींद", "भूख", "प्यास"], a: 0 },
            { q: "'ग' से क्या बनता है?", o: ["गमला", "गाय", "गणेश", "गधा"], a: 0 },
            { q: "गमले का क्या होता है?", o: ["टूट जाता है", "गिर जाता है", "फूट जाता है", "भर जाता है"], a: 0 },
            { q: "'घ' से क्या बनता है?", o: ["घड़ा", "घर", "घड़ी", "घोड़ा"], a: 0 },
            { q: "घड़ा कहाँ लुढ़क जाता है?", o: ["घ (घड़े) पर", "जमीन पर", "छत पर", "नदी में"], a: 0 },
            { q: "'ङ' (अं) को बच्चा क्या समझता है?", o: ["माँ की गोद में बैठा बेटा", "कुत्ता", "बिल्ली", "खिलौना"], a: 0 },
            { q: "'ङ' के 'ड' को वह क्या समझता है?", o: ["माँ", "पिता", "गोद", "बेटा"], a: 0 },
            { q: "'ङ' के बिंदु को वह क्या समझता है?", o: ["गोद में बैठा बेटा", "माँ", "खिलौना", "रोटी"], a: 0 },
            { q: "बच्चे की आँखों में क्या आ जाते हैं?", o: ["आँसू", "नींद", "खुशी", "गुस्सा"], a: 0 },
            { q: "आँसू कब आते हैं?", o: ["पहली विफलता (असफलता) पर", "मार पड़ने पर", "गिरने पर", "भूख लगने पर"], a: 0 },
            { q: "सृष्टि की विकास कथा का प्रथमाक्षर क्या है?", o: ["विफलता के आँसू", "सफलता की हँसी", "अक्षर ज्ञान", "खेल"], a: 0 },
            { q: "अनामिका ने किस विषय में एम.ए. और पीएच.डी. की?", o: ["अंग्रेजी", "हिंदी", "संस्कृत", "इतिहास"], a: 0 },
            { q: "अनामिका किस कॉलेज में प्राध्यापिका (Professor) हैं?", o: ["सत्यवती कॉलेज (दिल्ली वि०वि०)", "मिरांडा हाउस", "गार्गी कॉलेज", "पटना कॉलेज"], a: 0 },
            { q: "'गलत पते की चिट्ठी' किसकी रचना है?", o: ["अनामिका", "वीरेन डंगवाल", "कुंवर नारायण", "अज्ञेय"], a: 0 },
            { q: "'बीजाक्षर' किसकी कृति है?", o: ["अनामिका", "निराला", "पंत", "दिनकर"], a: 0 },
            { q: "कवयित्री ने 'ङ' के उच्चारण में किसे कठिनाई होती है?", o: ["अबोध बालक को", "बूढ़े को", "कवि को", "शिक्षक को"], a: 0 },
            { q: "पंक्ति से कौन उतर जाता है?", o: ["क", "ख", "ग", "घ"], a: 0 },
            { q: "किसका ध्यान क (कबूतर) लिखते समय भटक जाता है?", o: ["अबोध बालक का", "शिक्षक का", "कवयित्री का", "चिड़िया का"], a: 0 },
            { q: "अनामिका को कौन सा पुरस्कार मिला है?", o: ["राष्ट्रभाषा परिषद पुरस्कार और भारत भूषण अग्रवाल पुरस्कार", "ज्ञानपीठ", "पद्म श्री", "नोबेल"], a: 0 },
            { q: "बालक किसे माँ और बेटा मानता है?", o: ["'ङ' और उसके बिंदु को", "क और ख को", "ग और घ को", "अ और आ को"], a: 0 },
            { q: "यह कविता किस शैली में लिखी गई है?", o: ["समकालीन/मनोवैज्ञानिक", "छायावादी", "भक्ति", "वीर रस"], a: 0 },
            { q: "अनामिका के पिता का क्या नाम था?", o: ["श्यामानंद किशोर", "रामानंद किशोर", "परमानंद किशोर", "विवेकानंद"], a: 0 },
            { q: "कविता में 'अनवरत' का क्या अर्थ है?", o: ["लगातार (कोशिश)", "रुक-रुक कर", "कभी-कभी", "नहीं"], a: 0 }
        ];

        // --- QUIZ LOGIC ---
        let currentQuestion = 0;
        let score = 0;
        let wrongCount = 0;
        let isAnswered = false;
        
        // Timer
        let timeLeft = 600; // 10 Minutes
        let timerInterval;

        // Elements
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const timerDisplay = document.getElementById('time-left');
        
        // Screens
        const quizUI = document.getElementById('quiz-ui');
        const resultUI = document.getElementById('result-ui');
        const footer = document.getElementById('footer');
        const header = document.getElementById('header');

        // Start
        startTimer();
        loadQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                } else {
                    timeLeft--;
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    
                    if(timeLeft < 60) {
                        timerDisplay.style.color = '#c62828';
                    }
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswered = false;
            nextBtn.style.display = "none";
            
            const q = questions[currentQuestion];
            qNumber.innerText = `${currentQuestion + 1} / ${questions.length}`;
            qText.innerText = q.q;
            
            // Progress Bar
            const progressPercent = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            optionsContainer.innerHTML = "";
            q.o.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                
                const circle = document.createElement('div');
                circle.className = 'option-circle';
                circle.innerText = String.fromCharCode(65 + index);
                
                const text = document.createElement('span');
                text.innerText = opt;

                btn.appendChild(circle);
                btn.appendChild(text);
                
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            quizUI.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if(isAnswered) return;
            isAnswered = true;
            
            const correctIndex = questions[currentQuestion].a;
            const allOptions = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct');
                wrongCount++;
                
                // VIBRATION (Android)
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }

            for (let i = 0; i < allOptions.length; i++) {
                allOptions[i].classList.add('disabled');
            }

            nextBtn.style.display = "block";
            footer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            quizUI.style.display = 'none';
            footer.style.display = 'none';
            header.style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            
            resultUI.style.display = 'flex';
            
            const total = questions.length;
            const accuracy = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('correct-count').innerText = score;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('accuracy-percent').innerText = `${accuracy}%`;
            
            const feedback = document.getElementById('feedback-text');
            if(accuracy >= 90) feedback.innerText = "ज्ञानी! आपने जीवन का पहला अक्षर सीख लिया! 🅰️";
            else if(accuracy >= 70) feedback.innerText = "बहुत बढ़िया! माँ-बेटे का रिश्ता समझ गए। 👍";
            else if(accuracy >= 50) feedback.innerText = "अच्छा है। 'क' लिखना सीखें! ✍️";
            else feedback.innerText = "विफलता से डरो मत, फिर से पढ़ो! 🔥";
        }
    </script>

    <!-- BACK BUTTON & QUIZ INTEGRITY FIX -->
    <script>
    (function() {
        // Prevent back button from returning to pre-filled questions
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function(e) {
            history.pushState(null, null, location.href);
            if(confirm('Are you sure you want to leave the quiz? Your progress will be lost.')) {
                // Find the back link (close button or home link)
                var backLink = document.querySelector('.close-btn, .home-link');
                if(backLink && backLink.href) {
                    window.location.href = backLink.href;
                } else {
                    history.back();
                    history.back();
                }
            }
        });
        
        // Prevent page refresh retaining answers (force clean state)
        if(window.performance && window.performance.navigation.type === 1) {
            // Page was refreshed - ensure clean state
            var allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(function(btn) {
                btn.classList.remove('correct', 'wrong', 'disabled', 'selected');
                btn.disabled = false;
            });
        }
        
        // Prevent right-click context menu to avoid cheating
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        
        // Prevent text selection on options to avoid copy-paste cheating
        document.addEventListener('selectstart', function(e) {
            if(e.target.closest('.option-btn, .options-list, .options-container')) {
                e.preventDefault();
            }
        });
    })();
    </script>
</body>
